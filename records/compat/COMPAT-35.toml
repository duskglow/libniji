id = "COMPAT-35"
behaviour = "A program's copy of `_r_debug` (an `R_X86_64_COPY` relocation; §27.4; DL-23, coordinator ruling 2026-11-19)"
glibc = "The copy holds the values at the time of the copy (`r_state` `RT_ADD`) and does not change after it; `DT_DEBUG` names `ld.so`'s own (black-box probe P-DL23-1)"
liella = "The copy is the live rendezvous for that program: every later change (`r_map`, `r_state`) is written to it as well as to `ld.so`'s own"
restore = "A tunable read at startup that stops the loader writing the program's copy after the copy relocation (a start-time snapshot). Registered only: no program is known to depend on the copy staying stale, and the snapshot is a subset of what the live copy holds"
cost = "none expected: the flag would be read once, where the start keeps or drops the copy (`ld::debug::keep_copy`, a cold path reached only by a program with the copy)"
status = "registered"
decisions = ["D-27.62"]
story = "DL-23-2"
