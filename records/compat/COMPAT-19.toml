id = "COMPAT-19"
behaviour = "Objects whose `PT_GNU_STACK` asks for an executable stack (§27, phase 14; threat model loader rule 10, R14-13, owner approval R14-15 #2549 2026-11-04; id assigned by ruling #2660; implemented by D-27.66)"
glibc = "A library linked with `-z execstack` loads, and afterwards the main stack and the stacks of threads created before the `dlopen` are mapped `rwxp`; a program linked that way starts with `rwxp` stacks (black-box probe, DL-THREAT-TEXT)"
liella = "Refused by default: `dlopen` fails with a `dlerror` message and maps nothing; such a program or startup dependency is refused at startup; no stack is made executable. Each refusal names the object, the program or the `dlopen` caller, and the ways in"
restore = "`GLIBC_TUNABLES=liella.compat.execstack=1`, parsed at start-up into `liella::config::Tunables`: the loader accepts such a program, startup dependency or `dlopen`ed library and makes the main stack and the library-made thread stacks, existing and later, executable (a caller-supplied stack is left as it is), as the reference does; ignored in a secure (`AT_SECURE`, setuid/setgid) process because it weakens behaviour, as COMPAT-12 is (owner ruling #2662). Tests: `crates/ld/tests/exec_stack.rs`. **Amendment (owner ruling 2026-11-20, agreed with Yohane; registered, not implemented):** a per-object allowlist: vendor fragments `/usr/lib/niji/execstack.d/*.conf`, admin fragments `/etc/niji/execstack.d/*.conf` overriding a vendor fragment of the same name (an empty admin file masks it); one exact resolved path (after symlinks) of the mapped object per line; trusted only if the fragment, the object and their directories are root-owned and not group- or other-writable; no patterns; no global switch; ignored in an `AT_SECURE` process (like the variable); read only on the `PT_GNU_STACK` executable branch; a debug variable logs acceptances. Built on first need; it blocks the versioned release"
cost = "none on a path without such an object: one relaxed load and branch in `ld.so`'s start after the C library's early initialisation, and one relaxed load per `pthread_create` under the thread-list lock it already holds; the tunable is read only on the `PT_GNU_STACK` executable branch"
status = "implemented"
status_text = "implemented (the tunable, D-27.66); the allowlist amendment is registered, not implemented"
