tests = ["crates/core/tests/deb_manifest.rs::libm_so_is_a_script_adding_libmvec_as_needed_in_both_flavours", "crates/core/tests/deb_manifest.rs::coexist_lm_brings_in_libmvec_only_for_a_vector_call"]
body = '''
**`-lm` links `libm.so.6` and, only when the program calls a vector variant, `libmvec.so.1`** (LIBM-SO-MVEC, GitHub issue #28; amends D-10.124 and D-27.51, which kept the development `libm.so` a link to `libm.so.6`). Their premise, that a program built against libniji never calls a vector variant because libniji's headers declare no `simd` variants, does not hold while libniji ships no headers: a system built on the packages compiles with other headers, and gcc vectorises a maths loop at `-O3 -ffast-math` (gfortran at `-O3`) into `_ZGV*` calls, which then fail to link with plain `-lm`. Both package flavours now ship `libm.so` as a GNU ld script (`tools/deb/system/libm-so.ld` in `libc6-dev`, `tools/deb/coexist/libm-so.ld` in `niji6-dev`, paths inside the sysroot like the `libc.so` script), written from the GNU ld manual's file commands: `GROUP ( /lib/x86_64-linux-gnu/libm.so.6 AS_NEEDED ( /lib/x86_64-linux-gnu/libmvec.so.1 ) )`. `libm.so.6` keeps the linker's current `--as-needed` state, as the link did; `libmvec.so.1` is recorded only when an object references one of its symbols, so a program with no vector call gains no dependency. Static links are unchanged (`-static -lm` reads `libm.a`). Tests: `crates/core/tests/deb_manifest.rs` (`libm_so_is_a_script_adding_libmvec_as_needed_in_both_flavours`: the manifest's two `libm.so` rows are text rows of the two scripts, whose commands are equal; `coexist_lm_brings_in_libmvec_only_for_a_vector_call`: with the coexist packages unpacked, the issue's program linked `-O3 -ffast-math ... -lm` needs `libmvec.so.1` and prints 0.8415, a scalar program linked `--no-as-needed -lm` needs `libm.so.6` and not `libmvec.so.1`); the package checks `tools/deb/check.sh`, `check-system.sh` and `root-system.sh` (the system flavour, run in an installed root).
'''
