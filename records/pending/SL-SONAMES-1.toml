body = '''
**`libresolv.so.2`, `libBrokenLocale.so.1` and the remaining development archives (SL-SONAMES, plan/system-libc.md §6 item 5; amends D-27.9, completes D-16.6).** `cargo xtask so` builds both libraries with the D-27.9 generator (`xtask/src/placeholders.rs`): version nodes from `spec/abi/versions.tsv`, `DT_NEEDED libc.so.6`, no `GLIBC_PRIVATE` (`__ns_get16`/`__ns_get32` are not exported), each checked by `product_errors`. **libresolv: one copy of the code and state.** The 67 names libresolv owns (`inet_net_pton`, `ns_*`, `__p_*`, the compat `res_gethostbyname*`, ...) stay defined by `libc.a` only (D-16.6). `libc.so.6` exports each as `__liella_fwd_<name>@LIELLA_PRIVATE`, an alias made with `--defsym` in its link (no second definition, no extra instruction; the plain name stays local, so a program that omits `-lresolv` still fails to link as with the reference). Each function export of `libresolv.so.2` is a single `jmp __liella_fwd_<name>@PLT`, so the resolver state (`_res`, `__res_state`) is `libc.so.6`'s. The three data exports (`__p_class_syms`, `__p_type_syms`, `_res_opcodes`) are `libresolv.so.2`'s own objects of the versions.tsv sizes, filled by a constructor that copies `libc.a`'s object (size from `nm -S`; larger than the row is a build error) through the exported name, so a program's copy-relocated object is the one filled; a program that writes into them does not change what `libc.so.6`'s printers read. **libBrokenLocale: an override (the amendment).** D-27.9 never defines a `libc.so.6` name twice; `OVERRIDES` lists the one exception, `libBrokenLocale.so.1`'s `__ctype_get_mb_cur_max@@GLIBC_2.2.5`, because replacing it is the library's only effect. Probe-settled (reference linked with `-lBrokenLocale`, dynamic and static, locales built with localedef for every code-set width the charmaps have): MB_CUR_MAX 1, 2, 3, 4, 6 becomes 1, 1, 2, 2, 4 (KOI8-R/ISO-8859-1/TIS-620 1; BIG5/EUC-KR/GBK/SHIFT_JIS/BIG5-HKSCS 1; EUC-JP/EUC-JP-MS 2; GB18030/EUC-TW 2; UTF-8 4). Liella's body (`crates/libc-so/placeholders/libBrokenLocale.c`): half of libc's width (`nl_langinfo(_NL_CTYPE_MB_CUR_MAX)`, a word item, spec D.1.5) rounded up, and 4 for 6 (RFC 3629's longest UTF-8 sequence); `libBrokenLocale.a` holds the same body defining the name directly (libc.a's definition is overridable, D-X.14). **Archives and links.** Empty `libresolv.a`, `libg.a`, `libmcheck.a`, `libpthread_nonshared.a` join D-27.9's (`-l<x>` resolves in a static link; the reference's `libmcheck.a` sets a hook only its malloc debug library reads, which Liella's does not have, D-27.9). `target/liella` and the development package get `libresolv.so -> libresolv.so.2` and `libBrokenLocale.so -> libBrokenLocale.so.1`; `libm.so` stays a link to `libm.so.6`: with no `libmvec`, no linker script is needed. Tests: `crates/core/tests/sonames_products.rs` (a program linked `-lresolv -lpthread -ldl -lrt -lm` runs dynamically and statically with the same output, including the data objects; the exports and aliases; MB_CUR_MAX with and without `-lBrokenLocale`, dynamic and static; the empty archives), `placeholders::tests`.
'''
