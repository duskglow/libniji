body = '''
**Slice 7 headers: generator additions and the two omitted declarations** (SL-HEADERS-S07, SL-HEADERS-S07-2; plan/headers.md section 4, slice 7; extends D-X.113). Slice 7 generates 24 headers: `fcntl.h`, `sys/fcntl.h`, `sys/stat.h`, `sys/statvfs.h`, `sys/statfs.h`, `sys/vfs.h`, `dirent.h`, `sys/dir.h`, `sys/time.h`, `sys/times.h`, `utime.h`, `sys/resource.h`, `sys/utsname.h`, `sys/select.h`, `poll.h`, `sys/poll.h`, `sys/mman.h`, `sys/uio.h`, `sys/file.h`, `sys/sysmacros.h`, `paths.h`, `libgen.h`, `sys/xattr.h`, `sys/sendfile.h`. `sys/wait.h`, `wait.h`, `sys/param.h`, `spawn.h` and `sys/ioctl.h` need the signal, scheduling and terminal vocabulary of slices 8 and 14 and move to SL-HEADERS-S07-TAIL (ruling #6379); no template, table row or check entry for them exists in this slice. Generator additions (`xtask/src/headers.rs`), each driven by a `spec/abi` row: members of an anonymous union whose name is reserved (the `ru_maxrss` family) are emitted as a union member plus an alias macro; enumeration members and enumeration-typed parameters (spelled `unsigned int`, as `prlimit` needs); the kernel `__u8` to `__s64` member types; members whose type is a typedef of an anonymous structure (`f_fsid`); an opaque `DIR` (an incomplete structure tag). `struct statx_timestamp` is a layout row of its own so `struct statx` members use it. Macros of these headers are written from POSIX, the C standard and the man pages: `S_IS*`, `S_TYPEIS*`, the `st_atime` family, `timerisset`/`timerclear`/`timercmp`/`timeradd`/`timersub`, `major`/`minor`/`makedev` (expanded in place by always-inline `gnu_dev_*`; the exported functions serve addresses), `basename` (the `__xpg_basename` form), `MAP_FAILED`, `FD_*`. `sys/dir.h` ships (R-H7). Two functions are exported but not declared, each with a differences row and a registered compatibility option: `getumask` (omitted: the reference declares it, but no library version defines it, and libniji declares only what it exports; `headers/reserved.tsv`) and `bsd_signal` (the symbol stays exported with its version; no header declares it, a BSD interface that POSIX removed in 2008; the declaration belongs to `<signal.h>`, slice 8).
'''
