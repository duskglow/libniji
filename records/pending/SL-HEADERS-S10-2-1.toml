body = '''**Slice 10 header decisions: `<regexp.h>` fails to compile, `FILE` incomplete in `<wchar.h>`, `__NIJI_TIME_BITS_UNCHECKED`** (SL-HEADERS-S10, SL-HEADERS-S10-2; plan/headers.md sections 2.3 and 5.1; rulings #6415 and #6416). (1) `<regexp.h>` is shipped (14 packages include it, mostly behind configure checks) and ends in an `#error` in every configuration, with or without the six macros of the SUSv2 usage (`INIT`, `GETC`, `PEEKC`, `UNGETC`, `RETURN`, `ERROR`), so a feature check reaches the same answer as against the reference system. `step`, `advance`, `loc1`, `loc2` and `locs` stay exported only as compat-version entries (`GLIBC_2.2.5`, no default version): a new link against them fails, an existing binary keeps working (D-29.3). Probe table (black box: exit status only, the probe's own `-fsyntax-only` and link units, reference system and libniji, the 40 configurations of `ftm-configs.tsv`); both columns gave the same result in every row, so there is no differences row and no compat option: bare include fails 40 of 40 (libniji 40 of 40; `time64only` is refused earlier by `features.h` for every header); six macros then the include fails 40 of 40 (same); six macros then calls of `compile`, `step`, `advance` and uses of `loc1`, `loc2`, `locs` fails 40 of 40 (same); `__has_include(<regexp.h>)` is true (same); linking `step` and `advance` declared by the probe at the default version fails (same); linking `loc1`, `loc2`, `locs` declared extern fails (same); linking `compile` fails, no such export (same); control, linking `strlen`, links (same). `header_check.py` has an inverse unit: `regexp.h` must fail in every accepted configuration with libniji's own message. (2) `<wchar.h>` declares the tag `struct _IO_FILE` and the typedefs `FILE` and `__FILE` without defining the structure, as `visibility.tsv` has it (`<stdio.h>` defines it); `<fnmatch.h>` restores the feature-test macros `features.h` derived, because the table shows none for it; `<stdbit.h>` declares its functions `extern` with `gnu_inline`, so taking an address names the exported `stdc_*` symbol, and its C++ type-generic names are macros over helper overloads. (3) The generator emits the bit-field members of `layouts.tsv` (`regex_t` has them) as one group per storage unit. (4) `features.h` skips the `_TIME_BITS` requires-`_FILE_OFFSET_BITS` check when `__NIJI_TIME_BITS_UNCHECKED` is defined before it is included; only `fnmatch.h` defines it, because the probe table shows `<fnmatch.h>` compiling under `_TIME_BITS=64` alone and its interface has no `time_t` or `off_t` member or parameter.'''
