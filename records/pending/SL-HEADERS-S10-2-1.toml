body = '''
**Slice 10 header decisions: `<regexp.h>` fails to compile, bit-field members, `__NIJI_TIME_BITS_UNCHECKED`** (SL-HEADERS-S10, SL-HEADERS-S10-2; plan/headers.md sections 2.3 and 5.1; rulings #6415 and #6416).

1. `<regexp.h>` is shipped (14 packages include it, mostly behind configure checks) and fails to compile with an `#error` in every configuration, with or without the six macros the SUSv2 usage requires (`INIT`, `GETC`, `PEEKC`, `UNGETC`, `RETURN`, `ERROR`). A feature check on a program that includes it therefore reaches the same answer as against the reference system. `step`, `advance`, `loc1`, `loc2` and `locs` stay exported only as compat-version entries (`GLIBC_2.2.5`, no default version), so a new link against them fails the same way and an existing binary keeps working (D-29.3). `header_check.py` has an inverse unit: `regexp.h` must fail in every accepted configuration, with libniji's own message.

   Probe table (black box: exit status only, the probe's own `-fsyntax-only` units and link units, reference system and libniji; 40 configurations of `ftm-configs.tsv`):

   | probe | reference | libniji |
   | --- | --- | --- |
   | bare `#include <regexp.h>` | fails, 40 of 40 | fails, 40 of 40 (`time64only` is rejected earlier by `features.h`, as for every header) |
   | six macros defined, then the include | fails, 40 of 40 | fails, 40 of 40 |
   | six macros, then calls of `compile`, `step`, `advance` and uses of `loc1`, `loc2`, `locs` | fails, 40 of 40 | fails, 40 of 40 |
   | `__has_include(<regexp.h>)` | true | true |
   | link `step` + `advance` declared by the probe, default version | fails | fails |
   | link `loc1`, `loc2`, `locs` (extern, declared by the probe) | fails | fails |
   | link `compile` | fails (no such export) | fails (no such export) |
   | control: link `strlen` | links | links |

   No row differs, so no differences row and no compat option.

2. The generator emits the bit-field members of `layouts.tsv` (`regex_t` has them) as one group per storage unit, so the generated struct has the table's size, alignment and member offsets (checked by P1).

3. `features.h` skips the `_TIME_BITS` requires-`_FILE_OFFSET_BITS` check when `__NIJI_TIME_BITS_UNCHECKED` is defined before it is included. Only `fnmatch.h` defines it: the probe table of the reference shows `<fnmatch.h>` compiling under `_TIME_BITS=64` alone, and its interface has no `time_t` or `off_t` member or parameter.
'''
