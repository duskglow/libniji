body = '''
**Proposed (owner rulings R1-R4 of `plan/layout-budget-rethink.md` pending): start-up layout in window bins, gated on bytes** (LAYOUT-BUDGET-RETHINK).
Finding: the start-up fault bounds flap because each is a step function of where every linked byte lands, ratcheted at the measured count with no visible headroom. On next e47a71997 (Haswell-EP build host, page_faults.c linked as hot_text_products links it, pads at nine insertion points, 0-64 KiB) the fast `tool` count (50, bound 50) goes red after less than 512 bytes of growth in the 442 KiB of hot code ahead of the clusters (red at 97% of pads there) or ahead of the group; release `locale` (47, bound 47) after 1,536 bytes. Data-section shifts move no count (the data clusters hold); the written start-up cluster has 544 bytes left in its pages. Ops history: 13 of 76 red CI verdicts named a start-up bound (9 libm stories); 35 stories were held under LAYOUT-JITTER; layout-family stories used 11.6% of all tokens.
Causes: power-of-two cluster alignment fixes each cluster's own window count but not which clusters share a window (D1); the hot group is one first-touch sequence over all probes, so a probe's count depends on bytes it never runs (D2); the gate counts the step function and cannot attribute (D3); the start-up set follows the tracing host.
Proposal: (R1) bins of at most 64 KiB, 64 KiB-aligned, by probe signature, gaps filled with cold sections; (R2) per-story byte budgets per bin from the link map, fault counts as a per-class release metric; (R3) a start-up set declared by rule (IFUNC candidates, CPU-class pairs, one-level data references) and checked against traces; (R4) interim: clear a held story whose start-up groups did not grow. Stories: handoff/LAYOUT-BUDGET-RETHINK/*.md. No bound or gate changes here.
'''
