body = '''
**Window bins, slice 2: the plan applied** (LAYOUT-WINDOW-BINS-3; implements part of D-X.103 after D-X.108; supersedes the first-window keys of D-X.79 and replaces the 0-fault clusters' power-of-two heads of D-X.63). `cargo xtask so` names every grouped section by its window bin, `.text.sorted.h9<bin, 2 digits><0 member, 1 filler><place, 5 digits>.<f>` (members by list position, then the bin's fillers), renames the planned cold fillers into the gaps, and gives the first member with bytes of every bin after a gap a 64 KiB alignment; bins no counted mode touches follow the last counted bin unaligned. The head bin is not anchored (variant ii, `bins::HEAD_ANCHOR`): a static program's first text fault maps the 64 KiB from the start of its executable segment, which the group follows by a few bytes, so the head bin keeps `HEAD_ROOM` (1 KiB) free and stays in that window; the bins' 64 KiB input alignment also aligns `.text` itself. `hot-text.clusters` and `hot-text.first-window` are deleted. Checks: BIN-WINDOW (every counted bin after the head starts on a 64 KiB boundary of the probe and lies in one window, at every text phase) and FIRST-WINDOW on the head bin. Measured on a Zen 1 build host against next 7288d847a, whole process, fast / release: locale 45 -> 43 / 45 -> 43, tool 49 -> 45 / 48 -> 45, localtime and localtime + mktime 40 -> 37 / 41 -> 37, start-up 11 / 10 and fork 5 unchanged. NOT YET IN FORCE: the strings phase takes 1 fault and float 4 (fast; release 0 and 3), because the signatures trace whole processes and the planner cannot keep a phase mode's measured calls in bins its warm-up touched; the branch lands only after that is fixed and this body is updated.
'''
