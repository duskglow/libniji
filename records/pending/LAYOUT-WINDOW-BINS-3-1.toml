tests = ["xtask/src/bins.rs::placements_name_sections_in_link_order_and_align_each_bin_after_a_gap", "xtask/src/bins.rs::the_head_bin_leaves_room_for_what_precedes_the_group", "xtask/src/bins.rs::a_measured_phase_shares_its_warm_up_windows", "xtask/src/bins.rs::every_bin_fills_to_its_boundary_and_the_group_end_sorts_last", "crates/core/tests/hot_text_products.rs::init_window_bins_start_on_window_boundaries"]
body = '''
**Window bins, slice 2: the plan applied** (LAYOUT-WINDOW-BINS-3 to -5; implements part of D-X.103 after D-X.108; supersedes the first-window keys of D-X.79 and replaces the 0-fault clusters' power-of-two heads of D-X.63). `cargo xtask so` names every grouped section by its window bin, `.text.sorted.h9<bin, 2 digits><0 member, 1 filler><place, 5 digits>.<f>` (members by list position, then the bin's fillers), renames the planned cold fillers into each bin's gap up to its 64 KiB boundary, and gives the first member with bytes of every bin after the head a 64 KiB alignment. The head bin is not anchored (variant ii, `bins::HEAD_ANCHOR`): a static program's first text fault maps the 64 KiB from the start of its executable segment, which the group follows by a few bytes, so the head bin keeps `HEAD_ROOM` (1 KiB) free and stays in that window. `hot-text.clusters` and `hot-text.first-window` are deleted.

Phase modes (LAYOUT-WINDOW-BINS-4): a `page_faults.c` mode that prints `f1 - f0` counts only the faults after its warm-up, so `tools/hottext/regen.sh` writes the warm-up's trace (up to the first `getrusage`) as the signature mode `<mode>.pre`; the planner groups sections by the modes that count them (`bins::counted`), places the start-up groups first (the head bin), and charges a phase mode nothing in a bin its warm-up runs in.

Group end (LAYOUT-WINDOW-BINS-5): the start file carries an empty 64 KiB-aligned section, `bins::GROUP_END`, whose name sorts after every bin, and every bin (the last included) is filled to its boundary, so a program's own text after the group starts on a window boundary. Without it the probe's `main` (plain `.text`) followed the last bin wherever that ended and spanned two windows on the fast products (start-up 12 against 11). `cargo xtask so` refuses a start object without the section.

Checks: BIN-WINDOW (every counted bin after the head starts on a 64 KiB boundary of the probe and lies in one window) and GROUP-END (the group end on a boundary, no bin after it), at every text phase; FIRST-WINDOW on the head bin. Measured on a Zen 1 build host, whole process, every run identical, fast / release, against next 7288d847a: start-up 11 / 10 (unchanged), locale 45 / 45 -> 43 / 43, tool 49 / 48 -> 44 / 44, localtime and localtime + mktime 40 / 41 -> 36 / 36, fork 5 (unchanged), first `%.2f` 3 (unchanged; bound 3), and the 0-fault phases (strings, mktime, rebind) 0 at every `pre` and `cold` pad. The release localtime bounds come down 42 -> 40 because the whole-count slack refuses 36 under 42; tightening every bound to the new levels waits for the other host classes' levels (slice 3).
'''
