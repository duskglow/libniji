body = '''
**The heap's address space grows with its use** (HEAP-ADDRESS-SPACE, -2, -3; GitHub issue #21, 2026-11-17). A segment's 16 MiB window is mapped only as far as its shard hands slabs out: a new segment maps its metadata and 16 slabs (`SEG_FIRST`, 4 MiB of address space, untouched until used: the ten start-up modes of `page_faults.c` use up to 16 classes, and with 2 slabs six of them grew the segment 1 to 3 times, one `mmap` each, which put the growth code into the start-up trace and pushed `free` out of layout bin 0; with 16 none grows, strace on the Zen 1 build host, HEAP-ADDRESS-SPACE-5; ruling #6514 keeps 16: its cost is VmSize, a program's first `malloc` adds +4420 KiB of address space against the reference's +132, none of it touched, and HEAP-SPILL-COLD rechecks a smaller value once the spill exists), and the current segment grows in place by doubling, at most 8 slabs (2 MiB) per step (`Pages::grow`), before a new segment is mapped; a window whose next part is taken by another mapping ends there. Generation 0 of the large-block table is at most 256 slots (`FIRST_LARGE`, one page) with or without an address-space limit, later generations double as under D-3.14 (amends D-3.14's "unlimited keeps the maxima" for this table). The first reservation (D-3.19) is the registry page, the cache chunk and the first segment's mapped part, no longer the whole 16 MiB window; below four times a segment's first mapping (`4 * SEG_MIN`) no segment is mapped (was four whole segments, D-3.14). An address inside a registered window whose slab no cache owns is resolved by the large table (`locate_in`: the window's unmapped part can hold another mapping, a large block's too). The growth runs in one cold, out-of-line function (`grow_segment`); `alloc_small`, `refill` and `take_slab` keep their earlier code apart from the test that leaves for it (HEAP-ADDRESS-SPACE-5: growth inlined into `refill`, +688 B, and a spill parameter had overflowed layout bin 0, +1 start-up fault). Reusing freed blocks of a nearby class (the spill) is not part of this record (follow-up HEAP-SPILL-COLD). Measured with `oracle/heap_address_space.c` (the issue's program; Zen 1 build host; VmSize growth over the start of `main`, KiB): one `malloc` +16448 -> +4420 (reference +132); 200000 blocks of 96..159 bytes +32836 -> +28996 (+27984); every other one refilled with `malloc(120)` +49220 -> +39236 (+29568); a pointer array grown to 200000 by doubling `realloc` +67652 -> +41288 (+28052); the least `RLIMIT_AS` over start the program needs 67652 -> 42000 (+29568). Not changed: empty segments keep their address space (returning it needs a design for the lock-free registry readers), and the 16-byte steps of the reference's chunk sizes are not copied (a refill of class 112 holes by `malloc(120)` maps new slabs). Without the spill the refill and realloc steps and the `RLIMIT_AS` need do not yet meet the issue's targets (refill 33092, realloc 35144, need 35152 KiB, measured with the spill); ruling #6513 lands growth with use now with those bounds at the measured levels, and HEAP-SPILL-COLD closes the gap. Tests: `the_heap_keeps_address_space_near_its_use` (core: malloc1 and alloc within their measured value plus one slab, refill and realloc within their measured value, and the program under `RLIMIT_AS` = start + 42000 KiB), the rt heap tests of `heap_and_sync.rs`.
'''
