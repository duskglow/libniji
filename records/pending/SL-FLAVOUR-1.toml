body = '''
**The system build flavour and Liella's packages under Debian's C library names (SL-FLAVOUR; plan/system-libc.md sections 3.1-3.3 and 6 item 2; owner rulings R1 #5535 and R2 #5536; amends D-X.94: a second packaging target beside the coexisting one, which stays the default and unchanged).** `tools/deb/build.sh --flavour system` builds the same tree with `LIELLA_PREFIX=/` and `LIELLA_LIBDIR=usr/lib/x86_64-linux-gnu` (so Liella's pinned sonames resolve to `/usr/lib/x86_64-linux-gnu`, the cache is `/etc/ld.so.cache`, the default and trusted directories are `Arch::SYSTEM_DIRS`; D-27.16, D-X.95; the `/` prefix builds and the packaged loader resolves `libc.so.6` there under `--list`) and packages it (`tools/deb/system.sh`) as six packages, `Source: liella`, Maintainer as D-X.94, one version `<abi>+liella<YYYYMMDD>.<n>-<rev>` without an epoch (R2; `<abi>` 2.39 until GLIBC_2.41 is complete, R3; `<n>` `LIELLA_DEB_SERIAL`, `<rev>` `LIELLA_DEB_REVISION`, default 1; the commit is named in `changelog.Debian.gz`): `libc6` (amd64, `Multi-Arch: same`, `Priority: required`, `Breaks: base-files (<< 13.3~)` as plan section 3.1: the loader and the libraries of D-X.94's `liella6` in `/usr/lib/x86_64-linux-gnu`, `/usr/lib64/ld-linux-x86-64.so.2` -> `../lib/x86_64-linux-gnu/ld-linux-x86-64.so.2`, no `/lib64` (base-files' merged-`/usr` link), conffile `/etc/ld.so.conf.d/x86_64-linux-gnu.conf` (`/usr/local/lib/x86_64-linux-gnu`, `/lib/x86_64-linux-gnu`, `/usr/lib/x86_64-linux-gnu`), trigger `activate-noawait ldconfig`); `libc-bin` (`Essential: yes`, `Priority: required`, `Multi-Arch: foreign`, `Depends: libc6 (= <v>)`: conffiles `/etc/ld.so.conf` (`include /etc/ld.so.conf.d/*.conf`), `/etc/ld.so.conf.d/libc.conf` (`/usr/local/lib`), `/etc/gai.conf` (comments only: the RFC 6724 default tables), the template `/usr/share/libc-bin/nsswitch.conf` (`files`, hosts `files dns`) that its postinst copies to `/etc/nsswitch.conf` when absent and never replaces (the administrator's file, not a conffile; purge leaves it), trigger `interest-await ldconfig` whose handler is a documented no-op until SL-LDCONFIG ships `ldconfig` (the loader searches the standard directories without a cache); maintainer scripts honour `DPKG_ROOT`); `libc6-dev` (`Multi-Arch: same`, `Provides: libc-dev`, `Depends: libc6 (= <v>), libc-dev-bin (= <v>)`: `crt1.o`, `Scrt1.o`, `rcrt1.o`, `libc_nonshared.a`, the static archives, `libm.so` -> `libm.so.6`, the `libc.so` script with D-X.94's GROUP line; no headers until SL-HEADERS (R4), no `crti.o`/`crtn.o` until SL-CRT, no `linux-libc-dev` dependency until the headers come); `libc-dev-bin` (`Multi-Arch: foreign`), `locales` and `libc-l10n` (`Architecture: all`) are documentation-only placeholders that meet dependencies until SL-BIN-CORE, SL-DEVTOOLS, SL-LOCALEDEF and R5 fill them. `/etc/bindresvport.blacklist` and `/etc/default/nss` are not shipped (spec clause s31_14_c_1: Sun RPC is not implemented; Liella reads no `default/nss`). Reproducible as D-X.94 (repacking the same products is byte-identical). Checks: `tools/deb/check-system.sh` (names, fields, version form, layout per package, control members, conffiles, triggers, the loader built with prefix `/`, SONAMEs, a plain-gcc link whose `PT_INTERP` is `/lib64/ld-linux-x86-64.so.2`, a static hello); proof `tools/deb/root-system.sh`: `dpkg --root --force-script-chrootless` in a user namespace (`unshare -r`, no privilege) installs all six into an empty merged-`/usr` skeleton, then in a chroot a static hello runs, the dynamic hello starts the packaged loader through `/lib64` and `ld.so --list` resolves `libc.so.6` to `/usr/lib/x86_64-linux-gnu/libc.so.6`, and purge leaves the skeleton; the dynamic hello's own run waits for the start-time soname search (DL-8). `tools/deb/lint.sh` runs lintian in an unprivileged chroot. Gain: one source tree gives both the coexisting packages and the packages an Aqours root installs as its C library, with Debian's dependency graph (about 23200 dependency lines by name) unchanged.
'''
