story = "RENAME-NIJI-CODE"
date = "2026-11-16"
body = '''
**The project is renamed from Liella to libniji, identifier stem `niji`, with no compatibility aliases** (owner ruling 2026-11-16, answers Q1-Q6; RENAME-NIJI-CODE). Before the first versioned release every name of the project's own interfaces changes once: crates `liella`, `liella-*` become `niji`, `niji-*` (modules `niji_*`); the version nodes `LIELLA_NATIVE_1`, `LIELLA_OWNER_1`, `LIELLA_PRIVATE` become `NIJI_NATIVE_1`, `NIJI_OWNER_1`, `NIJI_PRIVATE`; every `LIELLA_*` constant, macro, compatibility flag and run-time or test variable becomes `NIJI_*`; `__LIELLA__` becomes `__NIJI__` (still always defined); `include/liella/` becomes `include/niji/`; the native interface library `libliella_native.so` becomes `libniji.so` (`-lniji`, Q2); the coexist packages `liella6`, `liella6-dev`, `liella-gcc`, `liella-g++`, `liella-native-abi`, `liella-owner-abi` and the version suffix `+liella` become `niji6`, `niji6-dev`, `niji-gcc`, `niji-g++`, `niji-native-abi`, `niji-owner-abi` and `+niji`; installed paths (`/usr/lib/niji`, `niji-crt1.o`, `niji-cc`), run-time names (`/dev/shm/niji-nscache-*`, `sem.niji-*`, `.note.niji.*` notes, the `niji.` tunable namespace) and messages follow; prose says "libniji" (Q1). Kept: the system flavour's Debian names (`libc6`, ...), `libc.so.6` and the loader's name; every glibc-visible name and behaviour (no differences row: only the project's own interfaces change); the author identity "Liella Maintainers <liella@koiren.ai>" (Q3); the repository URL until the owner renames it (Q5); internal ops names (Q6); history (handoff/, records/, results/, validation/results/, past release notes). Why no aliases (Q4): nothing has been released, so no program or package depends on the old names, and an alias would be a second public name to keep forever. The rename is mechanical and reproducible: `tools/rename_niji.py` (mapping table, exclusion list; a second run changes nothing), then the fixes a substitution cannot make (fixed-size strings and note owner names keep their sizes; the 8-byte name-service cache magic becomes `NIJI_NSC`). The Rust ABI version lr1 (spec/abi/rust-abi.toml) names the renamed crates, node and paths, so its recorded `hash` is the one `cargo xtask rust-dylib` computes for the renamed fields (`b4a17b0ef811ee2c`), recorded in place rather than as a new version: lr1 was never shipped (Q4), and a new version would carry exactly these fields while lr1 could no longer be built. Records keep their history: the compat records' key `liella` and the test names a record cites (D-27.43) stay as written. Proof: the exported symbol sets and bindings of every shared product are identical apart from the version-node names, and the layout counters are unchanged.
'''
