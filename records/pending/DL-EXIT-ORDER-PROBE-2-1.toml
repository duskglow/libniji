body = '''
**Exit-time order of the start-time and `dlopen`ed objects (stories DL-EXIT-ORDER-PROBE, DL-EXIT-ORDER-PROBE-2; probe `tools/probe/dl/exitorder`, record `== exit-order` in spec/behaviour/dynlink.glibc.txt; ruling #5790).**

At exit (`fini_all`, the termination function the program gets) the program's destructor runs first; then the start-time objects and every `dlopen`ed object still loaded whose constructors ran form ONE sequence (`liella_ld::init::exit_order`): the earliest loaded first, each object after every object that needs it, through `DT_NEEDED` or through a binding its relocation made in another object (global scope, no `DT_NEEDED`). How an object stays loaded (handle open, `RTLD_NODELETE`, a bound `STB_GNU_UNIQUE` definition) makes no difference. This is the reference's order on every probe outside a dependency cycle (E1-E18, E21-E25). It replaces DL-16a's order (every `dlopen`ed object first, the last initialised first, then the start-time objects).

Units: the start-time objects in `init::fini_order` (each chained before the next, so their own order holds), then the `dlopen`ed objects in load order (node index: a slot is reused only from the top). A `dlopen`ed unit runs before each unit it needs or bound to. Groups are the strongly connected components (Tarjan); of the groups free to run, the one holding the earliest unit runs next.

**Inside a dependency cycle (ruling #5790):** the cycle runs as one group at its place in the sequence, its members the last initialised first: deterministic, independent of unrelated objects, and the C++ rule that destruction reverses construction. The reference's order inside a cycle depends on the other objects loaded (E19, E20, E26-E28 differ from this rule; E29, E30 agree), so no rule reproduces it short of copying an emergent tie-break. Differences row "Exit order inside a dependency cycle"; registered compatibility option in records/pending/DL-EXIT-ORDER-PROBE-2-2.toml.

Programs that never call `dlopen` keep the start-time loop (no loader state is made at exit). The exit's sequence is built under the loader lock; each `dlopen`ed object is marked finalising first, so a `dlclose` that a destructor makes never runs it again.
'''
