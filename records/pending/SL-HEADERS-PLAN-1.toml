body = '''
**Proposed: Liella's own C header set** (SL-HEADERS-PLAN, plan/headers.md; owner ruling R4 of 2026-11-14). Proposed for the owner's review and not yet in force: rulings R-H0 to R-H7 of plan/headers.md §5 are open.

* **Generation.** Liella's headers are generated by `cargo xtask headers-gen [--check]` from two inputs:
  * the `spec/abi` tables (Appendix C), plus new tables that probe the reference only through the compiler: visibility per feature-test configuration, typedef and tag linkage, macro types and values, call-site symbols, noexcept;
  * Liella-written templates, from C, POSIX, the man pages, the kernel UAPI and the GNU C Library manual.

  No glibc header text is used. The internal split is Liella's own (`__liella/`), not `bits/`.
* **Proof.** A Liella-compiled object references the same symbols as one built against the reference headers with the same flags. The visible names per configuration, the layouts, the constants, the noexcept set and the C++ linkage spellings are identical. Differences need a `differences-from-glibc` row.
* **Kernel UAPI.** Coexistence follows `linux/libc-compat.h`.
* **libmvec.** No `simd` declarations until libmvec exists.
* **Slices.** The work lands as SL-HEADERS-1..20.
'''
