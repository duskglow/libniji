body = '''
**libc6's symbols and shlibs are generated from the specification and the built libraries (SL-SYMBOLS; plan/system-libc.md sections 3.2 and 6 item 3; owner ruling R2).** tools/deb/symbols.py runs while tools/deb/system.sh builds libc6. One `<soname> libc6 #MINVER#` block per shared library libc6 ships. A `name@GLIBC_2.x` symbol's minimum version is `2.x`; a node above the packages' ABI level (GLIBC_2.41's sched_getattr/sched_setattr while the packages say 2.39, ruling R3) gets the build's upstream version, since `libc6 (>= 2.41)` could never be met by Liella's own packages. `LIELLA_NATIVE_<n>` symbols use the template `| liella-native-abi (>= <n>)`, and libc6 `Provides: liella-native-abi (= <newest n>)`. LIELLA_PRIVATE (the libraries' interface to each other) is one `(symver)LIELLA_PRIVATE <upstream>` pattern; no GLIBC_PRIVATE line (R14-12). shlibs: `<name> <n> libc6 (>= <abi>)`. The exports must equal versions.tsv's rows (default bindings required, compat bindings allowed) plus native.tsv's functions; a default row missing from the build is accepted only when docs/spec-symbol-gaps.tsv lists it as missing in the shared object, and stays out of the file until it is built. Proof: tools/deb/check-symbols.sh (the rules line by line, dpkg-gensymbols -c4, dpkg-shlibdeps on three samples, dpkg --compare-versions); plants handoff/SL-SYMBOLS-plants.txt.
'''
