body = '''
**TLS modules past 512: the module table, the IDs' free bits and the surplus's places grow; a thread's vector grows at its first access to a module past it (DL-PROCESS-OBJECTS part 3, audit HL-3; amends D-27.73).** After part 2 a process could hold any number of objects but at most 512 TLS modules (`ltls::MODULES_MAX`: the module table every new thread copies, the free set of module IDs, the surplus's place store and every thread's vector). Now: the module table past its 512 entries in place is generations never moved (`THREAD_MODS_PAST`, part 2's `Gens`), mapped by the `dlopen` that takes an ID in them before the walk publishes the entry; `ModuleIds` holds the free bits of IDs up to 512 and takes the caller's words for later ones (a lock-held `Wide<u64>`, grown first); `Surplus` is generic over its store, and the loader's store moves to an `mremap`-grown copy when its 512 places are full. The surplus's bytes (64 KiB, HL-33) are unchanged. A failed mapping fails that `dlopen` with `<path>: cannot allocate memory`.

**The vectors.** A thread's vector in place keeps its 512 slots (the initial area and the C library's `tls_size` are unchanged, so start-up layout and faults do not move), and `__tls_get_addr`'s fast path is unchanged byte for byte: it reads only the slots in place. A module past them takes the cold `tls_slow`, which answers from a grown vector when it is current, else maps the calling thread a vector at least twice as large (and large enough for every module loaded now), `[old vector, words, generation, count, slots...]`, refills it from the module table and names it in the thread block (Release). The design's per-vector capacity word is kept outside the vector: the vector in place is recognised by its address (the initial thread's, recorded at start, or `tp - tls_size`), a grown one has its word count just before it, so no header word was added and no layout moved. A `dlopen`'s thread walk reads the block's vector (Acquire) with its own room and skips slots it lacks (the count it writes stays within them; it now writes the highest module filled, not the last). A grown vector's old vector stays mapped (a walk may still write it). When a thread ends, `thread_tls_release` names its vector in place again, calls the walk with a no-op step only to wait out any walk that read the grown address (a walk holds the thread-list lock throughout), then unmaps the grown vectors. A grown vector that cannot be mapped aborts the process with a message (`__tls_get_addr` has no error return).

**Lock-free walk guard (coordinator #7267).** `View::find_past` stopped after 2^32 steps; it now stops after the nodes the mapped node generations hold (`Gens::mapped_in`, re-read once when reached, since a generation mapped during the walk may hold chain nodes), so a wrong decode ends the walk cleanly.
'''
