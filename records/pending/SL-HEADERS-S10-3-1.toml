body = '''
**Slice 10 proof rows left open, each owned by the slice whose header is missing, and P7 not runnable yet** (SL-HEADERS-S10-3; plan/headers.md section 3 and section 4). P2 (visibility of the twenty headers in the 40 configurations, 1586 rows) differs from `visibility.tsv` in 10 rows; P3 (call sites, 641 rows) in 60. None of them is a libniji difference to keep: each waits for a header another slice generates, so no differences row and no compat option is written. P2: `ftw.h` `statx`, `statx_timestamp` (structures), `getumask` and `statx` (functions), and `timespec` (the table shows it in the configurations where `<sys/stat.h>` defines it; libniji's `ftw.h` defines the structure itself where the table has none): all five come from `<sys/stat.h>`, slice 7, which `ftw.h` and `fts.h` include once it exists; then the exceptions in `spec/tools/header_checks/s10.py` (`p1_skip`) go. `libintl.h` `gettext`, `dgettext`, `ngettext`, `dngettext` and `LC_GLOBAL_LOCALE` as macros under `_FORTIFY_SOURCE` 1 to 3: the fortify layer, slice 18. P3: all 60 are `call` rows of `wchar.h` (and `libintl.h`) under the fortify configurations (`wprintf` to `__wprintf_chk`, `wmemcpy` to `__wmemcpy_chk`, `wcsrtombs` to `__wcsrtombs_chk`, and the like): the checked variants are slice 18's. The 28 rows of the earlier run that came from `sys/types.h` and `endian.h` (the `be16toh` family, `__off_t`, `__ino64_t`, `__pid_t` conditions, `_SIGSET_NWORDS`, `_STRUCT_TIMESPEC`) are gone from this run, which started from a newer `next`; ruling #6462 gave that family to SL-HEADERS-VIS-FIX in any case. P7 (grep, sed, diffutils, findutils, gawk built against libniji's headers) cannot run on `next` as it stands: their sources include `<fcntl.h>`, `<sys/stat.h>`, `<dirent.h>` and `<signal.h>` (slices 7 and 8), which libniji's header tree does not hold yet, so a `-nostdinc` build stops at the first of them; it runs after those slices land (the same condition P7 has for the other slices of plan/headers.md section 4). The generator's `FILE` rule is data driven (a typedef named for `_IO_FILE` in a header that shows no `struct _IO_FILE` declares the tag only), so `pwd.h`, `grp.h`, `shadow.h` and `gshadow.h` now declare it the same way as `wchar.h`, as `visibility.tsv` has them; `header_check.py` leaves the size assertion on `FILE` out where the structure is incomplete.
'''
