body = '''
**ld.so's mapped span is rounded to a 512 KiB bucket, so its growth moves no start-up page** (LAYOUT-LDSO-WINDOW, follow-up of D-X.123). The kernel maps the interpreter top-down, ending at a fixed address (the mmap base), so a change in the image's size moves its start and everything mapped below it. Measured on the Skylake-SP host (Linux 6.8, ASLR off, per-page attribution with `perf record -d page-faults`): a 46 KiB cold text pad moved the start-up text group (at the start of `.text`) across one more 64 KiB fault-around window (+1 text fault), and moved the thread block below ld.so, whose thread pointer libc's thread registry (`foreign_words`) hashes to a 64-slot table, so the touched slot crossed a page boundary (+1 anonymous fault). ld.so's own data pages do not move with text size: GNU ld ends the RELRO region on a page and starts `.data` there, and the text growth shifts the RW segment by whole pages.
`cargo xtask so` now links the interpreter with `-T ld-span.ld`, an `INSERT AFTER .bss` fragment whose empty `NOLOAD` section aligns the image's end to `LDSO_SPAN_BUCKET` (0x80000), and refuses a linked interpreter whose span (lowest `PT_LOAD` page to the page end of the highest) is not a whole number of buckets. Growth inside one bucket then moves nothing: the image starts, the text group's window phase and every mapping below it stay at the same address (ASLR off) or the same distribution (ASLR on). Crossing a bucket moves them once, by a whole bucket, a multiple of 64 KiB, so the window phase still holds.
Alternatives measured and rejected: rounding to 64 KiB only (fixes the text phase, leaves the shift of the mappings below: the same pad then still read +1); `-z max-page-size=0x10000` (Linux 6.8 does not honour `p_align` for the interpreter's base, and the gaps between 64 KiB-aligned segments are holes that later small mappings fill). Cost: the rounding is `.bss` only, never touched: no file bytes, no faults, no instructions (measured equal within 2 at N=0/3/12); it adds address space and, as private writable memory, commit charge, under 512 KiB per process (136 KiB today). The bucket stays under 2 MiB so the padded tail never spans an aligned huge page. No spec clause (layout of the products; the loader's behaviour is unchanged).
'''
