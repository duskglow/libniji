body = '''
**Canonical PLT entries (DL-CANONICAL-PLT, GitHub issue #10).** The gABI ("Symbol Values") makes the executable's PLT entry the address of a function a shared object defines when the executable references that address without the GOT: the link gives the program an undefined global or weak `STT_FUNC` symbol whose value is its PLT entry. **Rule:** in the program only (`Object::canonical_entries` scans the program's hashed symbols once per load; the answer is one bool kept beside the object list, `Objects::canonical` at start and `Loader::canonical` for `dlopen`, never in the per-object view, whose inline start-up table it would grow; a lookup takes it through `Scope::program_entries`, and only then a `#[cold]` search reads object 0 with `Object::lookup_program`, so the plain lookup is unchanged), such a symbol (`symbols::canonical_plt`: `SHN_UNDEF`, value not 0, `STT_FUNC`, global or weak) is a definition for every lookup, so `GLOB_DAT`, `R_X86_64_64` and other address references in every object, at start and in objects `dlopen`ed later (also `RTLD_LOCAL`), and `dlsym(RTLD_DEFAULT)`, bind the entry. A lookup that does not start at the program does not see it: `dlsym(RTLD_NEXT)` from the program, `dlsym` on the defining library's handle, and an object opened `RTLD_DEEPBIND` (its own scope first) bind the library's own definition. `dladdr` names the function at the entry's own address (size 0), in the program only, and names nothing at the program's or a library's load base (probe-settled). A versioned entry (`f@V1`) matches by its `DT_VERNEED` name; a COPY next to it is unaffected. A program's undefined symbol with value 0 (call-only, or reached through the GOT) is never a definition; with a SysV hash table it sits in the program's hash chains, so the value test is load-bearing. **JUMP_SLOTs.** The plain relocation pass is unchanged (`pass1`, `#[inline(never)]`, and the deferred loop). Only when `Objects::canonical` is set does the `#[cold] #[inline(never)]` `canonical_slots` run after it for each object: it walks the `JUMP_SLOT`s (the RELA table after its `DT_RELACOUNT` prefix of `RELATIVE` entries, then `DT_JMPREL`), skips every field that does not point into the program's load span (read once per object; only a canonical entry can be there after the plain pass), and re-resolves the rest (`slot_target`: a first answer that is the program's undefined entry is looked up again without the program) and writes them, an IFUNC in the deferred pass. So the entry's own slot, and other objects' slots for the function, bind the definition. **Protected definitions:** when the program's `JUMP_SLOT` of a canonical entry binds a protected definition in another object, that object keeps its own address, so the two differ: libniji refuses the load (`RelocError::IndirectExternAccess`, status 127, message naming the function) when the defining object carries `GNU_PROPERTY_1_NEEDED` (0xb0008000) with bit `GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS` (Linux extensions to the gABI, "Program Properties"; missing or malformed notes read as not marked), and otherwise prints one warning line on fd 2 and goes on (`protected_canonical`, cold). Every binding above, the warning-or-refusal choice and the IFUNC case match the reference by black-box probes, lazily and with `LD_BIND_NOW` (spec/behaviour/dynlink.md "Symbol binding"; message texts are libniji's own). libniji binds `JUMP_SLOT` eagerly, so no lazy resolver path needs the rule. **Cost** (Skylake-SP host, fast products, 21 runs, ASLR off, against next 1b7335a10): a PIE without a canonical entry at N = 0/3/12 libraries: instructions:u 8993727/9273339/10075385 -> 8993645/9273344/10075675 (-82/+5/+290), page faults 77/93/129 unchanged (ASLR on, median: 78/94/130 -> 79/95/131, one stack page more often); a non-PIE program with one canonical entry: +43.6k/+56.9k/+97.0k instructions (+0.5%/+0.6%/+1.0%) and +2 faults (the cold canonical pass's ld.so text); ld.so +13.1 KB. `Relas::next` is `#[inline(always)]` so the second caller does not take it out of `pass1` (with it out of line the plain path paid +5.4k).
'''
