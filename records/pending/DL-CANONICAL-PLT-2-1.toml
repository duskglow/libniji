body = '''
**Canonical PLT entries (DL-CANONICAL-PLT, GitHub issue #10).** The gABI ("Symbol Values") makes the executable's PLT entry the address of a function a shared object defines when the executable references that address without the GOT: the link gives the program an undefined global or weak `STT_FUNC` symbol whose value is its PLT entry. **Rule:** in the program only (index 0 of the process's object list, which `COPY` relocations already assume; `symbols::lookup` calls `Object::lookup_as(req, o == 0)`, so `Object` keeps its size: a flag field in it cost every start about 5.7k instructions in copied and zeroed object tables), such a symbol (`symbols::canonical_plt`: `SHN_UNDEF`, value not 0, `STT_FUNC`, global or weak) is a definition for every request except a `JUMP_SLOT` one (`Request::jump_slot`), so `GLOB_DAT`, `R_X86_64_64` and other non-PLT references in every object, at start and in objects `dlopen`ed later, and `dlsym(RTLD_DEFAULT)`, bind the entry, while the entry's own `JUMP_SLOT` binds the definition. A program's undefined symbol with value 0 (call-only, or reached through the GOT) is never a definition; with a SysV hash table it sits in the program's hash chains, so the value test is load-bearing (test `..._sysv_hash_program_call_only_reference_binds_library_definition`). Versions need no change (the lookup reads a reference's version from `DT_VERNEED`). **Protected definitions:** when the program's `JUMP_SLOT` of a canonical entry binds a protected definition in another object, that object keeps its own address, so the two differ: libniji refuses the load (`RelocError::IndirectExternAccess`, status 127, message naming the function) when the defining object carries `GNU_PROPERTY_1_NEEDED` (0xb0008000) with bit `GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS` (Linux extensions to the gABI, "Program Properties"; missing or malformed notes read as not marked), and otherwise prints one warning line on fd 2 and goes on. Both outcomes and the bindings match the reference by black-box probes (spec/behaviour/dynlink.md "Symbol binding"; message texts are libniji's own). **Cost:** one flag test per undefined candidate in the program's hash chain; the protected check is a `#[cold] #[inline(never)]` function reached only for a protected definition of a canonical entry. libniji binds `JUMP_SLOT` eagerly, so no lazy resolver path needs the rule.
'''
