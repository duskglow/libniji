body = '''
**Canonical PLT entries (DL-CANONICAL-PLT, GitHub issue #10).** The gABI ("Symbol Values") makes the executable's PLT entry the address of a function a shared object defines when the executable references that address without the GOT: the link gives the program an undefined global or weak `STT_FUNC` symbol whose value is its PLT entry. **Rule:** in the program only (`Object::mark_program` scans the program's hashed symbols once per load, at start and when `dlopen` adopts the start's objects, and sets the mark in place; ruling #6659: the answer rides in the program view's hash table, a `mark` byte in the tail padding of `GnuHash` / `SysvHash`: a `u8`, not a `bool`, because the compiler takes a `bool`'s invalid values for `Hash`'s discriminant, which moved it and cost the symbol walk a spill per chain step (measured: +3.5k/+25k instructions at N = 0/12); and not a fourth `Hash` variant, because a fourth `Hash` variant carrying a GNU table grows the enum from 88 to 96 bytes (its spare discriminant values only fit a SysV-sized payload); a compile-time assertion keeps `Object` at 0x128 bytes and `Scope` at 0x30, their sizes before the change, so the inline start-up table and the stack keep their size; the lookup walk and `Scope` are as before, and `Object::has_canonical_plt` is read only for a hash candidate that is not an exported definition), such a symbol (`symbols::canonical_plt`: `SHN_UNDEF`, value not 0, `STT_FUNC`, global or weak) is a definition for every lookup, so `GLOB_DAT`, `R_X86_64_64` and other address references in every object, at start and in objects `dlopen`ed later (also `RTLD_LOCAL`), and `dlsym(RTLD_DEFAULT)`, bind the entry. A lookup that does not start at the program does not see it: `dlsym(RTLD_NEXT)` from the program, `dlsym` on the defining library's handle, and an object opened `RTLD_DEEPBIND` (its own scope first) bind the library's own definition. `dladdr` names the function at the entry's own address (size 0), in the program only, and names nothing at the program's or a library's load base (probe-settled). A versioned entry (`f@V1`) matches by its `DT_VERNEED` name; a COPY next to it is unaffected. A program's undefined symbol with value 0 (call-only, or reached through the GOT) is never a definition; with a SysV hash table it sits in the program's hash chains, so the value test is load-bearing. **JUMP_SLOTs.** The plain relocation pass is unchanged (`pass1`, `#[inline(never)]`, and the deferred loop). Only when the program's view has the mark (`Object::has_canonical_plt`) does the `#[cold] #[inline(never)]` `canonical_slots` run after it for each object: it walks the `JUMP_SLOT`s (the RELA table after its `DT_RELACOUNT` prefix of `RELATIVE` entries, then `DT_JMPREL`), skips every field that does not point into the program's load span (read once per object; only a canonical entry can be there after the plain pass), and re-resolves the rest (`slot_target`: a first answer that is the program's undefined entry is looked up again without the program) and writes them, an IFUNC in the deferred pass. So the entry's own slot, and other objects' slots for the function, bind the definition. **Protected definitions:** when the program's `JUMP_SLOT` of a canonical entry binds a protected definition in another object, that object keeps its own address, so the two differ: libniji refuses the load (`RelocError::IndirectExternAccess`, status 127, message naming the function) when the defining object carries `GNU_PROPERTY_1_NEEDED` (0xb0008000) with bit `GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS` (Linux extensions to the gABI, "Program Properties"; missing or malformed notes read as not marked), and otherwise prints one warning line on fd 2 and goes on (`protected_canonical`, cold). Every binding above, the warning-or-refusal choice and the IFUNC case match the reference by black-box probes, lazily and with `LD_BIND_NOW` (spec/behaviour/dynlink.md "Symbol binding"; message texts are libniji's own). libniji binds `JUMP_SLOT` eagerly, so no lazy resolver path needs the rule. **Cost** (run 7, Skylake-SP host, fast products, 101 runs each, against next 1b7335a10): a PIE without a canonical entry at N = 0/3/12 libraries: instructions:u medians (ASLR off) 8993697/9273411/10075638 -> 8993062/9272922/10075639 (-635/-489/+1; single-step trace: the candidate closure -971 at both N, `Object::mark_program`'s scan +47/+191, the per-object mark test in `relocate_first` +40/+280); page faults equal with ASLR off (77/93/129; the same pages but for two anonymous ones that sit 3 pages higher), and with ASLR on medians 78/94/130 -> 79/94/130, the distributions' means +0.12/+0.22/+0.12, inside base's own spread over three 101-run counts (median 78 or 79 at N = 0, mean 94.09 to 94.36 at N = 3); a non-PIE program with one canonical entry: +43.1k/+56.6k/+96.9k instructions and +2 faults (the cold canonical pass's ld.so text). `Relas::next` is `#[inline(always)]` so the second caller does not take it out of `pass1`.
'''
