body = '''Slice 19 of plan/headers.md: the diagnostic attributes of libniji's own C headers are a table, spec/abi/diagattrs.tsv (format, nonnull, warn_unused_result, noreturn, malloc, alloc_size, deprecated, sentinel, pure), applied by headers-gen after the assembler label of each generated declaration and in templates through @@attrs(NAME). The semantics come from the standards (C 7.21.6 and 7.21.7 format strings, 7.24.1 valid pointer arguments, 7.22.3 allocation, 7.22.4 noreturn); the probe gives which function carries which. spec/tools/attr_probe.py compiles a corpus of its own against the system's headers and reads back only the line and option name of each diagnostic in its own file and the undefined marker symbols of its own object (a marker is called only when the optimizer cannot decide the property the attribute gives); its check mode runs the same corpus on libniji's headers: 519 functions, 2232 tests, no difference in the compared options (the ctype is* macros of slice 6 and fwrite_unlocked are listed as known). -Wformat-overflow, -Wformat-truncation, -Wstringop-*, -Warray-bounds and -Wrestrict also read access and restrict information and belong to slice 18: the check counts them and does not compare. Attributes the compiler already knows for a builtin do not show in the differential when removed, so plants use functions that are not builtins.'''
