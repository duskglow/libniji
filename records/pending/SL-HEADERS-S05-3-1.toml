body = '''
**Liella's header generator: template format, guards and table sources** (SL-HEADERS-S05, plan/headers.md sections 2.3 and 2.4; rulings R-H1 to R-H3 and #6047). `cargo xtask headers-gen` writes `libc-include/<path>` from `headers/<path>.h.in` and the `spec/abi` tables; `--check` runs in `cargo xtask static` and also refuses a file there that no template produces. The output is a root of its own, not `include/`: tools and tests that compile against the build host's headers put `include/` on their search path for `<liella/native.h>`, and generated libc headers there shadowed the host's (the SL-HEADERS-S05-3 gate failed so). `cargo xtask so` stages both roots into `target/liella/include`. Local design details, decided here: Template markers, one per line except `@@value(NAME)`: `@@generated` (banner), `@@emit` (every name `visibility.tsv` gives the header, each under its searched condition), `@@if NAME` / `@@when NAME` (an `#if` with NAME's condition; `@@if` also takes ownership), `@@owns` (names the template defines itself), `@@value(NAME)` (the `macros.tsv` literal), `@@intc` (C 7.20.4 macros from the `typedefs.tsv` rows of the least-width types), `@@iso10646` (the `__STDC_ISO_10646__` value of `spec/unicode/` through `headers/iso10646.tsv`), `@@stubs` (`__stub_<f>` per default-linked row of `spec/abi/stubs.tsv`). A `#define` in a template of a name `macros.tsv` holds is an error: values come only from the tables. Guards: include guards are `__LIELLA_H_<path>`, the once-guard of a type defined by several headers is `__LIELLA_D_<name>`; both are in the implementation's reserved name space (C 7.1.3) and spell no glibc-internal name. `__liella/` under the header root is reserved for internal fragments a later slice may need; slice 5 needs none. Integer types (ruling #6047): `<stdint.h>` and `<inttypes.h>` come only from table rows. The C 7.20.1 and 7.8.1 names are probe candidates of `spec/tools/header_probe.py` (`c_integer_names`), so `typedefs.tsv` holds each type's size, alignment and C++ spelling (the spelling fixes the mangled name, so `long` against `long long` is ABI) and `macros.tsv` each format macro's string. No compiler predefined macro is used as a fallback; a missing row is a generator error. `PTHREAD_STACK_MIN`: `spec/tools/type_probe.py` probes a constant that is not a constant under `_GNU_SOURCE` again in `-std=c17 -D_DEFAULT_SOURCE`; the template uses that value unless `_DYNAMIC_STACK_SIZE_SOURCE` is in force (then the run-time value of `sysconf`). `gnu/stubs.h`: Liella's own list (`spec/abi/stubs.tsv`), derived from Liella's code, the functions whose body only fails with `ENOSYS`; only the default-linked ones get a `__stub_` macro, since a compat-only symbol cannot be linked by a new program. `__STDC_ISO_10646__` is Liella's value (`202309L`, Unicode 15.1), not the reference's; a row in docs/differences-from-glibc.md, no compatibility option (the macro states the repertoire Liella's tables implement).
'''
