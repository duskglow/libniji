id = "D-16.2"
section = "s16"
spec = "§16.2–16.4"
ann = "PATH, HIST"
status = "active"
body = '''
**Internal:** one `LookupError{NotFound, NoData, TryAgain, Unavailable, Os(Errno)}`. **Boundary:** mapped to h_errno HOST_NOT_FOUND / NO_DATA / TRY_AGAIN / NO_RECOVERY (with errno; NETDB_INTERNAL for argument errors) and to EAI_NONAME / NODATA / AGAIN / FAIL / SYSTEM / MEMORY. h_errno is per thread (thread block offset 0x128). Non-`_r` results use per-thread `SLOT_RECORDS` blocks (D-16.7); `*ent` cursors are process-wide and locked. **getaddrinfo:** NULL hints mean `V4MAPPED\|ADDRCONFIG`; flag mask 0x7ff; the socket-type/protocol table as observed (dccp, udplite, sctp stream and seqpacket, raw with any protocol); hints flags copied into each entry; canonical name on the first entry only; zone ids only on link-local and multicast addresses. **Sorting:** RFC 6724 rules 1, 2, 5, 6, 8, 9 (IPv6 only) and 10 with the RFC tables or `/etc/gai.conf` (read once unless `reload yes`); source addresses from a netlink route query (`iface::route`) instead of connect+getsockname; passive wildcards are not sorted. **AI_ADDRCONFIG:** see the revised clause at the end of this row. **getnameinfo:** NI mask 0xff; the zone prints as `%ifname` or the number. **Deliberate differences** (KNOWN/ADDED/DROPPED in `netdb_products`): an empty name is no host name; gethostent returns each hosts line in its own family; `n_net` is the right-aligned number `inet_network` gives (glibc left-aligns, disagreeing with `inet_network`/`inet_makeaddr`); a non-numeric network number or a port above 65535 makes the line no record; getaddrinfo port 65536 is EAI_SERVICE. Probe-only: all sources unavailable gives EAI_FAIL (glibc EAI_SYSTEM/EBUSY); a missing hosts file gives NO_RECOVERY/EAI_SYSTEM with errno (glibc: not found); numeric services are decimal digits only; one IPv4 numeric grammar for gethostbyname and getaddrinfo; a bad family or length in gethostbyaddr/gethostbyname2 gives NETDB_INTERNAL with EAFNOSUPPORT/EINVAL; getnameinfo on AF_UNIX gives EAI_FAMILY. **AI_ADDRCONFIG (revised 2026-11-26, GAI-ADDRCONFIG-LOOPBACK; owner ruling #8731 "match stock"):** the reference's rule, probed black-box in network namespaces (lo only, none, link-local IPv6 only, global IPv4 with link-local IPv6, global IPv6, ULA, 169.254/16, addresses on `lo`, 127/8 other than 127.0.0.1, down interfaces): a family is configured when some interface, up or down, has an address of it other than exactly 127.0.0.1 or ::1. The flag narrows the requested family before the node is read: one family configured, AF_UNSPEC becomes it and the other is EAI_NONAME; neither, AF_UNSPEC unchanged and AF_INET/AF_INET6 EAI_NONAME (ahead of EAI_ADDRFAMILY, EAI_SERVICE and EAI_SOCKTYPE). Replaces the earlier rule (loopback and link-local IPv6 not counted, results filtered afterwards), which had no recorded reason and broke `::1` on hosts with only loopback and link-local IPv6.
'''
