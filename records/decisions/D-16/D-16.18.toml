tests = ["crates/core/tests/nscache_reach.rs::the_cache_has_only_the_known_callers", "crates/core/tests/nscache_reach.rs::every_lookup_family_name_is_a_library_symbol", "crates/core/tests/nscache_reach.rs::the_one_mode_tests_are_the_known_programs", "crates/core/tests/nscache_reach.rs::no_one_mode_program_makes_a_lookup"]
body = '''
**The name-service cache's two test modes only where a program reaches the cache** (owner ruling 2026-11-23, "accept recommendations on test fixes", on the test-redundancy audit's items H2 and H3, `plan/reviews/TEST-REDUNDANCY-AUDIT.md`). D-16.10's test clause, "every differential test of phases 10–11 passes with the cache enabled and disabled", becomes: every differential test **whose program reaches the cache** passes with the cache enabled and disabled; the others run in one mode. At process start the cache only stores its switch; it reads the switch and attaches to its shared region at the first lookup, so for a program that makes no lookup the two runs execute the same code apart from one flag no path reads (`after_fork_child` and the credential hooks read no switch). **One mode:** aio, catalogs, fstree, mallocdbg, mntent, posixipc and syslog. aio keeps its `_off` shards (`uring_off`, `eperm_off`, `enosys_off`, `allow_off`; `uring_on` and `eperm_on` are dropped, as the ruling's recommendation names them); the other six run once with the cache on, the configuration a user runs, so a lookup reached through a path the static check does not see still goes through the cache and is compared with the reference. **Both modes stay** for process and terminals (grantpt), patterns (tilde expansion), netdb, users and dns. **The static check** (`crates/core/tests/nscache_reach.rs`, the ruling's condition): the library files that name the cache are a pinned list, each tied to the C functions that reach it (families: user and group lookups, network lookups, the resolver, tilde expansion, grantpt, the credential calls, the cache's own interface); the one-mode tests are a pinned list found from the tests themselves (a test using `nscache_mode.sh` without both modes); and no one-mode program's source or local header names a function of a family (identifiers outside comments and literals that are library symbols). A new caller of the cache, a new one-mode test or a lookup added to a one-mode program fails the check; the program then goes back to both modes. Saving (audit estimate, to be measured from the CI gate's per-test times): aio_products about 95 test-seconds, the six about 45.
'''
