body = '''
**`_FloatN` declarations follow the compiler's support for the types.** features.h sets `__NIJI_FLOATN` (`_Float32`, `_Float64`, `_Float32x`, `_Float64x` are keywords: GCC's predefined `__FLT32_MANT_DIG__` and the others, in C and from GCC 13 in C++) and `__NIJI_FLOAT128` (`__FLT128_MANT_DIG__`). headers-gen guards each generated declaration and macro definition that names one of the types or spells its constant suffix or builtin (`values::floatn_guards`): everything of `_Float128` only under `__NIJI_FLOAT128`; for the other four, where the keywords are absent (clang), a function is declared in C with the type of the same x86-64 format (float, double, double, long double) and not in C++, a constant takes that type's suffix or builtin, and features.h typedefs the four names to those types so a program can use them. Black-box probes of the reference under clang 19 (postgresql-17's JIT build failed on `_Float128` in stdlib.h) show the same split: the four names usable in C and C++, their functions declared in C only, nothing of `_Float128`, the macros (`M_PIf32`, `SNANF32`, `CMPLXF32`) defined and usable. The reference's own `__HAVE_FLOAT*` macros are reserved names libniji does not define (no package so far tests them). header_check.py now runs P5 with clang too (C and C++, strict and GNU modes).
'''
