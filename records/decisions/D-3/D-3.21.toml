body = '''
**The heap's node read takes the rseq area's `node_id` when Liella registered the area and the kernel fills it** (HEAP-RSEQ-NODE, 2026-11-14; wires the branch D-3.20 recorded as not wired, escalation #4198). Makes D-3.12's "when Liella owns the thread's registration and the kernel fills it" precise. Owned: a thread Liella created or a static program's initial thread whose descriptor's area registration succeeded (`DESC_RSEQ`), or a dynamic program's initial thread whose area Liella's `ld.so` registered at tp + `RSEQ_OFFSET`; every other thread (another C library's registration, or none) is not read. Filled: the kernel's rseq ABI puts `node_id` at offset 20 (4 bytes) and fills a field only when its feature size covers it, so the field is read only when the auxiliary vector's `AT_RSEQ_FEATURE_SIZE` (27; absent before Linux 6.3) is at least 24 and the registered length (32) reaches it; the answer is asked once per process. Otherwise the vDSO `getcpu`, as before. Slow paths only, and only when several nodes are allowed (D-3.20): one node reads no node. Tests: `rseq_node_id_is_read_only_when_the_feature_size_covers_it` (kernel), `a_registration_liella_does_not_own_is_never_read` (boundary, hosted), `several_nodes_read_the_node_from_rseq` (products: on a host with several nodes and Linux 6.3+, a thread pinned to node n > 0 takes its first block from node n with the vDSO unmapped; skipped with the reason elsewhere).
'''
