body = '''
**A later heap segment is placed under an address-space limit** (HEAP-FIND-DEPTH-NEED). When the over-mapping of a segment does not fit under `RLIMIT_AS`, `map_aligned_exactly` blocks the probe's gap with pages a mapping apart and asks again; it bounds the blockers per round at `EXACT_BLOCKERS`, now 9: `(align + len) / len` rounded up for a later segment (metadata and 8 slabs, 2304 KiB, D-3.24), was 8 (sized for a first segment, 5). At 8 a later segment whose aligned neighbours were taken found no range and the heap mapped per request: findutils' `find` over one directory of 200000 files (issue #21's workload) needed 37344 KiB over its 3-file need with snapshot 22.4 against 34784 with 22.3 (Zen 1 build host, find 4.9.0, tmpfs, fixed layout, `LANG=en_US.UTF-8`, 2 of 2 runs); with 9 it needs 33296 (2 of 2 runs of the test). The locale's mappings are what take the aligned neighbours: with an empty environment the same walk needed 30080 (22.4) and 31792 (22.3), and 8 blockers were enough. A static program does not hit it (its aligned neighbours are free: 63824 KiB on both snapshots). Whether a run reaches the blocking stage depends on the layout: with next's current products the aligned slot was free and a build with 8 needed what 9 does (48592 KiB, strace: no blocker), so the blocker count is tested by layout. Tests: `kernel_pages_place_a_later_segment_when_both_aligned_slots_are_taken` (boundary `s03_memory_symbols.rs`: both aligned candidates taken, the higher gaps covered so the probe's gap is the kernel's first choice, 9 blockers needed; host and native passes) and the workload bound `find_over_200000_entries_bounds_its_address_space` (core, 33296, run in `en_US.UTF-8`; skipped, saying why, without the locale archive).
'''
