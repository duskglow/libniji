body = '''
**Size classes are eight per doubling from 128 to 1024 bytes** (HEAP-WALK-ADDRESS-SPACE, GitHub issue #21). The classes were 16-byte steps to 128, then four per doubling to 64 KiB (44 classes); they are now 16-byte steps to 128, eight per doubling to 1024 (steps of 16, 32 and 64 bytes: a block exceeds its request by less than an eighth of the class below), then four per doubling to 64 KiB (56 classes). Eight per doubling keeps exactly 32 classes up to 1024, so the fused paths' class table and its `& 31` mask are unchanged; the cache grows from 384 to 496 words (one class line per new class, and the free path's slab hints from 16 to 32 entries: a mixed-size batch keeps more current slabs, `lifo_batch64` touches 20 classes instead of 17, and with 16 hints it took 8937 instructions per batch against 8342 before the change; with 32 it takes 8214). Measured cause (Zen 1 build host, findutils 4.9.0 over 200000 entries, en_US.UTF-8, tmpfs, origin/next with LD-START-MAPS-3 merged for the measurement): `find` makes 200002 requests of 264 bytes (a black-box trace of its requests) and holds about 100000 at once; with four per doubling each took a 320-byte block, 4.7 MiB more than 272-byte blocks, and the walk spilled 4352 KiB into a third segment. The issue's formula (least `ulimit -v` over 200000 entries minus over 3) went from 35608..37284 KiB to 32940..33196 over 8 layout phases (the reference's 29904 by the same method; the issue allows 35000). Rejected: 16-byte steps to 512 (264 would take 272, but 32 classes up to 512 breaks the fused table's mask for 513..1024 and a program touching many sizes holds a 256 KiB slab per class, up to three times as many); mapping a later segment one slab at a time (`SEG_STEP` 8 to 1: a later segment's placement under a limit then needs 33 blockers instead of D-3.25's 9, and with the finer classes the walk no longer reaches a third segment); a class per measured size (tuning to one workload). Reference for the trade between internal fragmentation and the number of classes: Wilson, Johnstone, Neely and Boles, "Dynamic Storage Allocation: A Survey and Critical Review" (IWMM 1995), section on segregated storage with size classes. Not done here: the issue's refill step (+10 MiB over the reference: `malloc(120)` cannot reuse the freed blocks of other classes) needs reuse across classes, a separate change.
'''
