body = '''
**The generated locale sources carry one probed transliteration table, `translit_shared`, which every generated `LC_CTYPE` includes** (owner ruling #7791; extends D-31.30; follow-up #7957 of LOCALEDEF-TRANSLIT). **Probe:** `tools/probe/translit_probe.c` runs the reference's `iconv` with `<codeset>//TRANSLIT` on every code point 1..0x10FFFF the codeset lacks, under each of the reference's 182 legacy-codeset locales (and en_US.utf8 for ASCII); `tools/probe/translit_table.py` writes `spec/locale-probe/translit.tsv`. A locale's `default_missing` (the result for U+E000, a private-use code point no table names: `?` in most, empty in ku_TR, tr_CY and tr_TR) is left out, since an entry giving it cannot be told apart from no entry. **Rule:** a code point is in the shared table when most locales lacking it give a result (2,419 entries); its alternatives are ordered so that each codeset's own result is the first the codeset can hold. A locale whose own strings hold a code point its result treats otherwise gets an entry of its own before the include (ro_RO: U+021B to U+0163; uz_UZ: U+02BB, U+0419, U+0439, U+04B2, U+04B3). **Generator:** `xtask/src/locales.rs` emits `translit_shared` and, in each `LC_CTYPE`, the own entries, then `include "translit_shared";""`, then the combining and compatibility includes; `xtask/src/locale_probe.rs` reads a legacy name's value as its UTF-8 sibling's text when the table explains the difference (so the `@euro` wide thousands separators keep U+202F in the source and compile to the reference's bytes). **Verified:** every legacy `SUPPORTED` entry compiled by libniji's localedef in its own codeset against the probe's own rows: 394 values in 86 of the 182 entries, the 251 values in 81 entries LOCALE-PROBE-GEN-2 measured included, 0 differ (`crates/locale/tests/reference.rs`). **Remaining:** run-time `iconv //TRANSLIT` in a generated locale differs from the reference's in 38,814 (locale, code point) pairs in 104 of 183 locales, where those locales have tables of their own beyond the shared one (ko_KR.euckr 10,416, ja_JP.eucjp 4,478, zh_* about 1,500 to 2,100 each, tr_* and ku_TR 1,854, uk_UA 585, el_* 493, ar_* 133); compiled values are unaffected. No locale source file of the reference was viewed.
'''
