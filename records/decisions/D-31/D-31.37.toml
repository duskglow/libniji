body = '''
**`update-locale`, `validlocale` and the `locales` package's maintainer scripts** (update-locale(8), validlocale(8), debconf-devel(7); black-box probes of the reference's `locales` 2.41 in a trixie root; commands of `localedef`, D-31.36).

`update-locale [--help] [--reset] [--locale-file FILE | --locale-file=FILE] [--no-checks] [NAME=value | NAME]...` edits `/etc/locale.conf` (the postinst links `/etc/default/locale` to `../locale.conf`, as the reference's trixie package does) in place: a `NAME=value` operand replaces the line of that variable, commented (`#NAME=`) or not, else is appended in operand order; a bare `NAME` comments its line out; `--reset` first comments out every active variable no operand names; an empty line is written back as `#` (trixie's `locales` 2.41; Ubuntu 24.04's 2.39 keeps it empty: a distribution difference, libniji follows the Debian suite it ships for); a missing or empty file starts with the line `#  File generated by update-locale`. Then, unless `--no-checks` (both checks are skipped, probed on both references): every active `LANG` and `LC_*` value must be available (as `validlocale` decides), else `*** update-locale: Error: invalid locale settings: ` and the active settings, status 255, the file unchanged, `LANGUAGE` unwarned; after that a `LANGUAGE` whose first language differs from `LC_ALL`'s (else `LANG`'s) language, unless that is `C` or `POSIX` (`C.UTF-8` is not exempt), is commented out with `*** update-locale: Warning: LANGUAGE (<v>) is not compatible with <NAME> (<v>). Disabling it.` on standard output. An unknown option prints `Unknown option: <name>` on standard error and is ignored; `--help` prints the usage on standard error, status 0.

`validlocale LOCALE`: available (the empty name, `C`, `POSIX`, `C.UTF-8` in any codeset spelling, a name the archive holds in its stored or written form, or a `/usr/lib/locale/<name>/LC_CTYPE`): `locale '<name>' valid and available` on standard error, status 0. Else the `/etc/locale.gen` line to add on standard output, `<name> <charset>` with the charset of its `SUPPORTED` entry, or `$DEFAULTCHARSET`, or `ISO-8859-1`, then `locale '<name>' not available` on standard error, status 1. No operand: `Usage: <program> <locale>` on standard output, status 1, the program named as a shell names a script: argv[0] when it holds a `/`, else the first `PATH` directory holding it joined to it (probed: a bare `validlocale` prints `/usr/sbin/validlocale`).

Package (tools/deb/system/locales.*): debconf questions `locales/locales_to_be_generated` (multiselect over `SUPPORTED`) and `locales/default_environment_locale`; the postinst creates `/etc/locale.gen` once (every `SUPPORTED` entry commented out; the administrator's file from then on, not a conffile), rewrites it under debconf so that exactly the chosen entries are selected (a chosen entry's line uncommented, any other selected line commented out with `# `, a chosen entry the file lacks appended, every `SUPPORTED` entry the file lacks appended commented out), runs `locale-gen`, then sets or clears `LANG` with `update-locale`. It honours `DPKG_ROOT` and runs the root's static commands through chroot, so `dpkg --root` configures a root with only libniji's packages and no shell; under `DPKG_ROOT` or without debconf it asks nothing and compiles `/etc/locale.gen` as it is. `/etc/locale.alias` ships with comments only (no aliases: the reference's alias list is its own data).
'''
