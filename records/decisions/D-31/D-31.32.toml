body = '''
**The shared root of the generated `LC_COLLATE` is generated from the DUCET (`spec/unicode/15.1.0/allkeys.txt`, UTS #10) plus a 228-line rules file (`spec/locale/collate-root.txt`), not committed as a probed table** (coordinator decision #7958, recommended by LOCALE-COLLATE-TAILORINGS; owner ruling #7791: locale data by black-box probe). `crates/collate-root` (niji-collate-root) writes the root as a locale source. Levels 1-3 are the DUCET's weights with variable weighting "shifted" (UTS #10 section 4); Han code points the DUCET does not list take the implicit weights of UTS #10 section 10.1; level 4 is the character itself, and characters equal at levels 1-3 are in code point order. One probe of the reference's en_US.UTF-8 over U+0001-U+10FFFF settled this tie-break: listing the reference's order with these weights gives the reference's level for all adjacent pairs but 45 of 50,708. What the model does not give is a rule in the rules file, and each rule carries its probe evidence (#7958 condition 3): two class rules (`han-variant-block`: 1,508 CJK radical, compatibility and enclosed ideographs form one block before U+4E00; `format-first`: the 467 Cc/Cf/Variation_Selector code points with all-zero DUCET weights come first at level 4), 127 undefined ranges (only U+4E00-U+9FA5 of the unified ideographs are defined), 33 `after` placements, 1 `same`, 3 `expand` and 2 `contract` (l·, L·). `tools/probe/collate/root_rules.py` derives the file from the probe output (results/locale-collate-2026-11-23.md section 7). The proof is equality with the reference on a host with all locales (#7958 condition 2): `generated_root_collation_is_the_references_en_us` compiles the root with libniji's localedef library and checks all 1,112,063 code points for the reference's `strxfrm` order and every adjacent pair for the reference's level, then checks the corpus with `strcoll` and `wcscoll`. Gain over committing the probed 120k-line table: the data is traceable to the spec and compact, and a DUCET update becomes a regeneration. Not decided here: the per-locale tailorings and their wiring into the generated locale sources (a later story stacked on the locale-source generator); bracket-range collation sequence order (collseq), which differs from the reference and is reported by the test without being asserted; root contractions beyond l·/L·, which are not probed.
'''
