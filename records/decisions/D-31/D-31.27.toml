story = "LOCALE-SOURCES-GEN"
date = "2026-11-23"
tests = ["xtask/src/locales.rs"]
body = '''
**The locale sources are generated from Unicode CLDR, never taken from the reference's files** (owner ruling #7532; coordinator ruling #7767 on the names CLDR lacks). Data: CLDR 49 (`https://unicode.org/Public/cldr/49/cldr-common-49.zip`, SHA-256 `78403d8d6fb1fed6e208bf9001bf5be00bb5abfd9f8110dae062bf49309d6a89`), Unicode License v3 (`spec/cldr/49/LICENSE`). **Vendored subset, not a build-time fetch:** `tools/cldr/cldr_extract.py` (run by hand when the pin changes; it downloads the archive or takes a copy, refuses any other SHA-256, reads it in place) writes `spec/cldr/49/locales.tsv` (per locale name, the CLDR values its source is made from, resolved through CLDR's parent locales, root and aliases), `territories.tsv` (currency and its digits, paper size, measurement system, first day of the week, weekend end, minimal days of week 1, ISO 3166 codes), `allkeys_CLDR.txt` (CLDR's root collation) and `LICENSE`; the build reads only these (2.3 MB of collation data, 1 MB of values). `--check` fails when an output would change. **Names:** `spec/cldr/locale-names.tsv`, the names the reference's locales package offers (509 SUPPORTED entries, 350 source names); a name is generated when CLDR has its locale, its language with a script the modifier selects (`@latin`, `@cyrillic`, `@devanagari`, `@iqtelif`, `@valencia`), or its language (eu_FR: Basque strings, France's territory data). 65 names (62 base locales) have no CLDR language data and are not generated: a guessed language would be a silent wrong result, a missing locale fails cleanly in `setlocale` (differences row). **Generator:** `xtask/src/locales.rs` (`cargo xtask locale-sources <dir>`): CLDR date and time patterns become `strftime` formats with padded numeric fields (`d_fmt` from the `yMd` skeleton with a 4-digit year; `t_fmt` `%r` for 12-hour locales; `t_fmt_ampm` from `hms`; `d_t_fmt` the medium date-time combination of `yMMMEd` and `t_fmt`; `date_fmt` that plus `%Z`); `grouping` and `mon_grouping` from the number patterns; currency placement and spacing from the currency pattern; `yesexpr`/`noexpr` from CLDR's `posix` messages, adding ASCII y/n where the other answer does not use the letter; week data, paper and measurement from the territory. `LC_CTYPE` copies `i18n`, which copies `i18n_ctype`, written from the derivation the built-in `C.UTF-8` uses (`spec/unicode/15.1.0`, D-5.4: classes, `combining`, `combining_level3`, simple case maps); tr and az add SpecialCasing.txt's dotted/dotless i mappings. `LC_COLLATE` copies `iso14651_t1`, CLDR's root collation as collating symbols per distinct weight of each level, every listed character and contraction, then the rest in code point order. Every character other than ASCII letters, digits and space is written as `<Uxxxx>`, so the sources need no charmap names beyond those. Data CLDR does not have (postal formats, telephone codes, vehicle codes, name formats) is left out of `LC_ADDRESS`, `LC_TELEPHONE` and `LC_NAME` rather than invented.
'''
