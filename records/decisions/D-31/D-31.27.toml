body = '''
**The locale sources are generated from Unicode CLDR, never taken from the reference's files** (owner ruling #7532; coordinator ruling #7767 on the names CLDR lacks). Data: CLDR 49 (`https://unicode.org/Public/cldr/49/cldr-common-49.zip`, SHA-256 `78403d8d6fb1fed6e208bf9001bf5be00bb5abfd9f8110dae062bf49309d6a89`), Unicode License v3 (`spec/cldr/49/LICENSE`). **Vendored subset, not a build-time fetch:** `tools/cldr/cldr_extract.py` (run by hand when the pin changes; it downloads the archive or takes a copy, refuses any other SHA-256, reads it in place) writes `spec/cldr/49/locales.tsv` (per locale name, the CLDR values its source is made from, resolved through CLDR's parent locales, root and aliases), `territories.tsv` (currency and its digits, paper size, measurement system, first day of the week, weekend end, minimal days of week 1, ISO 3166 codes), `allkeys_CLDR.txt` (CLDR's root collation) and `LICENSE`; the build reads only these (2.3 MB of collation data, 1 MB of values). `--check` fails when an output would change. **Names:** `spec/cldr/locale-names.tsv`, the names the reference's locales package offers (509 SUPPORTED entries, 350 source names); a name is generated when CLDR has its locale, its language with a script the modifier selects (`@latin`, `@cyrillic`, `@devanagari`, `@iqtelif`, `@valencia`), or its language (eu_FR: Basque strings, France's territory data). 65 names (62 base locales) have no CLDR language data and are not generated: a guessed language would be a silent wrong result, a missing locale fails cleanly in `setlocale` (differences row). **Generator:** `xtask/src/locales.rs` (`cargo xtask locale-sources <dir>`): CLDR date and time patterns become `strftime` formats with padded numeric fields (`d_fmt` from the `yMd` skeleton with a 4-digit year; `t_fmt` `%r` for 12-hour locales; `t_fmt_ampm` from `hms`; `d_t_fmt` the medium date-time combination of `yMMMEd` and `t_fmt`; `date_fmt` that plus `%Z`); `grouping` and `mon_grouping` from the number patterns; currency placement and spacing from the currency pattern; `yesexpr`/`noexpr` from CLDR's `posix` messages, adding ASCII y/n where the other answer does not use the letter; week data, paper and measurement from the territory. `LC_CTYPE` copies `i18n`, which copies `i18n_ctype`, written from the derivation the built-in `C.UTF-8` uses (`spec/unicode/15.1.0`, D-5.4: classes, `combining`, `combining_level3`, simple case maps); tr and az add SpecialCasing.txt's dotted/dotless i mappings. `LC_COLLATE` copies `iso14651_t1`, CLDR's root collation as collating symbols per distinct weight of each level, every listed character and contraction, then the code points UTS #10 10.1.3 weights implicitly (Tangut, Nushu, Khitan, core Han, other Han: Unified_Ideograph and the blocks from `spec/unicode/15.1.0`), each its own primary in code point order, as `..` ranges; unassigned code points share the undefined element, which sorts first. **Variable weighting "shifted" (UTS #10 section 4), not CLDR root's default non-ignorable:** the elements CLDR marks variable (spaces and punctuation, `*`), and a level-1-ignorable element after one, are ignorable at levels 1 to 3 and keep their place at level 4; so `a-b`, `a b` and `ab` sort together and `.hidden` sorts among the h words, the order `sort` and `ls` users of the C library have (measured black box: strcoll of a 68-string corpus equals the reference's in en_US, de_DE, fr_FR, it_IT, pt_BR, ru_RU and nl_NL; non-ignorable put every punctuated string before the digits). CLDR's per-language tailorings (`common/collation/<lang>.xml`) are not yet applied: ja, tr, sv, es, pl, zh and ko order by the root (differences row). `LC_CTYPE` adds `translit_combining` (each canonical full decomposition with the combining marks, General_Category M*, removed: é to e) and `translit_compat` (each compatibility decomposition, marks removed: ﬁ to fi, ² to 2), both from UnicodeData.txt. The POSIX `C` source is not generated yet: its code point order written as a `..` range costs 31 MB of LC_COLLATE with libniji's localedef (the reference's compiled C.UTF-8 order is 1406 bytes), and an empty LC_COLLATE is refused by the reference's localedef, so it waits for a compact code point order in localedef; `SUPPORTED` leaves `C.UTF-8` out until then (the built-in `C.UTF-8` is unaffected). **Packaging:** `cargo xtask so` writes the tree afresh to `target/niji/locale-sources`; the system `locales` package ships each file at `/usr/share/i18n/locales/<name>` and `SUPPORTED` at `/usr/share/i18n/SUPPORTED` (one manifest row each; `manifest.py lint --products` refuses a generated file without a row), and `tools/deb/copyright` carries a `Files:` paragraph for them with the Unicode License v3 text. Every character other than ASCII letters, digits and space is written as `<Uxxxx>`, so the sources need no charmap names beyond those. Data CLDR does not have (postal formats, telephone codes, vehicle codes, name formats) is left out of `LC_ADDRESS`, `LC_TELEPHONE` and `LC_NAME` rather than invented.
'''
