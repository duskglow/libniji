body = '''
**`locale-gen`, `update-locale` and `validlocale` are commands of the shipped `localedef`, chosen by `argv[0]`** (`crates/locale/src/cmds.rs`, dispatch in `crates/boundary/src/localedef.rs`; plan/utilities.md §2 and §4). The `locales` package installs `/usr/sbin/{locale-gen,update-locale,validlocale}` as links to `../bin/localedef`. Weighed: (a) shell scripts calling `localedef` once per locale, the reference's shape: each call parses its charmap and the shared sources again and needs a shell and `sed` in the root; (b) one program per command: three copies of the same static code; (c) commands of `localedef` (chosen): `locale-gen` compiles every selected locale in one process through the `localedef` command itself (`prog::run`, its messages and statuses unchanged), and a root with no shell can still run them (`dpkg --root` configures the libniji-only root through them). `locale-gen` (locale-gen(8), locale.gen(5), black-box probes of the reference's `locales` 2.41 in a trixie root; transcripts in the story's handoff): reads `/etc/locale.gen`; a line is an entry unless it is blank or its first non-blank byte is `#`; an entry is `<locale> <charset>`, compiled from the source named by the locale without its codeset (`ca_ES@valencia` for `ca_ES.UTF-8@valencia`) with the charmap `<charset>`, stored under the locale as written; an entry without a charset prints `error: Bad entry '<locale> '` and is skipped. Output: `Generating locales (this might take a while)...`, one `  <locale-without-codeset>.<charset><@modifier>... done` per compiled entry (localedef's own messages in between), `Generation complete.`; status 0, as probed, also for an unknown option, an operand or a failed locale. Without `--keep-existing` the archive `/usr/lib/locale/locale-archive` is removed first and rebuilt with exactly the selected locales (the reference's default form on trixie is the archive); with it, an entry the archive already holds is skipped. A missing `/etc/locale.gen` is a silent success that leaves the archive alone (probed). Any other read error: `locale-gen: cannot read /etc/locale.gen: <strerror>`, status 1.
'''
