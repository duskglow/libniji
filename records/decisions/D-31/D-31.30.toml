ann = "—"
status = "active"
story = "LOCALE-PROBE-GEN"
date = "2026-11-23"
tests = ["xtask/src/locales.rs", "xtask/src/locale_probe.rs", "crates/locale/tests/reference.rs"]
body = '''
**Locale data Unicode CLDR has no source for comes from black-box probes of the reference's compiled locales** (owner ruling #7791; extends D-31.27). **Probe:** `tools/probe/locale_dump.py`, run on a system with the reference's compiled locales installed (libc6 2.39-0ubuntu8.9, locales-all 2.39-0ubuntu8.12; 511 names in `locale -a`), runs the reference's own `locale charmap` and `locale -ck` for LC_TELEPHONE, LC_ADDRESS, LC_NAME, LC_PAPER, LC_MEASUREMENT, LC_IDENTIFICATION, LC_NUMERIC, LC_MONETARY, LC_TIME and LC_MESSAGES and writes `spec/locale-probe/locales.tsv` (one row per keyword, the printed bytes with every byte outside printable ASCII and the backslash as `\xHH`, the codeset per name; a non-UTF-8 name keeps only the rows whose text differs from its UTF-8 sibling's, checked by decoding both). `time-era-entries` is left out (not a text item; `era` carries the entries). `tools/probe/locale_fingerprint.c` (through `--fingerprints`) writes `spec/locale-probe/fingerprints.tsv`: per UTF-8 name, FNV-1a hashes of every POSIX class, `towupper`, `towlower` and `wcwidth` over all code points, and of the `wcscoll` order of 13 script-group corpora. **Generator:** `LC_NAME`, `LC_ADDRESS` and `LC_TELEPHONE` of every generated locale are the probe's values (the reference's wins over CLDR's territory and language names for parity; the cross-check against CLDR's ISO 3166 codes and names is in the story's report), and the 65 names CLDR does not cover, with `eo`, `syr` and `tok` (no territory), are generated from the probe in every category above (349 of the 350 source names are generated; `C` waits, D-31.27). `LC_CTYPE` and `LC_COLLATE` cannot be dumped: every generated name takes en_US's (`copy "i18n"`, root order) plus the code points the probe found its classes add and its own case pairs (`locale_fingerprint --diff en_US.utf8`, through `locale_dump.py --ctype-diff`, writes `spec/locale-probe/ctype-diff.tsv`: over all 327 UTF-8 names only U+1361 ETHIOPIC WORDSPACE in `space` for sixteen Ethiopic names and dotted/dotless i for az_AZ, crh_UA, ku_TR, tr_CY, tr_TR and tt_RU@iqtelif, #7892); a difference an addition cannot express (a code point taken out of a class, or a fingerprint difference the diff does not list) is a gap written in the source's comment (none today); a name the probe lacks keeps SpecialCasing.txt's tr / az pairs. Collation: twelve names with Latin, Ethiopic, Han or syllabics tailorings are gaps (`handoff/LOCALE-PROBE-GEN-names.tsv`), listed in docs/differences-from-glibc.md. **Names CLDR covers (decision #7890, LOCALE-PROBE-GEN-2):** the 5,278 values where the CLDR-generated source differed from the reference (LC_MONETARY 2,325, LC_TIME 2,224, LC_MESSAGES 407, LC_NUMERIC 320, LC_PAPER 2) are resolved by the standing differences rule, the reference's value unless a kept CLDR value states a concrete gain: none was kept, so every category after LC_COLLATE of every generated name the probe has is the probe's (CLDR stays the source for a name the probe lacks and for the cross-checks); LC_IDENTIFICATION's language and territory stay CLDR's English names. `LC_IDENTIFICATION` names libniji (title from the probed language and territory). Verified: every generated locale compiled by libniji's localedef and read back by the reference's `locale -k` (LOCPATH) equals the probe in all LC_NAME, LC_ADDRESS and LC_TELEPHONE keywords (349 names); the probe-generated names equal it in every probed category except LC_IDENTIFICATION. Re-verified after #7890 (LOCALE-PROBE-GEN-2, all 349 names compiled for UTF-8): every probed value of LC_NUMERIC, LC_MONETARY, LC_TIME, LC_MESSAGES, LC_PAPER, LC_MEASUREMENT, LC_NAME, LC_ADDRESS and LC_TELEPHONE equal (39,566 values) but the wide thousands separator of seven `@euro` names (13 values), and every LC_CTYPE fingerprint (classes, case maps, widths) equal; the 182 legacy-codeset entries compile, with 251 values in 81 entries differing where localedef drops a character the codeset lacks (docs/differences-from-glibc.md). No locale source file of the reference was viewed (the ruling's narrow exception was not needed).
'''
