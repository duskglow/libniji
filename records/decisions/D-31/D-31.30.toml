story = "LOCALE-PROBE-GEN"
date = "2026-11-23"
tests = ["xtask/src/locales.rs", "xtask/src/locale_probe.rs", "crates/locale/tests/reference.rs"]
body = '''
**Locale data Unicode CLDR has no source for comes from black-box probes of the reference's compiled locales** (owner ruling #7791; extends D-31.27). **Probe:** `tools/probe/locale_dump.py`, run on a system with the reference's compiled locales installed (libc6 2.39-0ubuntu8.9, locales-all 2.39-0ubuntu8.12; 511 names in `locale -a`), runs the reference's own `locale charmap` and `locale -ck` for LC_TELEPHONE, LC_ADDRESS, LC_NAME, LC_PAPER, LC_MEASUREMENT, LC_IDENTIFICATION, LC_NUMERIC, LC_MONETARY, LC_TIME and LC_MESSAGES and writes `spec/locale-probe/locales.tsv` (one row per keyword, the printed bytes with every byte outside printable ASCII and the backslash as `\xHH`, the codeset per name; a non-UTF-8 name keeps only the rows whose text differs from its UTF-8 sibling's, checked by decoding both). `time-era-entries` is left out (not a text item; `era` carries the entries). `tools/probe/locale_fingerprint.c` (through `--fingerprints`) writes `spec/locale-probe/fingerprints.tsv`: per UTF-8 name, FNV-1a hashes of every POSIX class, `towupper`, `towlower` and `wcwidth` over all code points, and of the `wcscoll` order of 13 script-group corpora. **Generator:** `LC_NAME`, `LC_ADDRESS` and `LC_TELEPHONE` of every generated locale are the probe's values (the reference's wins over CLDR's territory and language names for parity; the cross-check against CLDR's ISO 3166 codes and names is in the story's report), and the 65 names CLDR does not cover, with `eo`, `syr` and `tok` (no territory), are generated from the probe in every category above (349 of the 350 source names are generated; `C` waits, D-31.27). `LC_CTYPE` and `LC_COLLATE` cannot be dumped: such a name takes en_US's (`copy "i18n"`, root order) or, when its fingerprints equal tr_TR's, tr_TR's dotted/dotless i; a fingerprint that differs from both is a gap written in the source's comment (eleven Ethiopic names: U+1361 in class `space`; twelve names with Latin, Ethiopic, Han or syllabics tailorings; the table is `handoff/LOCALE-PROBE-GEN-names.tsv`), listed in docs/differences-from-glibc.md. `LC_IDENTIFICATION` names libniji (title from the probed language and territory). Verified: every generated locale compiled by libniji's localedef and read back by the reference's `locale -k` (LOCPATH) equals the probe in all LC_NAME, LC_ADDRESS and LC_TELEPHONE keywords (349 names); the probe-generated names equal it in every probed category except LC_IDENTIFICATION. No locale source file of the reference was viewed (the ruling's narrow exception was not needed).
'''
