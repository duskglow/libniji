tests = ["crates/locale/tests/prog.rs", "crates/locale/src/archive.rs", "crates/core/src/locale/archive.rs"]
body = '''
**localedef writes the locale archive in the Appendix D.1.6 layout, rebuilt whole on every change** (ruling #7533). A NAME without `/` goes into `<prefix>/usr/lib/locale/locale-archive` unless `--no-archive`; `--list-archive`, `--add-to-archive` (with `--replace`) and `--delete-from-archive` change or read it, with the messages and statuses of black-box probes of the reference (spec §31.8). The layout is D.1.6's, not a libniji format, because programs outside libc read it: the reference's `localedef --list-archive` lists a libniji-written archive, and an archive written by either tool is read by libniji's `setlocale` and `locale -a`. Written: the header, a name table (hash, name offset, record offset), the NUL-ended names, the records (a count and 13 (offset, length) slots by category number) and the category images 16-byte aligned, each distinct image stored once (the twelve `LC_MEASUREMENT` files of a dozen locales are often one). The name table is a prime of at least 2n+1 slots, grown until every name's hash has a slot of its own: a reader probing by hash finds a name at its first probe and an absent one at an empty slot, whatever its collision step (the hash, a rotate-by-9-and-add over the bytes seeded with the length, was fitted black-box to the reference's slots for 12 of 12 names; libniji's `setlocale` scans the table and does not depend on it). Unlike the reference the file is not preallocated (3-6.5 MB there): it is exactly the data, and every change writes a new file and renames it over the old one under an `flock` of the locale directory, so a program that has the old archive mapped keeps a consistent image and two localedefs do not lose each other's locales. A deleted name in a reference-written archive keeps its slot with record offset 0; libniji's reader treats that as absent. The archive is untrusted data: the parser checks every offset and length and refuses a damaged file whole (`[error] cannot open locale archive`, status 4) rather than rewriting it. Stored names have the codeset normalized (`niji::locale::name::archive_form`); a NAME without a codeset is stored as given and with the charmap's normalized codeset before any `@modifier` (`en_US` with ISO-8859-1: `en_US` and `en_US.iso88591`), one record for both, as the reference.
'''
