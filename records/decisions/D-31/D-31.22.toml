story = "LOCALE-CHARMAPS-GEN"
date = "2026-11-22"
tests = ["crates/charmaps/tests/codespace.rs", "crates/locale/tests/reference.rs"]
body = '''
**localedef's charmaps for the built-in codecs are read off the codecs** (owner ruling #7532: libniji generates its locale data, never from the reference's files). `crates/charmaps` (`niji-charmaps`, a host tool) writes one POSIX charmap (XBD 6.4) for each charset libniji's iconv converts with a built-in codec: ANSI_X3.4-1968, ISO-8859-1, UTF-8, EUC-JP, BIG5, EUC-KR, CP949, GB18030, GBK and WINDOWS-31J (the reference's `locale -m` names for those charsets). It probes the codec through the same `niji::iconv::Conv` iconv runs: every byte sequence it decodes to one character (extending each incomplete prefix up to 4 bytes) is listed when the codec encodes that character back to the same sequence, so each name has one encoding; sequences decoding to a character written another way (CP932's duplicate rows) and encode-only code points are left out, and the header says how many. Runs of consecutive characters on consecutive last bytes are one `<Ua>..<Ub>` line. `<mb_cur_max>` is the longest listed sequence, 6 for UTF-8 (its encoder writes up to 0x7FFFFFFF). WIDTH: the `C.UTF-8` width for UTF-8 and one-byte sequences; in the multi-byte charsets a character of two or more bytes is 2 columns (zero-width ones stay 0), EUC-JP's SS2 half-width katakana and GB18030's four-byte sequences keep their width (with that rule ja_JP.EUC-JP, ja_JP.WINDOWS-31J, ko_KR.EUC-KR and ko_KR.CP949 get the reference's widths exactly; zh_CN.GB18030 still differs in the East Asian ambiguous four-byte characters, which the reference gives 2 columns: the next step needs East Asian Width data); the rule was settled by compiling locales with both localedefs and comparing `wcwidth` (black box). `cargo xtask so` runs the program into `target/niji/locale-charmaps` and gzips each file (`gzip -9n`); the system `locales` package ships them as `/usr/share/i18n/charmaps/<name>.gz`, beside libc6's single-byte charmaps (D-6.16), which are their converters already and are not duplicated (manifest lint). Built-in names are found before any charmap file, so installing these changes no iconv conversion. The other built-in codecs (UTF-16, UTF-32, UCS-2, UCS-4) get none: they are not ASCII-compatible, so no locale can use them; charsets libniji does not convert get none either (the reference's `locale -m` lists 234 names; libniji's now 53).
'''
