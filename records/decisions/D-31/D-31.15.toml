body = '''
**ldd's front end (UTIL-4; builds on D-31.7).** `ldd` is a static PIE over `libc.a` (`csys/util/ldd.c`, shipped by libc-bin at `/usr/bin/ldd`). It reads each operand's ELF headers itself: not an x86-64 ELF64 file or no `PT_DYNAMIC` gives `not a dynamic executable` on standard error and status 1; no `DT_NEEDED` gives `statically linked` (static and static-pie programs); otherwise it runs Liella's loader on the operand with `LD_TRACE_LOADED_OBJECTS=1` and prints the loader's listing. Options, messages, `<file>:` headers for several operands and exit statuses follow the reference's observable behaviour (28 transcripts in `validation/transcripts/ldd/`, plus the swap-root comparison in `tools/deb/swap-cmds.sh` on the distribution's own libc-linked programs and initramfs-tools' `copy_exec`). `-v` prints `Version information:` only when some listed object has version needs, from `DT_VERNEED` read by ldd itself. `--version` prints `ldd (Liella) 2.39`, as getent and getconf name themselves. The listing is the loader's as it is (the interpreter rule is the loader's: D-27.56; the interim filter of ruling #6043 is removed). The comparison masks only a line's final ` (0x<hex>)` load address, which changes from run to run on both systems.
'''
