id = "D-21.6"
section = "s21"
spec = "§21.1–21.2"
ann = "KERN, COMPAT"
status = "active"
amends = ["D-21.3"]
story = "SHSTK-ENABLE"
date = "2026-11-23"
tests = ["crates/ld/tests/shstk_marking.rs", "conformance/c/s21_shstk_optin.c", "conformance/c/s21_shstk_optin_static.c"]
body = '''
**The user shadow stack is opt-in through the tunables, decided once at start-up from every start object's marking, and a later `dlopen` of an unmarked object is refused, kept or turns it off by mode** (SHSTK-ENABLE, SHSTK-SCOPE items B, C and K; owner ruling #7728, PROVISIONAL: opt-in as the reference, default-on decided later; amends D-21.3, whose "Liella never asks" now holds only while the tunables do not ask). Interface: the GNU C Library manual's hardware-capability tunables (`glibc.cpu.hwcaps`, `glibc.cpu.x86_shstk`), x86-64 psABI §2.1.7 (`GNU_PROPERTY_X86_FEATURE_1_AND`, bit `SHSTK`, in a `PT_GNU_PROPERTY` note), the kernel's shstk documentation (`ARCH_SHSTK_ENABLE`, `ARCH_SHSTK_LOCK`, `ARCH_SHSTK_DISABLE`). Probe-settled against the reference on the N100 class (Intel CET, Linux 6.8). (1) **Tunables** (`niji::config`): `glibc.cpu.hwcaps=SHSTK` asks (exact spelling; `shstk` and `SHSTK_Usable` do not; within one hwcaps list the last of `SHSTK`/`-SHSTK` counts, and a later `glibc.cpu.hwcaps` entry replaces the whole list). `glibc.cpu.x86_shstk` (exact lower case; another spelling or value is the default; the last entry counts): `off` vetoes, `on` keeps the shadow stack on through an unmarked `dlopen`, `permissive` turns it off there instead of refusing. Not asked: nothing below runs (one test of a parsed byte). (2) **Start-up decision**: dynamic (`ld.so` link step), the AND of the marking of the program, every `DT_NEEDED` object, every preload, the interpreter and the C library; static (the Rust start), the one image's (its `PT_GNU_PROPERTY` through `AT_PHDR`). A start with any unmarked object stays off in every mode (`on` included, probe-settled). When all are marked, it is enabled from a frame that never returns (`niji_machine_shstk_enter`, `ld.so`'s own copy in `entry.S`): enable, then lock `shstk` and `wrss` (the reference's mask) unless the mode is `permissive`, which may have to turn it off later. A kernel or CPU without the feature refuses the enable and the program runs without. All of it is cold code reached only when asked. (3) **dlopen** (`niji_ld::shstk::on_dlopen`): with the shadow stack on, a marked object loads; an unmarked one is refused with a `dlerror` naming SHSTK (default), loads with the shadow stack kept (`on`), or loads after every thread's shadow stack is turned off (`permissive`: a broadcast as SHSTK-SCOPE item C prices it). (4) **One difference** (docs/differences-from-glibc.md): `glibc.cpu.x86_shstk=off` vetoes in static programs too, in either order with `hwcaps=SHSTK`, as the manual describes it; the reference's static start enables and locks there. No compatibility option: the difference arises only when one string both asks for and vetoes the shadow stack, and the reference's result is had by dropping `x86_shstk=off`. Costs (N100 class, opt-in on vs off, libniji): start-up +160 (dynamic empty) to +1,180 (static) user instructions, +15k to +51k kernel instructions and +2 to +5 faults (the enable, lock and the shadow-stack mapping, and the cold code's pages); off (not asked): no measurable change. Tests: `crates/ld/tests/shstk_marking.rs` (linker-built marked and unmarked objects in every start position), `conformance/c/s21_shstk_optin.c` and `_static.c` (clause s21_1_g_0; re-exec per tunable row; SKIPPED without user shadow stacks).
'''
