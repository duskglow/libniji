id = "D-21.7"
section = "s21"
spec = "§21.2"
ann = "KERN, COMPAT"
status = "active"
amends = ["D-21.5"]
story = "SHSTK-ENABLE"
date = "2026-11-23"
tests = ["conformance/c/s21_shadow_stack.c"]
body = '''
**With a shadow stack, contexts carry the raw SSP and a user-context mark, and setcontext resumes a kernel signal ucontext by popping to its interrupted SSP; makecontext shadow stacks stay mapped** (SHSTK-ENABLE; amends D-21.5 items 2 and 3, and its "Not handled" for signal contexts). Interface: Intel SDM vol. 1 ch. 17; the kernel's shstk documentation (a signal pushes the interrupted SSP with bit 63 set onto the shadow stack; `UC_SIGCONTEXT_SS` in the signal frame's `uc_flags`). (1) **Raw SSP**: getcontext and swapcontext store the SSP of their own call (`rdssp`, 0 without a shadow stack) in `__ssp[0]`; a resume adds 8. makecontext stores its token's address (top − 8). (2) **User-context mark**: with a shadow stack, getcontext, swapcontext and makecontext set `uc_flags` to 0. Without one they leave it as it was, as the reference does (probed: a 0xff..ff `uc_flags` survives all three), so default-mode programs see no change. (3) **Signal contexts**: setcontext, with a shadow stack and `UC_SIGCONTEXT_SS` (2) in `uc_flags` (the kernel sets it, with 1 and 4, in every signal frame), does not read `__ssp` (in the kernel's frame that byte is not the library's): it searches up from the current SSP for the first entry holding (its address + 8) with bit 63 set, the innermost signal frame's token (no return address or restore token has bit 63), and pops to that interrupted SSP, then resumes the registers as usual. Rule: such a setcontext resumes the innermost signal frame on the current shadow stack (the handler's own ucontext, the common use); a signal ucontext of an outer frame, or one saved and resumed after its handler returned, is not supported (the search finds the wrong or no token; no token: it runs off the shadow stack's top and faults). (4) **Difference**: with the shadow stack on, `uc_flags` of a user context reads 0 after getcontext, swapcontext and makecontext (docs/differences-from-glibc.md). No compatibility option: the mark is what lets setcontext tell the two kinds of context apart, `uc_flags` has no meaning for a user context, and leaving stale bits would make setcontext misread a user context as a signal frame. (5) **makecontext shadow stacks are never unmapped** (SHSTK-SCOPE item E): reuse per `uc_stack.ss_sp` needs a registry the C interface gives no point to clear, and `__ssp[1..2]` of a reused `ucontext_t` cannot be trusted (a struct copy shares them; fresh memory holds garbage that must never reach munmap); freeing at thread exit would unmap stacks of contexts other threads still resume. Kept as D-21.5 left it; the owner's ruling on a registry keyed to `uc_stack.ss_sp` is requested. Cost, default mode (no shadow stack; Skylake-SP host, per call vs the merge base): getcontext and swapcontext the same as D-21.5's sequence (xor, rdssp, store, test, branch); the -2 instructions a mark written in every mode would save are not taken, so as not to change `uc_flags` there. Test: `conformance/c/s21_shadow_stack.c` step "setcontext from a handler to its ucontext" (5 frames inside the handler, the signal raised 10 frames down, then those frames return); on the N100 class it passes, and the same program linked with context.S without this branch exits by SIGSEGV.
'''
