id = "D-21.7"
section = "s21"
spec = "§21.2"
ann = "KERN, COMPAT"
status = "active"
amends = ["D-21.5"]
story = "SHSTK-ENABLE"
date = "2026-11-23"
tests = ["conformance/c/s21_shadow_stack.c", "crates/boundary/src/context.rs"]
body = '''
**With a shadow stack, contexts carry the raw SSP and a user-context mark, and setcontext resumes a kernel signal ucontext by popping to its interrupted SSP; makecontext unmaps a shadow stack when its stack memory is reused** (SHSTK-ENABLE; amends D-21.5 items 2 and 3, and its "Not handled" for signal contexts). Interface: Intel SDM vol. 1 ch. 17; the kernel's shstk documentation (a signal pushes the interrupted SSP with bit 63 set onto the shadow stack; `UC_SIGCONTEXT_SS` in the signal frame's `uc_flags`). (1) **Raw SSP**: getcontext and swapcontext store the SSP of their own call (`rdssp`, 0 without a shadow stack) in `__ssp[0]`; a resume adds 8. makecontext stores its token's address (top − 8). (2) **User-context mark**: with a shadow stack, getcontext, swapcontext and makecontext set `uc_flags` to 0. Without one they leave it as it was, as the reference does (probed: a 0xff..ff `uc_flags` survives all three), so default-mode programs see no change. (3) **Signal contexts**: setcontext, with a shadow stack and `UC_SIGCONTEXT_SS` (2) in `uc_flags` (the kernel sets it, with 1 and 4, in every signal frame), does not read `__ssp` (in the kernel's frame that byte is not the library's): it searches up from the current SSP for the first entry holding (its address + 8) with bit 63 set, the innermost signal frame's token (no return address or restore token has bit 63), and pops to that interrupted SSP, then resumes the registers as usual. Rule: such a setcontext resumes the innermost signal frame on the current shadow stack (the handler's own ucontext, the common use); a signal ucontext of an outer frame, or one saved and resumed after its handler returned, is not supported (the search finds the wrong or no token; no token: it runs off the shadow stack's top and faults). (4) **Difference**: with the shadow stack on, `uc_flags` of a user context reads 0 after getcontext, swapcontext and makecontext (docs/differences-from-glibc.md). No compatibility option: the mark is what lets setcontext tell the two kinds of context apart, `uc_flags` has no meaning for a user context, and leaving stale bits would make setcontext misread a user context as a signal frame. (5) **makecontext unmaps the shadow stack it made for the same stack memory before** (SHSTK-SCOPE item E; coordinator ruling #8100 on SHSTK-ENABLE's recommendation): the library keeps its own registry of the shadow stacks makecontext mapped, keyed by `uc_stack.ss_sp` (`boundary/src/context.rs`, module `registry`: an open-addressing table of key, base and length in anonymous memory, at most half full and doubled past that, under one lock that a `fork` child resets). When makecontext maps a shadow stack for a key it has seen, it records the new one and unmaps the earlier one: every context made on that stack memory before is over, since the new context's frames overwrite theirs. Only a mapping in the registry is ever unmapped, never `__ssp[1..2]` of a `ucontext_t` (a struct copy shares them; fresh memory holds garbage). Not unmapped (the residual): the shadow stack of stack memory that is freed and never given to makecontext again stays mapped until the process ends (the interface has no point where a context ends; freeing at thread exit would unmap stacks of contexts other threads still resume); one the calling thread is running on (makecontext on its own stack) is left mapped; a stack passed with a different `ss_sp` (an offset into the same memory) is a different key; a new key when the table cannot grow (no memory) goes unrecorded, as before this rule. Rule: resuming a context saved on a stack after makecontext was given that stack again is not supported (its shadow stack is gone: the next `ret` faults; without a shadow stack its frames were already overwritten). Cost, default mode (no shadow stack; Skylake-SP host, per call vs the merge base): getcontext and swapcontext the same as D-21.5's sequence (xor, rdssp, store, test, branch); the -2 instructions a mark written in every mode would save are not taken, so as not to change `uc_flags` there. Test: `conformance/c/s21_shadow_stack.c` step "setcontext from a handler to its ucontext" (5 frames inside the handler, the signal raised 10 frames down, then those frames return); on the N100 class it passes, and the same program linked with context.S without this branch exits by SIGSEGV. Item (5): the same program's step "makecontext on the same stack memory 64 more times" (the shadow-stack mappings in `/proc/self/smaps` keep their size), and the unit test `makecontext_shadow_stack_registry` in `boundary/src/context.rs` (the table: reuse returns the earlier shadow stack, half-full and doubling rules).
'''
