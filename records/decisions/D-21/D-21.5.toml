amends = ["D-21.3"]
story = "SHSTK-OPT-IN"
date = "2026-11-23"
body = '''
**Jumps, contexts and vfork keep a user shadow stack matching the stack** (SHSTK-OPT-IN, owner ruling #7728; amends D-21.3, whose "Liella never asks" still holds until SHSTK-ENABLE: nothing enables the shadow stack yet, and without one every path below is skipped by a zero test of `rdssp`, a no-op then). Interface: Intel SDM vol. 1 ch. 17 (`rdssp`, `incssp`, `rstorssp`, `saveprevssp`, restore tokens) and the kernel's shstk documentation (`map_shadow_stack` with `SHADOW_STACK_SET_TOKEN`); evidence: plan/reviews/SHSTK-SCOPE.md. (1) **setjmp/longjmp** (`csys/src/machine/setjmp.S`): sigsetjmp stores SSP (0 without a shadow stack) at `jmp_buf` byte 80, private to libniji: past the kernel's 8-byte mask at 72, and word 10 of the 104-byte `__pthread_unwind_buf_t`, which libniji does not use (`boundary/src/cancel.rs` uses words 9 and 11). longjmp pops (`incssp`, at most 255 per instruction) to that SSP + 8 when the target is above the current SSP; it already resumes by a jump. (2) **Contexts** (`context.S`): `__ssp[0]` (byte 936) is the SSP the context resumes with (getcontext and swapcontext write it, 0 without a shadow stack). Resuming checks for a restore token at `__ssp[0] - 8`: present (a stack swapcontext left, or a makecontext stack), it drops the caller's entry, switches (`rstorssp`) and leaves a token on the stack it left (`saveprevssp`), so the saved context's `__ssp[0]` has its token; absent, the context is on the current stack and is popped to, as longjmp does. Every resume jumps to RIP (no `push`/`ret`). (3) **makecontext** (`boundary/src/context.rs`): the context starts in `niji_machine_start_context`, which `call`s the function (in r12) so its `ret` has a shadow-stack entry, and reaches uc_link's setcontext and the thread exit by `call` as well; with a shadow stack it maps one of `uc_stack.ss_size` rounded up to a page (a call takes 8 bytes of each stack, so the shadow stack cannot fill first), recorded in `__ssp[0..2]` (top, base, length). Nothing unmaps it: the interface has no end of a context (open for SHSTK-ENABLE; options in SHSTK-SCOPE item E). If the kernel refuses, `__ssp[0]` is 0 and the context runs on its resumer's shadow stack. (4) **vfork** (`vfork.S`): the child shares the parent's shadow stack and its calls overwrite vfork's entry, so both returns drop it (`incssp 1`) and jump. Unchanged and sufficient (SHSTK-SCOPE, measured): signals (the kernel saves and restores SSP), thread start and exit, cancellation (its buffers are longjmp targets, item 1) and posix_spawn's `CLONE_VM\|CLONE_VFORK` child, which never returns into the parent's frames. Not handled: a jump or setcontext to a context captured on another shadow stack without a token (getcontext there; or a kernel-made signal `ucontext_t`, which has no `__ssp`): the target is popped to as if on the current stack, so the next `ret` faults rather than running on. Off-path cost: setjmp +3 instructions, longjmp, vfork and the context switch +4 each (register zeroed, `rdssp`, test, branch). Tests: `conformance/c/s21_shadow_stack.c` (clause s21_1_g_0; SKIPPED without user shadow stacks), `crates/core/tests/s21_contexts_clauses.rs`.
'''
