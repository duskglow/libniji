id = "D-5.13"
section = "s05"
spec = "§5.1 ⚑ COMPAT, §3"
ann = "COMPAT"
status = "active"
story = "LG6-CTYPE-OBJECTS"
date = "2026-11-22"
body = '''
**The seven legacy objects `__ctype_b`, `__ctype_tolower`, `__ctype_toupper`, `__ctype32_b`, `__ctype32_tolower`, `__ctype32_toupper` and `_obstack` are compat-only `GLIBC_2.2.5` objects of `libc.so.6`, generated with the other LG-6 objects** (`xtask/src/compat_objects.rs` into `csys/src/machine/compat_aliases.S`; single `@`, so no new link binds them; `libc.a` defines none of them, R15-2). Each ctype object is a writable 8-byte pointer to a `"C"` table at character 0 (indexable from -128): the class masks, the class masks in the 32-bit encoding, and the `tolower`/`toupper` tables, which the `__ctype32_*` case names share, as the reference's do in the `"C"` locale (spec/behaviour/ctype-objects.md). `_obstack` is 8 zero bytes. The tables are rendered by the generator (POSIX XBD 7.3.1 "C" rules, `<ctype.h>`'s `_ISbit` encoding), in `libc.so.6` only, rather than pointing at `niji_legacy::ctype_tables`: that crate forbids `unsafe`, so its statics have no symbol name an assembled object can reference, and the alternatives (an `@` in a Rust `export_name`, a mangled-name lookup at link time) depend on compiler internals. Cost: 5376 bytes of read-only data no start-up touches and six RELATIVE relocations. The objects stay on the `"C"` tables after `setlocale` (the reference moves them with the global locale): a difference for 8-bit locales and for a UTF-8 locale's `__ctype32_*` entries 128-255, ruling requested. Proof: `ctype_tables_equal_the_glibc_probe`, `ctype_objects_point_at_character_zero_at_the_compat_version`, `conformance/c/s05_ctype_legacy_objects.c` on both libraries. **Amended (CTYPE-OBJECTS-SETLOCALE, 2026-11-23): the six ctype objects follow the global `LC_CTYPE`.** When `setlocale` changes the global locale (the cold path that already republishes the threads' ctype words), it passes six words and the six objects' addresses to `niji_compat_ctype_store` (generated into `compat_aliases.S`, hidden), which writes each word to its object. The addresses are the loader's answers for the objects' `GLIBC_2.2.5` names (`dlvsym`'s lookup from the program's scope, so an old binary's COPY is the one written), asked once on the first such `setlocale`, keeping the thread's `dlerror` state: `libc.so.6` holds no symbol relocation for them, which the loader would resolve in every start-up (GOT references took the dynamic empty main to 178,292 instructions, past its 173,500 bound). `libc.a` reaches a weak empty store. The 16-bit words are `*__ctype_*_loc()`'s tables, the 32-bit ones a locale file's CLASS32/TOLOWER32/TOUPPER32 items (code points U+0000..U+00FF), else the `"C"` tables. Nothing is added to start-up or to a ctype call. Left: before the first change of the global `LC_CTYPE` the objects point at their own copies of the `"C"` tables (same contents), and with the built-in `"C.UTF-8"` the 32-bit tables are the `"C"` ones (entries 128-255 differ).
'''
