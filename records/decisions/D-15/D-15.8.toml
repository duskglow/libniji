tests = ["crates/core/tests/s15_sockets_clauses.rs::s15_1_c_8_null_value_size_query", "crates/core/tests/s15_sockets_clauses.rs::s15_1_c_8_length_reported_with_erange", "crates/core/tests/s15_sockets_clauses.rs::s15_1_c_7_null_buffer_length_query", "crates/core/tests/s15_sockets_clauses.rs::s15_1_c_8_setsockopt_null_value"]
body = '''
**NULL and zero-length result buffers in the socket calls: the kernel decides** (SOCK-NULL-OPTVAL, GitHub issue #17). (a) `getsockopt` passes the caller's `optval` and `optlen` addresses to the kernel as given (`raw::getsockopt`), where D-15.5 received the value into a library slice: the option's length protocol is the kernel's. A NULL `optval` with `*optlen` 0 is a size query (`NETLINK_LIST_MEMBERSHIPS` reports the group bitmap's size, how a netlink user sizes its list); `SO_PEERGROUPS` and `SO_PEERSEC` fail with `ERANGE` and still store the length needed; a bad descriptor is `EBADF` before any address is looked at; the kernel keeps neither address after the call, so nothing is registered (unlike the `setsockopt` levels of D-X.9 b). A zero-length library slice (a dangling non-NULL address) would answer the size queries the same, but not the `ERANGE` length or the error order, so the caller's addresses go through unchanged. (b) `getsockname`/`getpeername` keep D-15.5's `SockAddrBuf` copy-back, make the kernel call first and only then take the caller's buffer (`conv::name_out`): NULL with `*len` 0 is a length query (full length reported), NULL with room claimed is `EFAULT` with `*len` untouched, a length beyond `INT_MAX` `EINVAL`, and `EBADF`/`ENOTCONN` come first. (c) `setsockopt` with a NULL value goes to the kernel unchanged (`raw::setsockopt`). Black-box probe (reference vs this row, result, errno, `*len`): `getsockopt(netlink, SOL_NETLINK, NETLINK_LIST_MEMBERSHIPS, NULL, &0)` 0 / len 8 (before: `EFAULT`); `SO_TYPE, NULL, &0` 0 / len 0; `SO_PEERGROUPS, NULL, &0` and a 1-byte buffer `ERANGE` / len 12 (before: `EFAULT`, and `ERANGE` with len 1); `SO_PEERSEC, NULL, &0` `ERANGE` / len 10; `getsockopt(-1, ..., NULL, NULL)` `EBADF`; level -5 `EOPNOTSUPP` (before: `EINVAL`); `getsockname(fd, NULL, &0)` 0 / len 16; `getpeername(socketpair, NULL, &0)` 0 / len 2; `getpeername(unconnected, NULL, &0)` `ENOTCONN`; `getsockname(fd, NULL, &2^31)` `EINVAL`; `setsockopt(-1, SOL_SOCKET, SO_REUSEADDR, NULL, 4)` `EBADF`. Still checked in the library before the kernel, with the same result but `EFAULT` where a bad descriptor would give `EBADF` first: `accept`/`recvfrom` with an address and no length cell (the library writes `*len` itself; the kernel would consume the connection or datagram before failing), and a NULL buffer with a non-zero length for `send`/`recv`/`sendto`, `bind`/`connect` and a NULL `msghdr` (follow-up). Tests: `s15_1_c_8_null_value_size_query`, `s15_1_c_8_length_reported_with_erange`, `s15_1_c_7_null_buffer_length_query`, `s15_1_c_8_setsockopt_null_value`; plants `handoff/SOCK-NULL-OPTVAL-plants.txt`.
'''
