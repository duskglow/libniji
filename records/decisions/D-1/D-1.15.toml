body = '''
**A second `abort` in a process ends it** (coordinator ruling #8813 under the owner's delegation of 2026-11-26, with the 22:52Z correction to #8823). The first `abort` of the process unblocks `SIGABRT` and raises it, so a handler runs as before (§1.2 contract clause 4); every later `abort` in the same process (one called from inside a `SIGABRT` handler, or after a handler left by `longjmp`) skips the handler: the default disposition, `SIGABRT` unblocked and raised, then the trap and `_exit(127)` as before. One process-wide flag (`niji_rt::fatal`), set by the first call and never cleared. Gain: libsodium's configure probe for a catchable `SIGABRT` (`CATCHABLE_ABRT`: a handler that calls `abort` again) gets the answer it gets on glibc 2.41, Debian trixie's C library, and a handler that calls `abort` cannot re-enter itself. The 2.41 behaviour of the `raise`-then-`abort` and `longjmp`-then-`abort` forms was not probed (no 2.41 system available to this story); the rule above applies to them. glibc 2.39 differs: docs/differences-from-glibc.md. Test: `s1_2_c_4_1_again` (a handler that calls `abort` again runs once; the process ends by `SIGABRT`).
'''
