tests = ["crates/boundary/tests/s24_system_symbols.rs::sym_sched_getattr", "crates/boundary/tests/s24_system_symbols.rs::sym_sched_setattr", "crates/core/tests/s24_system_clauses.rs::s24_3_c_6"]
body = '''
**`sched_setattr` and `sched_getattr` are exported at `GLIBC_2.41` as thin system-call wrappers** (owner ruling R3, #5537; clause `s24_3_c_6`). util-linux (Essential: `chrt`), rt-tests, rt-app and isochron import them at that node. Liella's `<abi>` stays 2.39 until `GLIBC_2.41` is complete (R3); the two names still carry their real node, so binaries built against 2.41 resolve. Node, binding (`GLOBAL`, default `@@`) and type come from the x86_64 dynamic symbol table of Devuan excalibur's `libc6` 2.41-12+deb13u4; the rows are additions beyond the reference: in `spec/abi/versions-additions.tsv` (naming this decision), which `spec/tools/abi_extract.py` merges into `versions.tsv` and `versions-aarch64.tsv` (checked by `cargo xtask static`, abi-versions; SPEC-ABI-ADDITIONS), and by hand in `prototypes.tsv` (Appendix C.0 "Additions"). The caller's `struct sched_attr` (kernel UAPI `<linux/sched/types.h>`; Liella does not redefine it in C) is passed to the kernel unchanged with `pid`, `size` and `flags`, and the result maps to 0 or -1 with `errno`. Not a typed copy (the `MountAttr` route of `mount_setattr`): the kernel runs the size protocol itself, reading `attr->size` and writing its own size back on `E2BIG`, and a copy would lose that write-back and refuse sizes newer kernels accept. Null and unreadable pointers are the kernel's `EINVAL` and `EFAULT`; the wrapper dereferences nothing, so it needs no `unsafe`. A black-box probe of the 2.41 library (its own loader, an unprivileged user, `RLIMIT_NICE` and `RLIMIT_RTPRIO` 0) gave exactly the kernel's results for every case the tests check: get with size 56/48/120 (size field 56/48/56, nothing past 56 written), size 47 or 4097 `EINVAL`, flags 1 `EINVAL`, null `EINVAL`, pid -1 `EINVAL`, unknown pid `ESRCH`, bad pointer `EFAULT`; set nice 5 then 0 `EPERM`, `SCHED_IDLE`, size 0 as version 0, size 47 and a nonzero tail `E2BIG` with 56 written back, policy 99 / flags 1 / null / pid -1 `EINVAL`, `SCHED_FIFO` `EPERM`; errno unchanged on success. The header declaration waits for Liella's headers (SL-HEADERS).
'''
