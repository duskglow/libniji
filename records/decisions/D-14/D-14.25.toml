tests = ["crates/core/src/pattern/fnmatch.rs::the_direct_matcher_reads_utf8_names_as_the_general_one_does", "crates/core/src/pattern/fnmatch.rs::a_utf8_name_is_matched_without_compiling_the_pattern", "crates/core/src/pattern/wordexp.rs::the_nesting_stacks_are_made_only_when_a_text_nests"]
body = '''
**A group-free pattern is matched without a set of positions, UTF-8 names included; wordexp's nesting stacks are made on first use** (MATCHER-WORDEXP-RETHINK, owner rulings #8237/#8238; adopt). Profile (one call, Skylake-SP, C.UTF-8): `fnmatch("*.[ch]", "naïve.c")` cost 5055 instructions, about 1000 in the allocator (pattern copy, two decodes, two compiled programs, the string's characters), 380 decoding, 560 compiling and 600 in the bit-set item loop; only non-ASCII names took that path, because the direct (last-star) matcher took ASCII strings only. Approaches weighed: (A) the direct matcher reads a valid UTF-8 string a character at a time (bound: validation plus one pass, a few hundred instructions); (B) keep compiling but make the item loop bit-parallel (Shift-And over the items, Navarro and Raffinot, Flexible Pattern Matching in Strings, 2002) and compile once (bound: the allocations and decoding stay, about 2000); (C) classify pattern shapes (literal suffix, single star) into bespoke checks (bound as A for the shapes it covers, nothing for the rest). Adopted A: an ASCII pattern against a string that is valid UTF-8 (RFC 3629, the locale decoder's rule, checked by `str::from_utf8`) in a UTF-8 locale; a step takes the whole sequence and the character is decoded where it is compared; an ASCII byte, `/` or `.` is always a whole character, so the byte tests hold. Invalid text and non-ASCII patterns keep the general matcher (byte by byte for invalid text, as before). Per call against the pre-PATTERN-NESTING-3 base: the 56 pattern/name pairs of `fnmatch_names_utf8` 4971 -> 886 (reference 1476); every `fnmatch_names_*` row 14-44% lower. wordexp: every call filled the inline storage of three nesting stacks (two frames, eight segments) that only `${...}` words and arithmetic texts use, the ~45 instructions the plain rows had gained since the stacks replaced recursion; safe code must initialise an inline array when it is made, so the stacks are `LazyInlineVec` (made on the first push), and the result block copies the collected strings with one copy. Per call against the base: plain_8 3779 -> 3427, quoted 4040 -> 3936, split_var 4245 -> 4075, tilde_var 4407 -> 4296. Not done (next): a plain-text lane for wordexp (a text with no quote, expansion, glob or operator byte splits on blanks straight to the result; bound about 1300 for plain_8).
'''
