body = '''
**`MINSIGSTKSZ` and `SIGSTKSZ` are constants or run-time values in exactly the configurations the reference's are, with the reference's values** (owner ruling 2026-11-24, final: "yes, match glibc, with that qualification": a constant exactly where the reference has one, a run-time value exactly where it has one; HEADERS-SMALL-FIXES-2 ruling item #8417). Without `_GNU_SOURCE` or `_DYNAMIC_STACK_SIZE_SOURCE` both are integer constant expressions (2048 and 8192, Appendix C), so a static array size or a `constexpr` compiles; with either (and in C++, where g++ predefines `_GNU_SOURCE`) both expand to `__sysconf (_SC_SIGSTKSZ)` (the call declared under the reserved name, as HEADERS-SMALL-FIXES did), so such a use fails to compile with libniji as with the reference (older Catch2 is the known case) and no program rebuilt against libniji gets less alternate-stack room than with the reference. Spec s20_7_i_0 and the 2.34 release notes give `MINSIGSTKSZ` as `sysconf (_SC_MINSIGSTKSZ)` (the kernel's minimum: 3632 on the Skylake-SP host, 1776 on the Zen 1 host); the reference evaluates it to `SIGSTKSZ`'s value (14528 and 8192 there), so libniji follows the reference and the disagreement is spec/ERRATA.md E14. Probe matrix (black box, compile and run, reference and libniji, Zen 1 and Skylake-SP hosts; constant = a file-scope array (C) or `constexpr` (C++) compiles): handoff/HEADERS-SIGSTKSZ-MATCH.md. Tests: the `value` unit of `spec/tools/header_checks/s08.py` in every configuration where a header shows the macros (constant configurations: the values; run-time ones: not a constant and the `_SC_SIGSTKSZ` name), and `conformance/c/s20_sigstksz_dynamic.c` (both equal `sysconf (_SC_SIGSTKSZ)` at run time, built against either header set).
'''
