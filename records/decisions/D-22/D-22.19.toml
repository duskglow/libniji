id = "D-22.19"
section = "s22"
spec = "§22.1, §22.3"
ann = "HIST"
status = "active"
story = "THREAD-FORCED-UNWIND"
date = "2026-11-20"
tests = ["crates/core/tests/forced_unwind_products.rs", "crates/core/tests/s22_threads_clauses.rs"]
body = '''
**`pthread_exit` and acting on cancellation unwind the thread's stack with the program's unwinder** (issue #25; ends D-22.11's interim). Designed from the Itanium C++ ABI's base unwinding interface (§1.2 `struct _Unwind_Exception`, §1.3 `_Unwind_ForcedUnwind` with a stop function, `_UA_FORCE_UNWIND`, `_UA_END_OF_STACK`) and POSIX `pthread_exit`/cancellation (cleanup handlers, then thread-specific destructors). **Where the unwinder comes from:** at each exit, `_Unwind_ForcedUnwind` and `_Unwind_GetCFA` are looked up through the loader's `dlsym` entry with `RTLD_DEFAULT` (the definitions the program's own references bind to: `libgcc_s.so.1`, which every C++ program and every `-fexceptions` C program with cleanups loads, or another unwinder the program loaded). Nothing is looked up or stored at start-up or thread creation, and nothing is cached (a `dlopen` or `dlclose` changes the answer). libniji loads no unwinder itself: a process without one (a C program that never needed one, a statically linked program) exits as before, jumping to the C cleanup buffers newest first, so it never fails for want of `libgcc_s.so.1`. **The unwind:** the exception object (class `NIJIEXIT`) lives in the thread descriptor (`UnwindArea`, 48 bytes), not on the stack the landing pads reuse. The stop function runs for each frame before its cleanups: the old-style records (`_pthread_cleanup_push`) of frames already left run, and when the newest `__pthread_register_cancel` buffer lies below the frame's canonical frame address it is jumped to; its handler calls `__pthread_unwind_next`, which starts a new unwind from there, so C buffers, `-fexceptions` cleanups and C++ destructors run in frame order. At `_UA_END_OF_STACK` (the thread's start or `_start`, which carry no return address) the remaining buffers and records run, then the exit sequence (`thread_local` and key destructors, D-22.11). If the unwind cannot start, the exit goes on without it. **A handler that does not rethrow** (C++ requires the rethrow; ruling #6884, THREAD-FORCED-UNWIND-2): the exception's cleanup function, which `__cxa_end_catch` calls at that handler's end, ends the process: `FATAL: exception not rethrown` on standard error, then `abort` (SIGABRT). The thread can neither go on (it was told to exit) nor exit from there with the frames outside the handler unwound; the black-box probe that settled this choice is reported in the THREAD-FORCED-UNWIND-2 hand-back. **Not covered:** a statically linked program (libc.a has no way to find libgcc_eh's entries without a weak reference that would also land in libc.so.6) and a program that carries its own unwinder hidden (`-static-libgcc`) keep the buffers-only exit. Cost: the lookup is two `dlsym` calls per exit through `pthread_exit` or cancellation (measured 11-20, Skylake-SP host, user-mode instructions: 3,656 per pair, of 68,518 per thread created, exited through `pthread_exit` from a C++ frame and joined; not cached, see the THREAD-FORCED-UNWIND-2 handoff); in a process without an unwinder the miss also sets the thread's `dlerror` text, made once per thread and released at its exit (DL-15). Probe (glibc 2.39, Skylake-SP host, black box): destructors run, `catch (abi::__forced_unwind &)` and `catch (...)` entered at `pthread_exit` and at each cancellation point kind, `pthread_cleanup_push` with `-fexceptions` runs in frame order with `__attribute__((cleanup))`, main thread destructors run; libniji now matches on every case.
'''
