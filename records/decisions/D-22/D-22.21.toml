id = "D-22.21"
section = "s22"
spec = "§22.1, §22.3"
ann = "HIST"
status = "active"
amends = ["D-22.19"]
story = "THREAD-FORCED-UNWIND-STATIC"
date = "2026-11-20"
tests = ["crates/core/tests/forced_unwind_products.rs::static_programs_unwind_with_the_unwinder_they_link", "crates/core/tests/forced_unwind_products.rs::static_libgcc_cxx_programs_unwind"]
body = '''
**A static program's exiting or cancelled thread unwinds with the unwinder the program links** (amends D-22.19, which left static programs on the buffers-only exit; ruling #6885). A static program has no loader, so D-22.19's `dlsym` lookup finds nothing. `csys/src/machine/unwinder.S` gives `niji_machine_unwind_force` and `niji_machine_unwind_get_cfa`, the addresses of `_Unwind_ForcedUnwind` and `_Unwind_GetCFA` (Itanium C++ ABI §1.3) or 0. As the C layer builds it (libc.so.6, ld.so, the test binaries) both return 0. `cargo xtask so` assembles the same file with `-DNIJI_STATIC_ARCHIVE` and puts it in the published `libc.a` in place of that member: there the references are weak, so a static link that takes the compiler's unwinder (`libgcc_eh`: a C++ runtime throws through it, `-fexceptions` cleanups resume through it) resolves them, and a program that needs no unwinder (a C program without unwind cleanups) links none because of libc.a and keeps the buffers-only exit. The thread's exit asks the linked unwinder first (two calls that return a constant), then the loader's `dlsym` as in D-22.19. **Checks:** the build fails unless the replaced member is the archive's only reference to those two names and a weak one, and unless libc.so.6's dynamic symbol table names neither (no symbol, relocation or start-up lookup in the shared library). **`-static-libgcc`:** such a program's own unwinder is hidden (libgcc_eh's symbols have hidden visibility), so nothing outside the program can find it. A C++ program linked that way with the shared C++ library still loads `libgcc_s.so.1` through it, and the exit unwinds with that copy; the program's landing pads resume with their own copy (tested). A `-static-libgcc` program that loads no `libgcc_s.so.1` (C with `-fexceptions`, or C++ with `-static-libstdc++`) keeps the buffers-only exit: its C cleanup buffers and key and `thread_local` destructors run, its unwind cleanups and C++ destructors do not (open for a ruling, THREAD-FORCED-UNWIND-STATIC hand-back). **Cost:** none at start-up; in libc.a two weak references and two 3-instruction functions in a member a thread's exit already pulls; in libc.so.6 the two functions that return 0 (cold text) and one more call per thread exit. Probe (glibc 2.39, Skylake-SP host, black box): the oracle programs `forced_unwind.cc` and `forced_unwind.c` (three builds) linked `-static`, and `forced_unwind.cc` linked `-static-libgcc`, print the same text as the dynamic ones; libniji now matches on each.
'''
