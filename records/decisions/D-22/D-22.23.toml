id = "D-22.23"
section = "s22"
spec = "§22.1, §22.3"
ann = "HIST"
status = "active"
amends = ["D-22.21"]
story = "THREAD-EXIT-NO-UNWINDER"
date = "2026-11-22"
tests = ["crates/core/tests/forced_unwind_products.rs::static_libgcc_programs_without_a_shared_unwinder_abort_when_frames_need_unwinding", "crates/core/tests/forced_unwind_products.rs::static_libgcc_c_programs_with_nothing_to_unwind_exit_cleanly", "crates/rt/tests/unwind.rs::d22_23_handler_frames_above_the_start"]
body = '''
**A thread exit that must unwind and finds no unwinder ends the process with a message** (amends D-22.21's `-static-libgcc` case, which kept the buffers-only exit for a program that loads no `libgcc_s.so.1`; rulings #7118 and #7119: failing loudly is better than silently going on). Such a program (C with `-fexceptions`, C++ with `-static-libstdc++`) carries its unwinder hidden, so at the exit D-22.21's linked entries and D-22.19's `dlsym` lookup both find nothing. Going on skipped the unwind work: `-fexceptions` cleanups and C++ destructors did not run, a mutex a `lock_guard` owned stayed locked and `std::async`'s `get()` waited forever (no `broken_promise`). **Detection:** only then, and only on the exit's first step (`pthread_exit`, `thrd_exit` or acting on cancellation; not again after each cleanup buffer), the thread's stack is walked with libniji's own call-frame walker (`niji_rt::unwind`, D-2.11, the one `backtrace` uses; `unwind::handler_above`): registers captured in the checking frame, objects found through the executable, this library's image and, for any other address, the loader's own walk over the loaded objects (`crate::backtrace::frame_object`; a static program has only the first two). A frame needs an unwind when its FDE's CIE names a personality routine (`P`) and its language-specific data pointer (`L`) is not null (or cannot be read, or the CIE has no `L`: the personality still runs). libniji's own frames with a personality (`pthread_once`'s routine frame, machine/once.S; the guarded calls, machine/guard.S) do not count: each also registers an old-style cleanup record, which the exit without an unwinder runs (conformance `s22_cancel` cancels inside a `pthread_once` routine). The Itanium C++ ABI §1.3 and the LSB's `.eh_frame` augmentation define these fields. If a frame needs one, `FATAL: an exiting or cancelled thread has frames to unwind (cleanups, destructors or handlers) and no unwinder can be found; link libgcc_s dynamically (not -static-libgcc) in a program whose threads exit or are cancelled` goes to standard error, then `abort` (SIGABRT, exit status 134). Otherwise (a plain C thread: cleanup buffers and old-style records only, or nothing) the exit without an unwinder goes on as before. The walk stops at the outermost frame (no return address), an address no object describes, a row it cannot evaluate, or 65,536 frames, and answers for the frames it saw (a frame beyond such a break is not seen: the exit then goes on as before). **Cost:** nothing at start-up or thread creation; with an unwinder found (every dynamic C++ program, every program loading `libgcc_s.so.1`), nothing; without one, one walk per exit through `pthread_exit` or cancellation (not per return from the start routine). **Reference** (black box, glibc 2.39, Skylake-SP class host, `forced_unwind.c` in the `-fexceptions` and buffers builds and `forced_unwind.cc` with `-static-libgcc -static-libstdc++`): with `libgcc_s.so.1` installed each ends with SIGABRT (134) and no message; the build without `-fexceptions` and a thread with nothing to unwind exit normally; with `libgcc_s.so.1` hidden every build ends with SIGABRT after `libgcc_s.so.1 must be installed for pthread_exit to work`. libniji matches the status where there is unwind work and keeps the normal exit where there is none, also without `libgcc_s.so.1` (docs/differences-from-glibc.md). COMPAT-38 registers an option restoring the exit that skips the unwind work (registration only).
'''
