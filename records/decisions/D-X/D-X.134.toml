story = "HEAP-FOREIGN-TB-SPEED"
date = "2026-11-19"
body = '''
**In a process the runtime did not start, the heap finds a thread's cache word in the thread registry by thread pointer alone, with no system call; and the malloc-debug paths, which every heap operation of such a process takes (`FOREIGN`), build the caller text only while tracing** (amends D-X.60's "reads the registry's cache word"). Measured cause (Zen 1 count host, `perf stat`, test builds of the gate's pass 2, exports interposed): every heap operation of a foreign thread asked `thread::foreign_words()` for its cache word, and that makes a `gettid` system call per call to tell a new thread on a reused block from the old one; strstr_find's kernel instructions went from 18.5G (before TB-FOREIGN-WORDS-LOW) to 278G, its wall time from 386 s to 553 s. (1) `thread::foreign_heap_cache_slot` reads the registry entry keyed by the thread pointer and its `own` flag, nothing else: what a new TID at the pointer changes (`clear_words`, the `own` reset) never touches the cache word, which passes to the block's next thread (one owner at a time; `clear_words` keeps it on purpose), and `own` is set only between `claim_own` and `release_own` on a thread `create` made, at its own pointer, so it is clear for any other thread there. No chunk mappable: no cache, as before. (2) `heap::Caller` holds its 256-byte buffer only when `TRACE` is set; zeroing and moving it on every debugging-path call was about 45% of a foreign malloc/free pair. Results (same host): a foreign malloc/free pair in a release build 773 user + 754 kernel instructions on next, 396 + 0.6 after; pass 2 strstr_find 278.4G -> 18.7G kernel instructions, wall 553 s -> 395 s (debug test build, before the Caller change). Not reached: the brief's bound of a foreign pair within 10% of a runtime-made thread's (about 122, bench/instr_limits.tsv `malloc_free_*`): the rest is the general route of the debugging paths and the registry probe; a cache word in one load on a foreign thread needs per-thread storage the foreign block does not give (D-X.58 option 4, ELF TLS, ruling #4212). Tests: crates/boundary/tests/heap_foreign_nosys.rs (a forked child under strict seccomp mode, where any system call kills it, runs warm malloc/free on a foreign thread's cache); the D-X.60 tests (tb_foreign_low_words.rs) unchanged; plants handoff/HEAP-FOREIGN-TB-SPEED-plants.txt.
'''
