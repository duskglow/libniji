date = "2026-11-20"
tests = ["xtask/src/so.rs::libc_so_read_only_data_is_one_segment_led_by_the_startup_group", "xtask/src/so.rs::startup_group_first_keeps_one_read_only_segment_at_every_text_size"]
body = '''
**libc.so.6's read-only data after its text is one PT_LOAD, led by the start-up group, at every text size** (LAYOUT-RO-STABLE; amends D-X.133). Cause: GNU ld's default script places `.rodata1` (the start-up read-only group, aligned to its bound, 64 KiB; D-X.62, D-X.133) after `.rodata`, so the gap ahead of the group followed the text's size, and the linker starts a new segment where a gap holds a whole page: libc.so.6 had one read-only PT_LOAD when `.rodata` ended within a page below a 64 KiB boundary and two otherwise (snapshot 50abc44ed one; next 3f2a84520 and b732d9b46 two). Change: both libc links add a linker-script fragment (`xtask/src/so.rs` `RODATA1_FIRST`, `INSERT BEFORE .rodata`) that places `.rodata1` first: the group starts the read-only segment on its alignment (the gap is now the one between the text and read-only segments) and `.rodata` follows it without a gap. `cargo xtask so` refuses a libc.so.6 whose read-only data after the text is not exactly one PT_LOAD starting at `.rodata1`; a unit test links a libc-shaped shared library at text sizes 0x30 + k * 4 KiB, k = 0..16, and finds one read-only PT_LOAD at every size with the fragment and two at some sizes without it. Measured (paired on next b732d9b46, release products: `libc.a`, `niji-crt1.o` and `ld.so` byte-identical, only libc.so.6 differs; execcount: user instructions, ASLR off, median of 101 (Zen 1 host) or 51 (Skylake-SP host)): empty main 787,723 -> 783,943, three libraries 1,042,973 -> 1,039,193, clock_gettime 821,755 -> 817,974 (Zen 1); 787,802 -> 784,022, 1,043,022 -> 1,039,243, 821,805 -> 818,025 (Skylake-SP); page faults unchanged (57, 73, 61-62). An exact user trace (`perf record -e intel_pt//u`, Skylake-SP) puts the whole -3,780 in the interpreter's per-segment work for the extra program header (`Elf::read_phdr` -2,583, `link` -266, `Elf::check_table` -235, `protect_relro` -161, the rest under 100 each). The +2,638 on the three-library row that DYN-START-BISECT-1120 measured for the same placement is not the placement: by the same trace all of it is in ld.so, whose binary in that product set differs from the one it was compared with (another hash, 339 against 320 text symbols); on one base the placement gains on every row. Costs: up to 64 KiB of address space and zero file bytes between the text and the read-only segment (before, the same alignment gap lay ahead of `.rodata1` inside the read-only segment or split it). Static programs are not changed: a program's link uses the default script, whose only lever before `.rodata` is the start object, and the levers measured for them (handoff/LAYOUT-RO-STABLE.md) each have a cost that needs a ruling. No spec clause (layout of the products).
'''
