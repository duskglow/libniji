body = '''
Slice 17 header generation (plan/headers.md section 2.4; no spec clause, proved by header_check.py P5 and P1, P2 and P3 against the tables, and validation/headers_p10_s17.sh P10). A structure member may be a bit-field, a pointer to function (declared void (*)(void)), an anonymous union, a pointer to a const structure, or of a typedef name that does not resolve to a scalar (FILE *, wchar_t): the typedef or tag it needs is emitted first. A name an included header already provides is left out only where that header makes it visible in every configuration of the including header (error_t comes from errno.h in the GNU configurations only; argz.h declares it in all); this also emits __ino64_t, __off_t and __pid_t in sys/types.h where the table lists them. An object of pointer-to-function type is declared with its name inside the parentheses. A structure tag first named in a function type's parameter list, also one spelled through a typedef (_IO_FILE for FILE), is declared first. Macro-only headers (sysexits.h, cpio.h, sys/queue.h) do not include features.h, because the table lists them in every configuration. The obstack macros are written from the GNU C Library manual (Obstacks) over the struct obstack members of layouts.tsv; sys/queue.h from queue(7), list(3), slist(3), stailq(3), tailq(3) and circleq(3); STAILQ_LAST is not defined (the tables do not list it). Not provided: the internal inline helpers of argp.h (_argp_input, _option_is_short, _option_is_end) and the inline forms of argp_usage and argz_next; libniji calls the exported function. Open for a ruling.
'''
