body = '''
**The dynamic start-up fault count no longer moves with the size of libc.so.6 or ld.so** (LAYOUT-DYN-PHASE, follow-up of D-X.123 and D-X.125). Method: the products built once per profile with a link-logging compiler wrapper; each library relinked with a retained, never-run text section of k pages after every input (k = 0..16, a full turn of the 64 KiB fault-around window; the k = 0 relink is byte-identical), and `hot_text_products`' dynamic probe reproduced (same staging, argv[0], environment, ASLR off, warm-up + 5 runs, every run identical); per-mapping split with `perf record -d -e page-faults`. Before (Skylake-SP host, Linux 6.8, next 36df714e7): fast, libc padded 86, 87 (k = 1..5), 86 (6..9), 85 (10), 86 (11..16), ld.so padded 86 but 87 at k = 6, 7; release, libc padded 85, 84 (1..7), 83 (8..10), 84 (11), 85 (12..16), ld.so 85 at every k. Only libc's read-only mappings and (k = 6, 7) ld.so's read-only data moved. Causes and changes: (1) The loader made a segment partial whenever its file bytes ended inside a page, also without zero fill, and replaced the last page of each read-only segment by an anonymous copy read through its whole-file view of the object: three reads per library through a 2 MiB-aligned view whose windows follow file offsets, sharing a window with the `.dynamic` read or not by size. A segment is now partial only when p_memsz > p_filesz (gABI: only those bytes are defined zero); without zero fill its last page is mapped from the file like the others (no copy, no private page, no store into a writable one). (2) libc.so.6's start-up read-only group `.rodata1` (D-X.62) had no anchor in the library (the anchor is in the start object, which the library's link has none of) and started wherever `.rodata` ended, one or two windows by size; the build tag the interpreter reads (L14-10) sat in `.rodata`, a window of its own. The library's links now take `entry.S` assembled with `-DNIJI_LIBC_SO` first: an empty `.rodata1` aligned to the group's bound (64 KiB here) and retained (SHF_GNU_RETAIN: the library's `--gc-sections` dropped the unreferenced empty section with its alignment); the tag joins the group (`startup_ro::LOADER_READ`). With libc's base 64 KiB aligned (its p_align, which the loader honours) the group takes one window at every size. (3) ld.so's read-only data followed its text. The kernel places the interpreter at a fixed phase (D-X.125's span; one page below a 64 KiB boundary with ASLR off, so the text at image offset 0x1000 starts a window), and two start-up reads 8 KiB apart in `.rodata` (`dispatch::resolve_fold_slow`, `boot::tables`) straddled a window boundary for 2 of 16 text sizes. An INSERT fragment (`ld-phase.ld`) starts `.rodata`, and every segment after it, at the text's 64 KiB phase. `cargo xtask so` refuses a libc.so.6 whose `.rodata1` is off its alignment or does not hold the tag, and an interpreter whose read-only data is off its text's phase. After (same method and host): fast 80 and release 76 for both libraries at every k; `DYN_TRUE_BOUND` 89 / 86 -> 80 / 76. The static probes do not map either library (the tag is unreferenced there). Costs: up to 60 KiB of zero file bytes and address space before libc's `.rodata1` and between ld.so's text and read-only data, never touched. Not covered: with ASLR on, ld.so's base phase is random (libc's base stays 64 KiB aligned); the libraries' header reads through the loader's whole-file view (offset 0, the version sections, `.dynamic`) remain separate from the mapped image's; the Zen 1 host class was not measured. A k-padding product test in the gate was not added: the three build checks catch each lever's removal at no test time, while a series costs 34 relinks and probes per profile. No spec clause (layout of the products; the mapping of a segment without zero fill follows the gABI's program loading rules).
'''
