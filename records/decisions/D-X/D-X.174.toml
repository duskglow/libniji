story = "HEADERS-NONNULL-MATCH"
date = "2026-11-25"
tests = ["xtask/src/headers/slices/s19.rs::nonnull_columns_are_the_probes", "xtask/src/headers/slices/s19.rs::diagnostic_attributes_match_the_reference"]
body = '''
**The nonnull attribute of every declaration libniji's headers make is the reference's, read only from black-box calls: `attr_probe.py`'s `n.k` test calls `(F)(..)` with a null pointer constant for pointer parameter k, every other pointer (function pointers, pointer typedefs, `locale_t`) a valid object and every number 0, in a unit built with `-fno-builtin`; the table's `nonnull` column is that test's result with `_FORTIFY_SOURCE` on and off (the table run stops when the two differ, as it cannot say so), and `nonnull_columns_are_the_probes` requires the committed column to be the probe's** (HEADERS-NONNULL-MATCH). Cause of the earlier sets (56 functions stricter, 48 looser than the reference): the probe passed a literal 0 for function-pointer parameters on every line (pthread_create 2,4, on_exit 2), a size of 1 that woke `access` attributes (write 2, fwrite 1, strxfrm 1, regexec 4, regerror 3, the `*_r` buffers), read the compiler's builtin knowledge as the header's (printf and scanf formats, fputs, nan, dcgettext 2), did not walk included headers or pointer typedefs (qsort 4, bsearch 5, statfs, rlimit, statx, `strto*_l`), and called through a function-like macro the reference defines at -O2 (fread_unlocked, fwrite_unlocked 4). `check` compares an `n` or `rn` line on the signal it measures only; the other attributes are judged on their own lines. Checked in six configurations (C with `_GNU_SOURCE` and `_FORTIFY_SOURCE` 0, 2 and 3, no feature macro, C++ with fortify 0 and 3): 0 differences. Why: a nonnull mark the reference does not have breaks `-Werror=nonnull` builds of correct programs (zstd's `pthread_create(&t, NULL, fn, arg)`) and lets the compiler delete a caller's own NULL checks after the call; a missing one drops warnings programs rely on.
'''
