body = '''
**A macro can have a value per header, and a structure tag can be defined inside another structure, both as the reference does** (HEADERS-STAGE2-GAPS-J; RELEASE-SNAPSHOT-1127A findings). `spec/abi/macro-values.tsv` (key header, name) gives a name's value in one header where the reference's differs from its `macros.tsv` row: `DELETE` 2 in `<protocols/talkd.h>` (0 in `<arpa/nameser_compat.h>`), `ABORT` 6 and `NOP` 8 in `<scsi/scsi.h>` (238 and 241 in `<arpa/telnet.h>`); the generator, `header_check.py` P1 and the rows test read it. `spec/tools/dup_values.py` compares every `headers/dup-listed.tsv` macro per header with the reference (0 DIFF on this head), for later snapshots to rerun. `headers/nested-tags.tsv` lists tags defined at the member of an outer structure (`struct whoent` in `struct whod`: C++ `whod::whoent`; C unchanged). `<protocols/timed.h>` `ANYADDR` expands to `NULL` as the reference's does (coordinator ruling #8789: match stock); `TSPTYPES` and `RIPCMDS` define the `tsptype` and `ripcmds` name tables. Black-box probes of the reference only (compiler verdicts, emitted values, `nm`).
'''
