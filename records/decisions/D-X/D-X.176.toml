tests = ["xtask/src/affected.rs::steps_start_after_the_steps_they_need_and_read_in_their_order", "xtask/src/affected.rs::two_test_group_steps_never_run_at_once", "xtask/src/affected.rs::the_test_group_binaries_come_from_the_grouped_overrides_or_none", "xtask/src/affected.rs::the_first_pass_splits_at_what_runs_the_products", "xtask/src/affected.rs::a_test_step_beside_others_gets_its_share_of_the_test_threads", "xtask/src/affected.rs::side_by_side_needs_the_measured_memory_under_the_smallest_cgroup_limit", "xtask/src/affected.rs::the_xtask_targets_that_run_products_wait_for_the_products"]
body = '''
**A non-FULL `affected --run` is a bounded run of independent steps: the products build, the xtask tests and every crate's test passes start as soon as the steps they need have ended, up to a bound set by the memory limit and the free CPUs** (AFFECTED-LAYOUT-ROWS-2, step 3 of AFFECTED-LAYOUT-ROWS; amends D-X.142, which ran only the products build beside the xtask tests; tooling only, no ABI or behaviour change). The rules are in the module doc of `xtask/src/affected.rs` (`run_steps`, `step_slots`, `first_pass_split`, `test_group_binaries`, `xtask_test_split`); this record holds why. Cause (alert #3349, gate `headers-stage2-gaps-b-4-gate6` on a Zen 1 host, 48 CPUs, load near 0): 27.5 min wall for 6,346 s of CPU, 3.9 cores busy, because the steps (products 260 s, xtask tests 477 s, `niji` 246 s, `niji-math` 158 s and 266 s native, `niji-boundary` 118 s and 114 s) ran one after another. Steps: a crate's passes keep their order (two passes of one crate could meet in the files they write); a crate's first pass splits into the targets that run no products (they start beside the products build) and those that do (`names_products` over a target's whole text with its support files) after it; the xtask unit tests that read products (`product_unit_tests`: a test whose text joins a products path) run after the build too, by name, and are skipped by the same names beside it (the b-4 proof found `a_product_build_leaves_no_earlier_product_for_the_manifest_lint` reading a half-written `target/niji` there; the D-X.142 pair had the same race). Steps that may hold a nextest test group (`.config/nextest.toml`; a grouped override that is not `binary(=x)` groups every test step) never overlap, so a group's limit still holds across the run. Bound (`step_slots`): one step when the memory limit (smallest cgroup `memory.max`, and `MemTotal`) is under `SIDE_BY_SIDE_BYTES` (6 GiB), which is exactly the old order; else one step per `STEP_BYTES` (3 GiB, half the measured pair with headroom) and per `STEP_CPUS` (12) free CPUs, at least two; free CPUs are the run's own (affinity or quota) and at most the host's online CPUs minus its one-minute load. Test steps beside others get `NEXTEST_TEST_THREADS`/`RUST_TEST_THREADS` set to their share of the run's CPUs. Each step writes `target/affected-steps/<n>.log`; console text and logs are printed whole in step order, so a run reads as before; any red step makes the run red. Measured on the Zen 1 host under the gate's 16 GiB limit (6 CPUs for the run, so two steps at a time), products cleared before each run, test binaries warm, the before binary being the D-X.142 code: a libm change (12 targets, 0 programs) took 445 s before and 365 s after (80 s, 18% less); `headers-stage2-gaps-b-4` (5 targets, 0 programs after D-X.175, xtask tests selected) took 789 s before (788 s in an earlier job) and 737 s after (52 s, 6.6% less; 1,158 tests both ways). The b-4 run stays long because its xtask tests (506 s) run beside the products build (357 s), as they already did before, and two steps at a time leave the crate passes little room. Peak `anon` of a proof job (three runs): 2.8 GiB (libm) and 4.4 GiB (b-4), under the 6 GiB a two-step run is allowed. Not measured: a run with more CPUs than the gate's 6 (more than two steps).
'''
