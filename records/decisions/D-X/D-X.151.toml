body = '''
**The workload count measures page faults in one address layout and reports the lowest run; its cost is logged per step** (WL-COUNT-HONEST-CHEAP, 2026-11-21; tooling only, no product code; amends D-X.141's page-fault statistic). Why: within one count faults moved run to run (gzip-c 306..566 for libniji, 322..407 for glibc), so held page-fault levels were a weak ratchet. Probes on the Zen 1 host (60 vCPU, two NUMA nodes, automatic NUMA balancing on, THP madvise-only; 5..25 runs per condition, glibc and next's dynamic kit): ASLR was most of the spread (the stack, heap and mapping bases cross page edges differently each run; seq glibc 136..142 with ASLR, 133 in every run under `setarch -R`; cut-tr-uniq libniji median of 5 602..609 with, lowest of 5 592 in every group without). What remains are rare positive excursions on runs of two seconds or more (gzip-c glibc 403 once in 10 runs against 269), minor faults only, not removed by binding the run to one node (`numactl --cpunodebind --membind`, same excursions), so most likely NUMA balancing's time-driven hinting faults. They only add faults, so the lowest run is the program's own number; the median needed 3 clean runs of 5. (1) Every measured run (warm-up, perf, md5, strace) of every column runs under `setarch -R` (`validation/wl_stats.sh` `wl_run_prefix`), and a row's page faults are the lowest of its FAULT_RUNS runs (`wl_fault_field`; median and min..max still printed). Rows of this method are cached as `.q.tsv`; `WLC_ASLR=1` measures as before (ASLR, median, `.p.tsv`). (2) Cost: `wl_prep.sh` and `wl_count_run.sh` log `wl_phase:` lines (lock wait, build cached or built, relink, each row and column with cache hit or miss and its perf, md5 and strace seconds, faults re-measures); `wl_count.sh` sums them (`wl_cost:` lines) and logs the job's wall, CPU and file-system writes (`/usr/bin/time`). (3) Cuts that measure the same: the thread and process flags come from the clone and fork CALL lines of the `strace -C -f -y` traces (the separate clone-only strace pass is gone; text a workload writes that names CLONE_THREAD is not a call line); the third strace pass runs only when the first two differ (otherwise it cannot move a median); a faults re-measure (new and base more than FAULT_PCT apart) re-runs only the perf runs and keeps the syscall, output and advisory fields. (4) Holds (MAY-TIGHTEN only): from 5 repeated counts of next 8e34f9c72's dynamic kit and glibc under this method (every single-process row the same number in all 5 counts; pipe-mix 1280..1288, tar-gz 618..626, printf-loop 1880131..1880178), gzip-c's hold is dropped (level 1.7578; next measures 292 / 269 = 1.0855 in every probe count and in a real wl_count, so the 1.10 bound binds). The other levels are NOT re-recorded: a real wl_count gave seq 158 / 133 where the probes, in another process environment, gave 157 / 133 in all 5 counts (printf-loop 1.2872 vs 1.3055). In one address layout the size of the environment moves the stack and so a row by about one fault per process; the levels proposed from the probes could be exceeded by a count and are not used. Measured runs in a fixed environment, then levels from real counts, are the next step. sed-s (1.2817 measured, level 1.2112), gawk-sum (1.2000 vs 1.1993) and gawk-printf (1.2075 vs 1.2009) measure above their levels and keep them unchanged: a level is never raised without a ruling. Tests: `validation/wl_stats_test.sh` (statistic, run prefix, flags from call lines, adaptive passes, row splice, cost summary, wiring); plants `handoff/WL-COUNT-HONEST-CHEAP-plants.txt`, `validation/wl_stats_plants.sh`.
'''
