body = '''
**Slice 7 headers: 64-bit redirections of GNU-only functions, pre-2008 `struct stat`, reserved names** (SL-HEADERS-S07-3; plan/headers.md section 3, P2 and P3; extends D-X.113). Three generator rules, each driven by a `spec/abi` row. (1) A function the address probes saw in no `_FILE_OFFSET_BITS=64` configuration (a GNU-only function such as `fallocate`, `prlimit`, `preadv2`, `pwritev2`, `scandirat`, `versionsort`) or whose visibility condition also holds under `_GNU_SOURCE` (`lstat`, `lockf`, `fseeko`, `ftello`, `mkstemp`, `mkostemp`, `mkostemps`, `ftruncate`, `truncate`, `pwrite`) binds to its 64-bit twin under `_FILE_OFFSET_BITS=64`: `callsites.tsv` `call` rows whose configurations all end in `+gnu64` name the symbol, and the declaration is wrapped in `#if __NIJI_FOB64` unless its own condition is a plain conjunction with `!__NIJI_FOB64`. A call with the reference's headers and with libniji's then references the same symbol. (2) `struct stat` and `struct stat64` have the members `st_atime`, `st_atimensec`, `st_mtime`, `st_mtimensec`, `st_ctime`, `st_ctimensec` (a `long` and an `unsigned long` each, the same layout as a `struct timespec`) below POSIX 2008 and timespec members `st_atim`, `st_mtim`, `st_ctim` from it on (`__NIJI_POSIX >= 200809L \|\| __NIJI_XSI >= 700 \|\| __NIJI_MISC`): `struct timespec` is then no name of `<sys/stat.h>`, `<fcntl.h>`, `<sys/fcntl.h>` and `<sys/file.h>` in the strict configurations, and `st_atime` is a member there instead of an undeclared name. The member names were settled by compiling against the reference's headers, not read from them. (3) The reserved names `_STRUCT_TIMESPEC`, `_SIGSET_NWORDS` and the typedefs `__off_t`, `__ino64_t`, `__pid_t` in the strict configurations of three headers stay undefined: one differences row, no compatibility option (C 7.1.3: no conforming program may use them; ruling #6443). The remaining P3 rows are the `_chk` redirections of `_FORTIFY_SOURCE` for `open`, `openat`, `open64`, `openat64`, `poll`, `ppoll`, which slice 18 owns; they and the other accepted rows are listed in `handoff/SL-HEADERS-S07/p2p3-accepted.txt`.
'''
