body = '''
**Slice 16 headers (ELF, dynamic linking, debugging): generator sources and scope** (SL-HEADERS-S16 to S16-3; plan/headers.md slice 16; rulings #6423, #6424, #6472). (1) `<gnu/lib-names.h>`: one `<STEM>_SO` string macro per library `versions.tsv` and `empty-versions.tsv` name (marker `@@sonames`, `xtask/src/headers/slices/s16.rs`). (2) `<sys/platform/x86.h>`: `CPU_FEATURE_PRESENT` and `CPU_FEATURE_ACTIVE` expand to per-name macros generated from `spec/abi/x86-features.tsv` (marker `@@x86features`): index, register and bit come from the Intel SDM Vol. 2A CPUID tables (five AMD-only bits from AMD APM Vol. 3 App. E, the source named per row) and the table is the intersection with the names a black-box probe of the reference accepts; the index of each name and `struct cpuid_feature` (size 32, `cpuid_array` at 0, `active_array` at 16) are probed. `CPU_FEATURE_ACTIVE(SHSTK)` and `(IBT)` are false for every structure. (3) `<sys/elf.h>` is an `#error` header: the reference rejects it in every configuration probed (every language level, every feature-test level, `-m32`), so the row `p1` reject of `headers/slices/s16.tsv` makes `header_check.py` require that it does not compile. (4) The `la_*` audit entry points of `<link.h>` are declared for the author of an audit library (rtld-audit(7)) and need no export. (5) `La_x86_64_regs` and `La_x86_64_retval` are declared in C++ too, because the C++ spelling of the `la_*` prototypes names them (ruling #6472): `visibility.tsv` lists them for every configuration but `time64only`, an accepted difference in `docs/differences-from-glibc.md`. (6) `<sys/profil.h>`: until `<sys/time.h>` (slice 7) is generated, P1 covers only `struct prof` (`spec/tools/header_checks/s16.py`). (7) Anonymous aggregates and enumerations, structure typedefs and typedefs that only `layouts.tsv` describes (`La_x86_64_xmm`) as members are emitted by `members_nested` of the generator.
'''
