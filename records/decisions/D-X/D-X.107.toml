body = '''
**Liella's own C header set** (SL-HEADERS-PLAN, plan/headers.md; owner ruling R4 of 2026-11-14; rulings R-H0 to R-H7 answered by the owner on 2026-11-14). Principle (owner, 2026-11-14): Liella is ABI compatible with glibc for programs already built; source compatibility is best effort, so a program built against Liella may need a small source change, and a small source change (an Aqours patch or an upstream fix) is preferred to imitating glibc further; Liella does not identify as glibc so deeply that source cannot tell the difference, and `__LIELLA__` is always defined. Generation: `cargo xtask headers-gen [--check]` writes the headers from the `spec/abi` tables (Appendix C, extended by R-H0 with API facts read only through the compiler: visibility per feature-test configuration, typedef and tag linkage, macro types and values, call-site symbols, noexcept) and Liella-written templates taken from C, POSIX, the man pages, the kernel UAPI and the GNU C Library manual; no glibc header text is used, and the internal split is Liella's own (`__liella/`), not `bits/`. Identity (R-H1): `__GLIBC__`, `__GLIBC_MINOR__` (39), `__GNU_LIBRARY__` and `__GLIBC_PREREQ` are defined, and so is `__LIELLA__`. glibc-internal names (R-H2, R-H3): only those that external headers and programs test (the kernel's `libc-compat.h` keys, and what the SL-HEADERS-1 scan finds), with Liella-written definitions; a later build failure is fixed by a source change first. FILE is complete (R-H4); no libmvec `simd` declarations until libmvec exists (R-H5); no Aqours package is built before fortify lands (R-H6). Legacy headers (R-H7): one is shipped only when a package on the project mirror includes it or it has a live purpose (`thread_db.h`, `proc_service.h` for debuggers); each dropped one gets a differences row and a registered compat flag that restores it. Proof: a Liella-compiled object references the same symbols as one built against the reference headers with the same flags (the ABI of what is built), and layouts, constants, the C++ linkage spellings and noexcept are identical; visibility per configuration matches except where a differences row says otherwise. Kernel UAPI coexistence follows `linux/libc-compat.h`. The work lands as SL-HEADERS-1..20.
'''
