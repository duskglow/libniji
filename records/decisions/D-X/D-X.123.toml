body = '''
**ld.so start-up text from a trace of its own build** (LAYOUT-LDSO-ORDER, LAYOUT-LDSO-ORDER-2). `cargo xtask so` links the interpreter ungrouped, runs two dynamic programs of the same build under `tools/hottext/ldso_trace.sh` (gdb, the tracer's virtual CPU, clock and NUMA answers: `true`, libc only, and `libs3`, three trivial libraries by RUNPATH), and writes `ldso-text.list` (the `true` mode's functions in first-touch order, then what `libs3` adds) and `ldso-text.signatures` next to libc's lists. The one grouping pass (`group_ldso`, the same renames as libc's) puts the listed functions first in `.text` from the entry, in list order; every other function, `#[cold]` ones included, follows. A slowed trace and a single-node trace must equal the plain one (TRACE-TIME-PIN, TRACE-NUMA-PIN). No window bins for the interpreter: the kernel maps it at a page-aligned base below the previous mapping, so the phase of the 64 KiB fault-around windows inside the image depends on the image's size, and a bin start inside the image is not a window start. Measured (Zen 1 build host, fast products, base next 627ef49ca, dynamic program with N trivial libraries, 21 runs each, all paths of one length): page faults with ASLR off 81 -> 78 (N=0), 97 -> 95 (N=3), 133 -> 131 (N=12), every run the same; with ASLR on the medians 82 -> 79, 97 -> 95, 134 -> 131. The per-page split (perf page-fault addresses, N=0): ld.so text 5 -> 2 faults; data and anonymous pages unchanged. Instructions:u: N=3 and N=12 equal within 3; N=0 +347 of 9.04 M (0.004%, deterministic). This is a measured cost, accepted against the -3 faults. The two interpreters have identical section addresses apart from `.text` (226 bytes shorter when grouped), and libc.so.6 is identical, so only code placement differs. The cause was not found. Determinism: the lists, signatures, libc's bins and both binaries are byte-identical when built on a Zen 1 and a Skylake-SP host. Not achieved: a 46 KiB `#[cold]` function added to ld.so still adds faults (N=0: +4 on the base and +4 here). The page split shows +1 ld.so text (the grouped text, about 80 KiB, crosses one more window when the base's phase moves), +1 ld.so RW page and +2 anonymous pages. This record does not claim that the fault count is insensitive to unrelated ld.so growth. Making the window phase independent of the image size, and ld.so's data and bss pages, belong to the follow-up story LAYOUT-LDSO-WINDOW.
'''
