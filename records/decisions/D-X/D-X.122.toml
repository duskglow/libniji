tests = ["xtask/src/copies.rs::test_and_binop_got_operands_become_relaxable_and_nothing_else", "crates/core/tests/hot_text_products.rs::init_startup_data_pages_hold_at_every_data_phase"]
body = '''
**Start-up reads no GOT entry: test and binop GOT operands are relaxable** (STARTUP-GOT-PAGE; amends D-X.101 and D-X.15). D-X.101 fixed the pages of the written start-up data (the relro cluster, `heap::RESERVE_MEM`, `global_locale::SLOTS`) but not of `.got`: start-up read six GOT entries through `add` and `cmp` operands (`locale::refresh_words`, `stdio::parts_first_use`), whose plain `R_X86_64_GOTPCREL` (stable rustc emits no relaxable type) the linker keeps, so the page of `.got` counted among the written start-up pages and moved with the length of relro ahead of it: on LOCALE-SLOTS-GROWTH-5's merged head relro was 400 bytes shorter, the six entries spanned two pages and STARTUP-DATA-WINDOWS read 8 > 7 on a branch that does not touch that code. Decision: D-X.15's step 3 (`xtask/src/copies.rs`) also marks the 64-bit `test` and binary operations with a GOT entry as their source operand (`REX.W`, then `85`, `03`, `0b`, `13`, `1b`, `23`, `2b`, `33` or `3b`, RIP-relative ModRM) `R_X86_64_REX_GOTPCRELX`, the type the x86-64 psABI gives these forms (the relocation C compilers emit for them). A static non-PIE link then rewrites each into the same operation on an immediate, so no GOT entry is read and `.got`'s place no longer matters; in a PIE or `libc.so.6` the linker keeps the GOT read, and it keeps the GOT for a symbol a program may interpose, so binding is unchanged. The 32-bit forms and a GOT entry as a destination are left as they are (counted); step 1 (the internal copies) still redirects only calls and call-target loads, never an address used in arithmetic or a comparison. Chosen over aligning `.got` to a page (up to 4095 bytes of relro padding, and `.got` still one written start-up page) because it removes the page and a memory read per use instead of pinning them, at no byte cost. Measured (fast products, Zen 1 host, base origin/next 923df67e9): `cargo xtask so` leaves 0 GOT uses unrecognised (160 before: 147 `add`, 13 `cmp`) and the static probe has no `.got` at all (0xc8 bytes before; probe data 224 bytes smaller); STARTUP-DATA-WINDOWS 7 = 7 written pages (the page that held `.got` also holds start-up relro data); probe `page_faults` with ASLR off, user page faults / instructions, base -> change: `true` 82 -> 81 / 230332 -> 230331, `tool` 108 -> 108 / 286446 -> 286344, `fork` 98 -> 98 / 230873 -> 230867. Checked by `test_and_binop_got_operands_become_relaxable_and_nothing_else` (xtask) and `init_startup_data_pages_hold_at_every_data_phase` (hot_text_products: relro pads of 0x10-0x1000 bytes behind the cluster move `.got`; the hot text reads no `.got` entry and the written relro pages hold in number).
'''
