body = '''
**`.got` starts on a page** (STARTUP-GOT-PAGE, ruling #6606 option C; amends D-X.101). D-X.101 fixed the pages of the written start-up data (the relro cluster, `heap::RESERVE_MEM`, `global_locale::SLOTS`) but not of `.got`: start-up reads a few GOT entries through `add` and `cmp` operands (`locale::refresh_words`, `stdio::parts_first_use`), whose plain `R_X86_64_GOTPCREL` (stable rustc emits no relaxable type) the linker keeps, so the page of `.got` counts among the written start-up pages, and where it fell moved with the length of relro ahead of it: on LOCALE-SLOTS-GROWTH-5's merged head relro was 400 bytes shorter, the six start-up entries spanned two pages and STARTUP-DATA-WINDOWS read 8 > 7 on a branch that does not touch that code. Decision: the start file (`csys/src/machine/entry.S`, the first input of every link) has an empty `.got` input section aligned to 4096 bytes, so GNU ld starts the output `.got` on a page and its few hundred bytes (0xc8 in the static probe) never span two pages, whatever length of relro comes ahead. Cost: up to 4 KiB of relro padding (RELRO 0x7000 -> 0x8000 bytes release, 0xc000 -> 0xd000 fast, static probe). Rejected, measured in both profiles (Zen 1 host, base origin/next 923df67e9, static probe, ASLR off, relayed whole-process user page faults over 10 identical runs, the hot_text_products way): (A) marking 64-bit `test`/binop GOT operands `R_X86_64_REX_GOTPCRELX` so the static link turns them into immediates (no `.got` read at all, one fewer written start-up page) moved the program's first relro fault from start-up into the first call that reads relro: fast first `%.2f` 3 -> 4 over its bound 3 (`printf::render_simple` reads a trait-object vtable in `.data.rel.ro`); (B) that plus a deliberate start-up read of RELRO's first byte gave the window back to start-up but cost release `true` 10 -> 11 over its bound 10 (the one extra fault is the read, in programs that read no relro before they count). With this alignment every bound is at base in both profiles: release `true` 10, locale 42, tool 44, fork 5, first `%.2f` 3, STARTUP-DATA-WINDOWS 8; fast 11, 42, 43, 5, 3, 7; instructions:u (`perf stat -r 5`) `true` / `tool` / `fork` fast 239845 / 296519 / 240387 base and 239893 / 296479 / 240394 with it (spread about +-80). Its float protection is still placement: start-up's `.got` read shares the 64 KiB fault-around window with the relro vtable only while RELRO stays under 64 KiB. Checked by `init_startup_data_pages_hold_at_every_data_phase` (relro pads of 0x10-0x1000 bytes behind the cluster move `.got` against the page grid: `.got` starts on a page, the hot text's `.got` reads lie in one page and the written relro pages hold in number at every pad).
'''
