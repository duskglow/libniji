body = '''
**libc.so.6's start-up read-only group (`.rodata1`, D-X.62) comes first in its read-only data** (DYN-START-BISECT-1120, amends the placement of D-X.62 and D-X.133 in libc.so.6 only; static links keep the default script's order). GNU ld's default script places `.rodata1` after `.rodata`; the group's 64 KiB start alignment then left a gap of 0 to 64 KiB that moved with the text size, and once the gap spanned a page the linker began a second read-only `PT_LOAD` at the group. Snapshot 20.2 (3f2a84520) had the split (gap 62 KiB after the asan-main-thread merge grew the text by 0x900 bytes) and 20.1 did not (gap 2 KiB). 20.2 starts every dynamic program with +3,485 user instructions (execcount, ASLR off, median of 101; every first-parent merge before asan-main-thread counts as 20.1, and that merge's new start-up code costs 8 instructions); one read-only segment again measured, on the Zen 1 host against 20.2, -1,254 (empty main), +2,638 (three libraries), -1,190 (clock_gettime), faults unchanged: the split is part of the cost, not all of it (DYN-START-BISECT-1120 handoff; the branch was handed back DO NOT LAND). A linker-script fragment (`target/product/libc-rodata1.ld`, `INSERT BEFORE .rodata`, generated by `cargo xtask so`) puts the group first, so the alignment falls between the text's segment and the read-only one and `.rodata` follows the group with no gap at any text size. Both libc links (libc.so.6, the opt-in's libc-owner.so) take the fragment; `cargo xtask so` checks libc.so.6: one read-only `PT_LOAD` after the text, starting on the group's alignment (`ro_segment_errors`).
'''
