body = '''
**A per-fix gate runs a bounded set per train class, and a bounded run builds the products beside the xtask tests that run no products** (GATE-DEV-NO-FULL, owner 11-19: developers gate what their change affects, the CI train runs the FULL gate on the merged tree; coordinator rulings #6706 and #6707; tooling only, no ABI or behaviour change). The rules are in the module doc of `xtask/src/affected.rs` (`TrainClass::of`, `Selection::bounded`, `XTASK_TRAIN`); this record holds why. (1) In `--tier direct` and `--tier wide` a changed file whose rule escalates no longer runs FULL: its class selects a bounded set, plus `cargo xtask static` and every seconds-long FULL step (`precheck::CHEAP_STEPS`), and the plan prints `FULL: the train's (<file>: <reason>)`. `--tier full`, the train's gate, `--replay`, `--reverse` and `bench-rows` still see the escalation as FULL. The classes: - **Xtask** (`xtask/`): the xtask unit tests, the workspace clippy and the module's own command(s) and generator checks (`XTASK_TRAIN`: `so`, `hottext`, `coldbss`, `layout*`, `startup_ro` also run `layout-check` and the start-up layout tests on fresh products). Why: an xtask change most likely breaks the tool itself (its unit tests), the output the module produces (its command or generator check), or, for the image tools, the linked start-up image (the layout contracts and tests). A change in a generic module that another command calls is the FULL gate's to find. - **Image** (csys, `crates/abi`, `crates/libc-so`, `crates/libm-so`, `crates/native/link`, `.map`/`.ld`/`.lds`/`.version` lists, `scripts/`): the products build with the start-up layout tests, K5, the owning crate's own mapping and unit tests and the unit tests of its one-hop dependents. Why: these sit at the bottom of what the products link, so the first breakage is a products build that fails, a start-up layout or page bound that moves, the csys declarations falling out of step (K5), or the owning crate and its direct users; a behaviour change reaching every libc entry is the train's. - **Generated** (`spec/clauses.tsv`, `symbols.tsv`, `primitives.tsv`, `spec/abi/`, `spec/unicode/`, `include/`, `libc-include/`, `headers/`, math fits and coefficients, `*_gen.rs`, `tables.rs`, `builtin_items.rs`, non-Rust files under a crate's `src/`): the generator checks (cheap steps), the code that names the file (its readers) and, for a Rust source, the file's own mapping. Why: a generated file or its input most likely breaks by drifting from its generator (the `--check` steps catch it in seconds) or by changing what its direct readers see. - **Config** (`build.rs`, `Cargo.toml`, `Cargo.lock`, `rust-toolchain*`, `clippy.toml`, `.cargo/`): the workspace clippy and the changed crate's unit and test targets. Why: a manifest or build script change most likely breaks the build of its own crate or its lints; a dependency or toolchain change that reaches other crates is the train's. - **Unknown** (a path no rule knows): as Config. Why: nothing says what it reaches; clippy and the owning crate are the cheap check, the train's FULL gate the complete one. The train's FULL gate covers everything a bounded set leaves out (owner 11-19). GATE-DEV-NO-FULL's replay of 12 escalated gates estimated about 38% less host time than their FULL runs. (2) GATE-BOUNDED-PARALLEL: a bounded run is dominated by the products build and the xtask tests, which used to run one after the other. Neither needs the other, except the xtask targets that run built products (`xtask/tests/transcripts.rs` runs `target/niji/ldconfig` and `target/niji-test/iconv`; `names_products` marks them; the targets are listed from `xtask/tests` by cargo's rule, as the scan of the other crates' targets leaves xtask out). Next to a products build those would see a missing, stale or half-written product, and before it (the old order) they ran on the previous build's products. So a non-FULL run that selects both runs `cargo test -p xtask --bins` with every xtask target that runs no products beside `cargo xtask so`, then the targets that run products on the fresh products. The two share no cargo build directory (the products build under `target/product`, the tests under `target/debug`, whose lock cargo takes only while it builds); because `cargo xtask so` is `cargo run -p xtask -- so`, which would wait for that lock while the tests compile, the side-by-side products build runs the running xtask binary (`/proc/self/exe so`) directly. Side by side runs only when the memory limit (the smallest `memory.max` of the process's cgroup path, and `MemTotal`) holds `SIDE_BY_SIDE_BYTES`; otherwise the products build runs first and the same tests after it. Each step keeps its own console lines and log (`target/affected-xtask.log`, appended to `target/affected.log` when both end); any red step makes the run red, as before. Measured (Zen 1 host, 60 vCPU, each run in a 4-core slot of the shared queue, cold products, warm xtask test build; `layout-ldso-order-3-gate`'s file list, direct tier): one after the other the xtask tests took 190.2 s and the products build 1,275.2 s (1,465.4 s); side by side the products build took 1,404.8 s with the tests (280.3 s) inside it, and the targets that run products 1.3 s after it: 60 s (4.1%) less for the two steps, because the two share the slot's 4 cores. Peak `anon` of the gate's cgroup: 0.47 GiB (tests) and 1.85 GiB (products) apart, 2.27 GiB side by side, so `SIDE_BY_SIDE_BYTES` is 6 GiB. A run whose xtask tests must also compile (an xtask change) overlaps that compile too (not measured).
'''
