tests = ["xtask/src/binbudget.rs::a_mode_over_budget_names_its_bins_members_and_growth", "xtask/src/binbudget.rs::modes_count_their_windows_less_their_warm_up", "xtask/src/binbudget.rs::bytes_over_a_bin_or_data_budget_are_red", "xtask/src/binbudget.rs::a_level_under_budget_an_unbudgeted_mode_and_a_misplaced_bin_are_red"]
body = '''
**The per-story start-up layout gate is the link map's bytes and windows; runtime fault counts are a release metric** (LAYOUT-BYTE-BUDGETS-2, owner ruling R2 of `plan/layout-budget-rethink.md`, after the window bins of D-X.103/D-X.108/D-X.111). Contract `WINDOW-BIN-BYTES` (kind `window-bin-bytes`, `xtask/src/binbudget.rs`), checked by `cargo xtask layout-check` after every `cargo xtask so`, reads the link map of the static probe `page_faults.c` (linked as `hot_text_products` links it) and the build's `hot-text.signatures`; no program runs. (1) Each window bin is measured from its first member to its last: a bin after the head bin starts on a 64 KiB boundary, the head bin at most `head-room` (1,024) bytes into its window, and each fits its budget (64 KiB, the head bin less its room); one line per bin prints bytes, budget and headroom on every build. Because the planner re-plans each build and fills a bin only to capacity, growth does not overflow a bin: it moves a group into another bin, so (2) each `page_faults` mode's windows (those its bin members span, less those its warm-up `<mode>.pre` spans) must equal its per-profile budget: over is red, naming per window the bin, bytes, budget, headroom, the largest members the mode runs and, with `NIJI_LAYOUT_BASE_BINS` set to next's `layout-bins.tsv`, the members new or grown in bytes; under is red too (tighten the budget: ALWAYS FORWARD). (3) The start-up data clusters: `.rodata1` within one window of its window start, `.data1` within its page count from its page start. The whole-process fault bounds of `crates/core/tests/hot_text_products.rs` (static and dynamic start-up, locale, tool, localtime, localtime + mktime, float, fork) print a `FAULT-COUNT` report and fail only with `NIJI_FAULT_BOUNDS=enforce` (the release ratchet); their constants are unchanged. Rejected: a byte bound per bin alone (cannot fail under a re-planning planner, challenge #6857 agreed by the coordinator); diffing against the base on a pass (the verdict cache would serve a stale diff).
'''
