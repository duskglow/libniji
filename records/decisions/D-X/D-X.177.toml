story = "PLANTS-PRODUCTS-ONCE"
date = "2026-11-26"
tests = ["xtask/src/plants.rs::which_files_may_change_the_products", "xtask/src/plants.rs::what_each_plant_needs_from_the_products", "xtask/src/plants.rs::a_products_command_gets_the_products_rebuilt_with_the_mutant", "xtask/src/plants.rs::ordinary_plants_build_ungrouped_and_layout_plants_traced", "xtask/src/plants.rs::the_products_are_built_in_as_few_copies_as_possible", "xtask/src/plants.rs::simple_commands_split_a_list_and_refuse_other_syntax", "xtask/src/plants.rs::header_checks_read_no_products", "xtask/src/plants.rs::unit_tests_read_the_products_by_the_unit_rule", "xtask/src/affected.rs::unit_tests_may_read_products_follows_the_unit_rule"]
body = '''
**`cargo xtask plants` builds the products only in the copies whose plants read them, and a plant shares a build only when its file cannot change what the products are built from** (PLANTS-PRODUCTS-ONCE; tooling only, no ABI or behaviour change). The rules are in `docs/plants.md` ("Which copies build the products") and `xtask/src/plants.rs` (`needs`, `assign`, `cmd_reads_products`, `may_change_products`); this record holds why. Cause (plants logs of 11-24..26 on three build hosts, 155 jobs, 80.6 h of wall): 75 % of the wall was product builds on a job's critical path, and 21 % of the jobs ran no plant that read the products (6.8 h of their 9.5 h), because a plant was judged to need the products whenever its test text named them, and every copy built them. A plant reads the products when its command may use them, decided from what the command runs (its simple commands; `sh -c` and `bash -c` are split and read; a header check reads none unless an argument names a products path; a unit-test run by the unit rule of `affected`, libtest filters matched over the whole test path), and anything not understood counts as reading (when in doubt, build). A plant whose command uses the products by the rule the tool already had (`plants_use_products`) or measures the layout, and whose file may change them (`may_change_products`: anything but a crate's `tests/`, `benches/` or `examples/` and `xtask/tests/`), gets the products rebuilt with its mutant; after it, the next reader gets them rebuilt unmutated, so no plant sees another plant's mutant (plant `ppo-mutant-shared` checks this). Copies: mutant builders are dealt in turn, plain readers join building copies (one when none rebuilds), plants that read nothing fill the copies that build nothing; a copy without readers builds nothing, and a command that does need the products fails its baseline there. Measured on a Zen 1 host (48 CPUs), `--copies 2`, before (the base tool) and after started together, each verdict the same per plant: AFFECTED-LAYOUT-ROWS (xtask only, 7 plants) 624.5 s before, 204.4 s after (CPU 2,786 s to 895 s); HEADERS-STAGE2-GAPS-D (header, 20 plants) 1,871.7 s before, 416.0 s after (CPU 5,880 s to 1,686 s; no plant reads the products); LIBM-PARTIAL-WRITE-CHECK (libm, 6 plants, all reading the products by the unit rule) 1,012.6 s before, 1,050.5 s after (+3.7 % wall, CPU 3,641 s to 2,779 s): one copy builds and runs all six while the other idles, the cost of building once without copying products between copies. Not done: sharing one build across copies by copying the built products (would keep the wall of the all-readers case).
'''
