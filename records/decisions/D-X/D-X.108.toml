body = '''
**Window bins, slice 1: signatures and the plan, not applied** (LAYOUT-WINDOW-BINS-2; implements part of D-X.103). `tools/hottext/regen.sh` writes `hot-text.signatures` with every trace-at-build list: each listed key with the sorted `page_faults` modes whose trace runs it (`true`, the modes it traces, probe_text.sh's; a label inside another key's section counts for that section too; `-` for none). `cargo xtask so` plans the bins from it (`xtask/src/bins.rs`) and writes `target/product/<profile>/layout-bins.tsv` plus a summary; section names and alignments are unchanged. Planner (deterministic): signature groups from the widest signature down (ties: first list position); each group goes whole into the existing bin it adds the fewest modes to, else into fresh bins, split only where a bin is full (64 KiB, member alignment included); bins no counted mode touches come last and take no fillers; each other gap is filled best-fit (largest first) from cold function sections of the members holding a start-up section. Cost = sum over modes of windows touched; the summary prints it per mode against a lower bound (the mode's bytes over 64 KiB, rounded up). Measured on a Zen 1 build host (next f53c74611 plus this change, before the no-filler rule for uncounted bins): fast 9 bins, sum 26 against bound 19; release 10 bins, sum 27 against bound 20; residual fill 60 / 48 bytes in total. An exhaustive search over the bins' mode sets (a scratch prototype with a constructive pack) found no plan at cost 19-25 for fast (the pack is a heuristic, so this is evidence, not proof): the per-mode bound is loose because the start-up group alone nearly fills the head bin, and the greedy plan is at or near what this formulation reaches. `so` refuses signatures in which the start-up mode runs no grouped key (a trace that recorded no modes).
'''
