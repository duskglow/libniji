tests = ["xtask/src/startpair.rs::read_only_loads_counts_only_after_the_text", "xtask/src/startpair.rs::matching_pad_is_the_smallest_pad_with_equal_counts", "xtask/src/startpair.rs::a_flip_alone_passes_and_a_real_cost_at_the_matched_layout_fails"]
body = '''
**A static start-up row whose base and head differ in read-only PT_LOAD count is judged at a text pad where they agree** (STATIC-LAYOUT-FLIP, owner ruling #7061: static programs keep the user's default linker layout, option d; D-X.143). A static program's read-only data after the text is one PT_LOAD or two by the text's size (D-X.143: static `cbench_startup` split at 7 of 8 text pads), and each extra segment costs every start one more kernel mapping (about 7.5k kernel instructions, HEAP-ADDRESS-SPACE-9: next + 4 KiB pad reproduced its +7.5k, head + pad removed it). `cargo xtask startup-pair --base <tree> [--head <tree>] [--runs N] [--rows a,b]` (`xtask/src/startpair.rs`) links `cbench_startup` of both trees with the command line of `cargo xtask bench`'s libniji build, counts the read-only (`R`) PT_LOADs after the last executable one (`readelf -lW`), and when the counts differ links both again with the smallest text pad that makes them agree: a never-run `.text` object of k pages (filled with `int3`) right after the start object, k = 1..16 (a full turn of the 64 KiB start-up group bound), in `target/niji/bench/pair/` only, never in a product. It prints `LAYOUT-FLIP base N head M: judged at text pad P`, measures the unpadded pair (reported) and the padded pair (judged), each interleaved over `--runs` rounds (default 5, the order alternating per round) with `CBENCH_COUNTERS=1`, and exits 1 on a WORSE judged row. Verdict (local, testable): a user-mode row (`startup_instr_*`, deterministic) is WORSE when the head's median is above the base's maximum (the rule DL-LIBC-EARLY-6 used); `startup_kinstr_c` (user and kernel mode) when the head's median is above the base's maximum by more than 1% of the base's median (`KERNEL_SLACK`; kernel counts moved by up to about 1% between runs of one build there). Equal counts: the unpadded pair is judged, nothing else changes. No pad found in range: an error naming both counts, never a mismatched pair. Dynamic rows are never padded (libc.so.6 has one read-only segment at every text size, D-X.143; ordinary ratchet). Not covered: the per-train instruction-limit check (`bench/instr_limits.tsv`) compares one tree against fixed limits and has no base to pair with; the workload counts (`validation/wl_count.sh`) bind the dynamic kit (D-X.141). No spec clause (bench tooling).
'''
