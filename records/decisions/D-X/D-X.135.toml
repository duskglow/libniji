story = "PASS2-NATIVE-RUNNER"
date = "2026-11-20"
body = '''
**The gate's second test pass runs the first pass's test binaries as libniji processes; a small interposed suite keeps the foreign path covered (coordinator ruling #6820).** `cargo xtask test` and the second pass of `cargo xtask affected --run` no longer build the workspace again with `niji-boundary/export`: they copy each test binary of the first build with its `PT_INTERP` rewritten to a loader compiled with the per-tree installation prefix `/tmp/niji2-<8 hex of the tree path>` (short enough for the 28-byte field of the host interpreter's path), whose `lib/` links `target/niji/*.so*` and the toolchain's `libgcc_s.so.1`, and run them through a cargo target runner (a copy of xtask, `pass2-exec`) that executes the copy and refuses one that is missing, older than its binary or made from another build of it (the binary's length and modification time recorded at copy time). The copies keep their file names one directory over at the same depth (`target/debug/niji-deps/`), so tests that re-execute or name `current_exe()` see the same shape. The loader builds in its own cargo target directory (`target/product/ld-native`), never shared with another step (finding #6821). The second pass keeps the first-pass-only and shard-0 filters (`nextest::PASS0_ONLY`, `PASS1_SHARD0`) and runs binaries without niji-boundary code once, as the interposed pass did. The interposed suite (`nextest::interposed`) is niji-boundary's unit tests, doctests and test targets and niji's `_clauses` targets, but those in `nextest::NATIVE_ONLY`: the targets whose source checks no `feature = "export"` and whose `export` binary links none of the C-family forwarders (`niji_caller_*`, `caller_alloc.rs`: with `export` its `reallocarray` goes by symbol and its blocks come from the poisoned test heap in the binary). A new niji-boundary target joins the suite until shown otherwise. The foreign `malloc`/`free` pair has a per-pair instruction bound (crates/boundary/tests/heap_foreign_pair_cost.rs). Tests: xtask `pass2::tests` (the patcher, its refusals, the root, the copy path, the runner's refusals, the listing), `nextest::tests::the_interposed_suite_keeps_every_target_that_checks_the_export_feature`; plants in docs/plants.md (`pass2-*`). Measurements and the per-target list: handoff/PASS2-NATIVE-RUNNER.md.
'''
