id = "D-X.156"
section = "x"
status = "active"
story = "INTERNAL-ALLOC-ROUTING"
date = "2026-11-22"
tests = ["conformance/c/x_internal_alloc.c", "conformance/c/x_self_bind_stdio.c"]
body = '''
**When a program, an `LD_PRELOAD` library or a tool replaces the malloc family, libniji's own allocations go through the replacement (story INTERNAL-ALLOC-ROUTING, ruling #7583; GNU C Library manual, "Replacing malloc").** `early_init` (libniji's `ld.so` calls it after relocation, before any constructor and before the library's first allocation) asks once whether `malloc`, `calloc`, `realloc` or `free`, as libc.so.6's own GOT resolves them, lies outside libc.so.6's image (`caller_alloc::family_replaced`). If so, every later allocation of the library's own at most 16-byte aligned (Rust's global allocator in the product, `heap::Niji`) is a `malloc`/`calloc`/`realloc` call through the symbol, and its release a `free` call (`caller_alloc::ROUTE`, decided once and never changed; the decision costs no instruction on the allocation fast path but one load and a not-taken branch). The heap holds nothing of the library's at that point, so a release needs no lookup; if it ever did (`ROUTED_CHECKED`), a release asks the heap whose block it is first. A failing replacement makes the call that needed the memory report its failure (the library's collections are fallible: `ENOMEM`, `NULL`, `(iconv_t)-1`, ...); the 64 KiB reserve stands in for libniji's own heap only and is not used for a replacement's refusal. The built-in locale's name is a literal, so `setlocale(cat, NULL)` in the default locale never allocates and never fails. Kept private, each with its reason (docs/differences-from-glibc.md): the loader's data (`ld.so` keeps no heap: its object tables are its own mappings, read lock-free by `dl_iterate_phdr` and `_dl_find_object`, so `dlopen` makes no call to the replacement), blocks aligned above 16 bytes (the manual requires only `malloc`, `free`, `calloc` and `realloc` of a replacement), and a static program (its image includes the replacement, so the test answers no). `iconv_open` and `pthread_create` allocate nothing from a heap in libniji: with the route on, the probe sees no call there. `closedir` keeps up to a few directory buffers as spares for the next `opendir` instead of freeing them. Probe (black box, the `mint` program of RELEASE-SNAPSHOT-1122A on the Zen 1 host, calls the replacement sees, reference on the host / libniji before (RELEASE-SNAPSHOT-1122A's run: none in each) / after): qsort of 200,000 ints 1 / 1, opendir 1 / 3, setlocale 225 / 4, iconv_open 17 / 0, pthread_create 1 / 0, dlopen 13 / 0.
'''
