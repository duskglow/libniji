body = '''
**The workload count runs every measured program in one fixed environment, and the held levels are re-recorded from honest counts in it; a level must equal its own counts' ratio, and a raise is accepted only as a cited correction** (WL-LEVELS-RERECORD, 2026-11-21; tooling and recorded levels only, no product code; amends D-X.151). Why: owner ruling 2026-11-21 ("accurate results are more important in all cases. We still want parity if possible, but not by lying"); the levels recorded on 189ab9cbc carried glibc page-fault numbers inflated by ASLR and by the caller's environment (D-X.151: about one fault per process per environment-size step), e.g. sed-s glibc 251 where glibc measures 212. (1) `validation/wl_stats.sh`: `WL_RUN_ENV='HOME=/ PATH=/usr/bin:/bin LANG=en_US.UTF-8 LC_CTYPE=C.UTF-8'`; `wl_run_prefix` is `env -i $WL_RUN_ENV setarch -R`, so the measured program's environment no longer depends on the caller (the LANG and LC_CTYPE values are the ones every earlier count inherited); rows of this method are cached as `.r.tsv`. Test: `validation/wl_stats_test.sh` (two callers with different environments give the same environment). (2) `validation/wl_verdict.py holds`: a row's `level` must equal ceil4(libniji / glibc) of the row (a level edited without its counts is refused); a level above the base's is accepted only when its cause names `correction D-X.<n>`, its `recorded` differs from the base's and its libniji count is not above the base's (glibc's number fell; libniji did not get worse). Tests: `validation/wl_verdict_test.sh`. (3) Evidence: 5 counts of next 0299fd6e1 (`wl_count --base 0299fd6e1 --rev 0299fd6e1`, COUNT_FRESH=1, so libniji new and base and glibc are all measured fresh) per CPU class, jobs `wl-levels-rerecord-k1..k5` (Zen 1 host, 60 vCPU) and `wl-levels-rerecord-m1..m5` (Skylake-SP host). Every single-process page-fault row gave one number in all 10 libniji columns and all 5 glibc columns on both classes; pipelines vary: cut-tr-uniq 584..585 (Zen 1), tar-c 465..476 / glibc 389..400 (Skylake-SP), and tar-gz (Zen 1, a 4 s two-process pipeline) 629..647 in 8 columns, with every run of 2 columns 110+ faults higher (758, 765: the positive excursions of D-X.151). Recorded: libniji = highest of the libniji columns (tar-gz: of the 8), glibc = lowest glibc column, level = ceil4 of the ratio; printf-loop (25 minutes a count) from k1 and k2. Zen 1 levels, old (glibc / libniji) -> new (glibc / libniji): ls-l-enUS 1.3069 (3129/4089) -> 1.2700 (3112/3952); md5sum 1.2449 (147/183) -> 1.2308 (143/176); cut-tr-uniq 1.2609 (483/609) -> 1.2290 (476/585); seq 1.2353 (136/168) -> 1.2106 (133/161); printf-loop instr 3.6309 (5680323909/20624302882) -> 3.6789 (5203469249/19142789292), correction; printf-loop pf 1.3732 (1482360/2035438) -> 1.3610 (1440309/1960175); ls-lR 1.2253 (3148/3857) -> 1.1916 (3132/3732); du 1.1956 (3360/4017) -> 1.1891 (3332/3962); sed-s 1.2112 (251/304) -> 1.2972 (212/275), correction; sed-utf8 1.2457 (228/284) -> 1.2233 (224/274); bash-loop 1.5205 (196/298) -> 1.3164 (196/258); grep-F 1.1659 (428/499) -> 1.1456 (419/480); grep-E 1.1875 (432/513) -> 1.1546 (427/493); grep-i-utf8 1.1360 (456/518) -> 1.1209 (447/501); gawk-sum 1.1993 (251/301) -> 1.2173 (244/297), correction; gawk-regex 1.2311 (251/309) -> 1.2358 (246/304), correction; gawk-utf8 1.1711 (304/356) -> 1.1718 (297/348), correction; gawk-printf 1.2009 (249/299) -> 1.2200 (241/294), correction; tar-c 1.2108 (408/494) -> 1.1946 (401/479); tar-tv 1.2256 (235/288) -> 1.2131 (230/279); gzip-d 1.1907 (215/256) -> 1.1699 (212/248); pipe-mix 1.1778 (1131/1332) -> 1.1511 (1119/1288); tar-gz 1.2204 (531/648) -> 1.2371 (523/647), correction. The 7 raises are CORRECTIONS under the owner's ruling, not loosenings: in each the stored glibc number does not reproduce (it fell by 5 to 39 faults, printf-loop by 477 million instructions) and libniji's count is lower than the one recorded before; the other 16 tighten. No row measures at or under 1.10. With these levels 4 of the 5 Zen 1 counts pass every row; the fifth fails only tar-gz (758, an excursion), so tar-gz can still fail a count until long pipelines are measured without excursions. Skylake-SP has no recorded levels (its rows report HELD-UNRECORDED); none were added here. Plants: `handoff/WL-LEVELS-RERECORD-plants.txt`.
'''
