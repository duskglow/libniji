story = "BUILD-REPRODUCIBLE-PATHS"
date = "2026-11-23"
tests = ["xtask/src/remap.rs::c_debug_info_is_the_same_in_two_tree_paths", "xtask/src/remap.rs::check_dir_names_the_product_that_carries_a_path", "xtask/src/bench.rs::count_spread_fails_a_limited_row_that_moves_beyond_its_tolerance"]
body = '''
**The products are byte-identical whatever directory builds them, and the bench's counted runs repeat exactly** (BUILD-REPRODUCIBLE-PATHS, 2026-11-23; tooling only, no library code; rulings #7549 and #7550). (1) **Every spelling of the tree root is mapped to `/niji`.** The C compiler records the logical working directory (`$PWD`, which keeps a symlink in the path) as `DW_AT_comp_dir`, not the canonical root, so 19 utilities and small libraries and the `.hot-lists` file carried the build directory, and one commit built in two role directories gave different bytes. `align::root_spellings` lists the root as given, canonical and as the logical `$PWD` ancestor; the C compiles get `-ffile-prefix-map=<spelling>=/niji` for each (`so::debug_prefix_flags`), the Rust builds keep `--remap-path-prefix`, `.hot-lists` names the tree relatively, and `remap::check_dir` scans every top-level product file, not only the libraries, for every spelling, `$CARGO_HOME` and `$HOME` (the `so` contract `PRODUCT-PATH-REMAP`). **Measured:** the release products of one commit built in a symlinked role directory and in a plain directory on the Skylake-SP build host, and in a third directory on the Zen 1 build host: the three `.products-manifest` files are identical (1339 lines, one sha256), and a scan of every product file for the home path and both root spellings finds nothing. The debug info stays usable: gdb backtraces from a comparator through libc's `qsort` give file and line for each libniji frame, the compile directory reads `/niji/crates`, and `set substitute-path /niji <tree>` finds the sources (as a libc6-dbg user maps the source package). (2) **The counted bench runs execute with address randomisation off, and the user-only instructions event is pinned.** Two causes of counts moving between runs of one build: the user-instructions event was outside the pinned counter group, so the kernel multiplexed it (one row read 0.001 to 110 per call); and with randomisation on, some rows take a path that depends on where the stack or a mapping landed (`strstr_hit_64` and `strstr_miss_64`, both gated, 71 or 135 user instructions per call; `strcasestr_hit_64` 3.7 %), all exact with randomisation off. `bench/c/cbench_counters.h` pins the event in the group and, when `CBENCH_COUNTERS` is set, sets `ADDR_NO_RANDOMIZE` and re-executes the program once. What is left is the kernel's share of the user+kernel count (interrupts while the row runs): 0.1 to 0.3 instructions per call on most rows; beyond max(2, 2 %) only on ungated rows (`memcpy_64k` 7.3 %, `memset_64k` 2.7 %, `gettext_language_steady` 14.6 % and `gettext_language_alternating` 4.2 % user, which depend on the catalog cache's state, and the threaded `re_mt4_*` rows). (3) **`COUNT-SPREAD`:** `cargo xtask bench --count-runs N` (default 3) sets the counted runs per side, and a row with an instruction limit (`bench/instr_limits.tsv`) whose libniji count moves over them by more than the limits' tolerance, max(2 instructions, 2 % of its lowest count), fails the run, so a limit never passes or fails by chance. The repeat test is a run with `--count-runs 10` over the gated benches.
'''
