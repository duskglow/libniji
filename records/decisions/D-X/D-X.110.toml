tests = ["crates/core/tests/deb_symbols_products.rs::every_version_node_has_a_dependency_rule"]
body = '''
**Every Liella-only version node `LIELLA_<KIND>_<n>` gets the same dependency rule in libc6's symbols file, through one table of kinds; any other node stops the package build (SL-SYMBOLS-NODES; plan/system-libc.md section 3.2).** tools/deb/symbols.py's `KINDS` maps each kind to a virtual package and to where its exports are specified: NATIVE -> liella-native-abi (exactly the functions of spec/abi/native.tsv), OWNER -> liella-owner-abi (D-27.29's opted-in registrations; the product build checks the names, here each must be a non-default version in libc.so.6). Each symbol at such a node names the alternative template `\| <package> (>= <n>)`, so a program that needs the node depends on a package only Liella's libc6 provides; libc6 Provides each package at the newest level the libraries define (`symbols.py files --provides`, read by tools/deb/system.sh). One rule plus a table rather than OWNER written beside NATIVE: the two kinds behave the same for dpkg (a program using either runs only on Liella), a new kind is one table row, and the levels stay per kind (a separate virtual package each, so LIELLA_OWNER_2 never reads as LIELLA_NATIVE_2). An unknown node, LIELLA_<KIND>_<n> of an unlisted kind included, is a hard error naming the node and where its rule goes: shipping a node with no rule would give programs a dependency that does not say they need Liella. LIELLA_PRIVATE keeps its `(symver)` pattern. The gap that let LIELLA_OWNER_1 land without a rule is closed by `tools/deb/build.sh --symbols-only` (stops after libc6's symbols, shlibs and control: about 1 s) run on the gate's products by crates/core/tests/deb_symbols_products.rs, which `cargo xtask affected` selects for any change to tools/deb/ (the test names the paths) and for every change that escalates to the full tier (the version script in xtask/src/so.rs, spec/abi, csys). Checked by tools/deb/check-symbols.sh (general template rule, Provides list, `dpkg-gensymbols -c4`, dpkg-shlibdeps on smoke/sym-owner.c: `libc6 (>= 2.34), liella-owner-abi (>= 1)`).
'''
