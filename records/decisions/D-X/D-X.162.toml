tests = ["xtask/src/bins.rs::a_head_bin_split_costs_no_phase_a_fault_whatever_is_inlined", "xtask/src/bins.rs::a_section_a_measured_phase_counts_prefers_a_later_bin_on_a_tie", "xtask/src/bins.rs::a_measured_phase_shares_its_warm_up_windows"]
body = '''
**The head window bin links the sections measured phases count ahead of the last member every warm-up runs, so no split of the head bin costs a measured phase a fault, whichever function sorts last** (LAYOUT-HEAD-BIN-TAIL, 2026-11-23; build tooling, `xtask/src/bins.rs` `head_order`). The head bin is the one bin not on a 64 KiB boundary (D-X.103, `HEAD_ANCHOR`): with more than `HEAD_ROOM` ahead of the group its suffix lies in a second window. In list order (first touch) the measured phases' own sections sort last, so a phase stayed at 0 faults only while some warm-up function happened to sort after them: on next's release head bin, `resolve_fold_slow` (counted by the strings phase) was covered only by printf's `pair_s`; with `pair_s` removed from the plan (as inlining does, PRINTF-NO-HEAP-3) the strings phase took 1 fault at 60 of 4096 text pads (16-byte steps, a scratch evaluator re-planning the build's `layout-bins.tsv`), and the fast plan already gave `float` 2 faults against 1 planned at 97 pads, pad 0x2000 among them. Rule: only when list order leaves a phase mode exposed (a section it counts after the last head-bin section its warm-up runs), the **cover** (the last member every counted phase's warm-up runs; on both profiles `getrusage`, which every warm-up ends with) stays where it is and every later member some phase counts is linked just ahead of it; places stay list positions except where the order differs (strictly increasing, five digits). Membership, modes and planned windows are unchanged. Options measured with the evaluator (fast / release, with and without `pair_s`): (A) cover linked last: every phase mode at its planned count at every pad, but the probe's `true` mode above its plan at 3799 / 3977 pads (base 3517 / 3411); (B) groups a phase counts kept out of the head bin: planned windows rise (locale 2 to 3, tool 2 to 3, fast float 1 to 2, release strings 0 to 1) and `float` stays exposed: rejected; (A2, taken) phase sections ahead of the cover: every phase mode at its planned count at every pad on all four plans, `true` above plan at 3619 / 3495 pads (start-up counts at `pre` pads are not a contract: D-X.103, `HEAD_ROOM`). The planner prints `so: head bin order: ...; phase modes exposed: ...`. No spec clause (layout of the products).
'''
