body = '''
**Slice 17 headers: no argp internal inline helpers, no inline forms of `argp_usage` and `argz_next`, and a complete `struct _IO_FILE` in `<printf.h>`** (SL-HEADERS-S17-3, headers slice 17; ruling #6480, accepted; C 7.1.3 reserves the underscore names). libniji's `<argp.h>` declares `argp_usage` and `<argz.h>` declares `argz_next` as the exported functions only: a call is a call of the symbol, not an inline expansion, so a program's behaviour and its link needs are those of the exported function. The helper names `_argp_input`, `_option_is_short` and `_option_is_end` are not provided: they are names reserved to the implementation (C 7.1.3), a program has no portable use for them, and source compatibility is best effort (plan/headers.md section 0). Inline forms of `argp_usage` and `argz_next` are added only if a package needs them. `<printf.h>` makes `FILE` visible and the tables give `FILE` a size, so its generated header defines the complete `struct _IO_FILE` (a superset of an incomplete tag: every program that compiles with the tag alone compiles with it defined). The probe comparison (P2, P3) lists these rows as differences; they are accepted in `validation/headers_s17.accept`. No compatibility option: the helper names are reserved, and the exported functions give the result the inline forms would.
'''
