id = "D-X.150"
section = "x"
status = "active"
amends = ["D-X.143"]
story = "VALGRIND-DBG-RODATA"
date = "2026-11-21"
tests = ["xtask/src/so.rs::libc_so_has_one_read_only_data_section_for_valgrind", "xtask/src/so.rs::startup_group_first_keeps_one_read_only_segment_at_every_text_size"]
body = '''
**libc.so.6's start-up read-only group is the output section `.startup_ro`, so `.rodata` is the library's one `.rodata*` section** (VALGRIND-DBG-RODATA, GitHub issue #13; amends D-X.143). Cause: valgrind's ELF reader (3.24, the version trixie ships; its source, `coregrind/m_debuginfo/readelf.c`, read for this) takes the first section whose name starts with `.rodata` as an object's read-only data, merging later ones only when adjacent, and on reading the object's separate debug file asserts (`find_rodata`) that the section named exactly `.rodata` there, with the adjacent `.rodata*` sections after it, has the same size. D-X.143 put `.rodata1` (the group, 64 KiB aligned) ahead of `.rodata`, so the first section was `.rodata1` and the debug file's `.rodata` never matched: with libc6-dbg installed (trixie's valgrind package pulls it in) every valgrind tool aborted (`Assertion 'di->rodata_size == sh_size' failed`) on every program, measured in a swapped trixie root on snapshot 2026-11-21.4. Change: the link-script fragment of both libc links (`RODATA1_FIRST`) names the output section `.startup_ro`; its inputs are still the archive's `.rodata1` sections, its place, alignment and contents are D-X.143's, and only the section header's name changes (`cmp_load` on a Skylake-SP host, base vs this change: same program headers and section addresses and sizes; the only loaded bytes that differ are the 20-byte build-id and one byte of the ELF header's section-header offset, the section-name table having grown by 3 bytes; the loader is byte-identical). Options weighed: dropping the group from libc.so.6 (undoes D-X.133's start-up window and D-X.143's single read-only segment); a debug-file-only rename (the debug file's section names would no longer match the library's, which debuggers relate by name); merging the group into `.rodata` (it would have to lead `.rodata`, which GNU ld's default script fills itself). Checks: `cargo xtask so` refuses a libc.so.6 or loader with a `.rodata*` section other than `.rodata` (`check_debug_reader_rodata`), and `tools/deb/check-system.sh` refuses such a packaged shared object. Static programs (libc.a's `.rodata1` after `.rodata`, GNU ld's default script) are not changed here.
'''
