body = '''
**Liella's `<math.h>` declares the functions libmvec.so.1 has vector variants of `__attribute__ ((__simd__ ("notinbranch")))` where `__FAST_MATH__` is defined and the compiler has the attribute** (SL-HEADERS-S20-3; issue #28's guard, deb_manifest `coexist_lm_brings_in_libmvec_only_for_a_vector_call`). With slice 20 the drivers compile against Liella's headers, and a declaration without the attribute lets no vectorizing compiler call libmvec, so vector math was lost for every program built on them. The set is the `libmvec.so.1` rows of spec/abi/versions.tsv, nothing hand-listed (54 functions, each with the unmasked `b`, `c`, `d` and `e` variants; headers-gen refuses a function without exactly those four, of one element type and shape, since the attribute makes GCC assume all four). The attribute belongs to the declaration and changes no function's type; a function bound to another symbol by an assembler label is not marked (the variants carry the label's name). The conditions were settled by black-box compiles with GCC 13 on the reference (loops over each function, `-S`, the `_ZGV*` names in the assembly): calls appear only with `__FAST_MATH__` (`-ffast-math`, or `-fno-math-errno -funsafe-math-optimizations -ffinite-math-only` together; `-U__FAST_MATH__` gives none, `-fopenmp` or `-fopenmp-simd` alone give none); only unmasked variants (a branch in the loop: none without AVX-512, the unmasked `e` variant with it); the same set in C and C++ and in every `-std`, also strict C89 and C++98 under `#pragma omp simd`; none for the `_FloatN` names (`sinf32`, `sinf64`, `sinf32x`). Liella's headers give the same `_ZGV*` set for all 54 functions in those configurations. One difference remains, not caused by this row: in strict `-std=c89` / `-std=c++98` / `-std=c++03` without the pragma, 11 functions diagattrs.tsv marks `__const__` (sinf, cosf, tanf, atanf, tanhf, asinh, asinhf, cbrt, cbrtf, erf, erff) vectorize on Liella's headers and not on the reference's, because the reference does not treat them as const there (a follow-up on the const attribute's conditions). Older GCC releases and other compilers were not probed: `__has_attribute (__simd__)` decides.
'''
