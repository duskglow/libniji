body = '''
**The workload count measures a long row's far-off column again before it reports, and the Skylake-SP class (the CI gate's) gets its own recorded levels** (WL-LEVELS-RERECORD-2, 2026-11-22; tooling and recorded levels only, no product code; amends D-X.155; coordinator rulings #7447 and #7448: fix the count forward, never loosen a level; record Skylake-SP as a new class). (1) **Excursion re-measure** (`validation/wl_stats.sh` `wl_excursions`, called by `wl_count_run.sh` after the 2 % faults re-measure): in a row whose new or base column runs at least 4 x 10^9 user instructions (about 2 s on both classes; an instruction count, not a clock, so the same rows qualify on every run), a column whose page faults (its lowest run) are more than 7 % above its pair's is measured again, 5 more runs at a time, up to 3 batches; its runs join the ones it has (the row keeps the lowest of all, the highest is printed), the note lists each batch, and the rows go back to the cache. Why: on the Zen 1 host, under 5 counts at once, tar-gz (a 4 s pipeline) had every run of one column high (count k2: new 781..784, then 758..786 after the 2 % re-measure, against base 629; count k4: base 629 first, 765..877 after the re-measure, which replaced it), so the lowest of 5 runs could not remove the excursion and k2 failed its level. **Threshold:** from the 10 counts of D-X.155 (5 per class, each column the lowest of 5 runs), columns of one code spread by at most 3.0 % (tar-gz Zen 1 629..648; tar-c Skylake-SP 465..476 = 2.4 %, its glibc 389..400 = 2.8 %; single-process rows 0), and the excursion columns sat 15.6 % (727 against 629) to 24 % (781 against 629) above their pair; 7 % is about the geometric midpoint, more than a factor 2 from either. Short rows repeated exactly in all 10 counts, so a far-apart pair there is a real difference and is not measured again; nor is the median method (`WLC_ASLR=1`). **A real regression is not hidden:** it is in every run of its column, so no batch lowers it; after 3 batches the note says "still over ... reported as measured" and the verdict judges it. Cost: only rows whose pair is more than 7 % apart, at most 3 batches of 5 runs (tar-gz about 20 s each; printf-loop about 4 minutes each, only when its new and base faults differ by more than 7 %, which a count reports anyway). Tests (`validation/wl_stats_test.sh`): the k2 tar-gz rows replayed with a stub batch in the 629..647 range of the other 8 columns: one batch, new 758 -> 631, `wl_verdict.py check` against the unchanged level 1.2371 fails before and passes after; a planted regression of that size (every batch 758..786, as both of k2's measured batches): 3 batches, still 758, the verdict still fails (1.4493 over 1.2371); short rows, the median method and a pair within 7 % are not measured again. Plants: `handoff/WL-LEVELS-RERECORD-2-plants.txt`. (2) **Skylake-SP levels** (Intel Xeon Platinum 8151): 20 page-fault rows recorded from the 5 Skylake-SP counts of D-X.155 (`wl-levels-rerecord-m1..m5`, next 0299fd6e1, COUNT_FRESH=1) with exactly D-X.155's rule (libniji = the highest of the 10 libniji columns, glibc = the lowest of the 5 glibc columns, level = ceil4 of the ratio): ls-l-enUS 1.2939 (2654/3434), md5sum 1.2207 (145/177), cut-tr-uniq 1.2200 (482/588), seq 1.2000 (135/162), ls-lR 1.1671 (2754/3214), sed-s 1.2884 (215/277), sed-utf8 1.2159 (227/276), bash-loop 1.3097 (197/258), grep-F 1.1416 (424/484), grep-E 1.1505 (432/497), grep-i-utf8 1.1173 (452/505), gawk-sum 1.2106 (247/299), gawk-regex 1.2290 (249/306), gawk-utf8 1.1667 (300/350), gawk-printf 1.2132 (244/296), tar-c 1.2237 (389/476; libniji 465..476 and glibc 389..400 over the counts, the only row that varied), tar-tv 1.2069 (232/280), gzip-d 1.1636 (214/249), pipe-mix 1.1484 (1126/1293), tar-gz 1.1981 (520/623). du (3284/3094 = 1.0615) and every instructions:u row (highest grep-F 1.0386) are at or below 1.10: no hold. printf-loop was not in those counts; its Skylake-SP rows come from 2 counts of their own (`wl-levels-rerecord-2-m-printf` and `-m-printf2`, 2026-11-22, same revision and method, the second already with the re-measure of (1), which did not trigger): instructions:u 3.6312 (5268874366/19131967207; libniji 19131965450..19131967207, glibc 5268874366..5268875467), page faults 1.3424 (1460184/1960130; libniji 1960127..1960130, glibc 1460184..1460197). A new class only adds bounds (the ratchet refuses a row added to a class the base records, not a new class). Each of the 5 counts passes the new levels (`wl_verdict.py check`: PASS, no HELD-UNRECORDED). (3) Each row's `recorded` names how many counts it rests on where that is not 5: printf-loop on the Zen 1 host rests on 2. No level was loosened; the Zen 1 levels are unchanged.
'''
