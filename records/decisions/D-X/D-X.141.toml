tests = ["validation/wl_verdict_test.sh", "validation/wl_lock_test.sh"]
body = '''
**The INVIOLABLE workload rule binds the dynamic kit: libniji linked dynamically and started by its own ld.so, as users run it (owner ruling #6965, 2026-11-20: "Yes. I'd rather have honest.").** (1) `WL_LINK` defaults to `dynamic` (`validation/wl_lock.sh`); `wl_count.sh` runs `validation/wl_verdict.py` on the new column of a dynamic release run and fails on its FAIL: each workload at or below 1.10x glibc in instructions:u and in page faults, and the geomean of instructions:u at or below 1.00 when every workload ran (page faults' geomean is printed, advisory). A static, fast-profile or `WLC_ENV` run prints the same verdict without gating. (2) Rows over 1.10x when the rule moved, for dynamic start-up (printf-loop's instructions: 20000 starts; page faults, about +45 per start), are HELD in `validation/wl_holds.tsv` at their level recorded on next (ratio to glibc, rounded up to 4 decimals, per CPU class, since instructions follow the IFUNC variant a CPU selects). A ratchet: a level is never above the measurement it records nor raised from the merge base's, and no row is added for a CPU class already recorded (`wl_verdict.py holds`); a held row measuring at or below 1.10x drops its hold in that run (HOLD-RELEASE). A held row on a CPU class with no recorded level is reported, not failed. (3) One `cargo xtask so` per sha serves both kits (`wl_build_products` caches the other link's set from the same build). (4) Static stays measured: `validation/wl_kits.sh` (glibc, static, dynamic, one host) is the nightly and release-candidate sweep, reporting the same rule; a static regression there opens a story and does not block a gate. (5) The timing gate `wl_gate.sh` stays on the static kit (its kits are copied to timing hosts, which a dynamic kit's absolute product paths do not survive).
'''
