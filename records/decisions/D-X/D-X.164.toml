story = "SHSTK-OPT-IN"
date = "2026-11-23"
body = '''
**Every object libniji ships carries the x86 SHSTK property, and the build fails when one does not** (SHSTK-OPT-IN, owner ruling #7728: mark libniji's own objects before any opt-in; SHSTK-SCOPE found ld.so, libc.so.6, libm.so.6 and 337 of 365 libc.a members unmarked, so no libniji process could qualify). The property is `GNU_PROPERTY_X86_FEATURE_1_AND` bit SHSTK in `.note.gnu.property` (x86-64 psABI "Program Property"); the link editor ANDs it over its inputs. The pinned stable rustc emits no such note, so `cargo xtask so` adds it (`xtask/src/cetnote.rs`): (1) `so::publish` gives every ELF member of a published archive without a note a `.note.gnu.property` section with SHSTK only (appended with a copy of the section-name table and of the section headers, so no section moves or changes index; the symbol index is rebuilt by `ar s`); IBT is not claimed, because Rust code has no `endbr64` at its indirect-branch targets. A member whose note lacks SHSTK fails the build rather than being overwritten. (2) The linked products (libc.so.6, ld.so, libm.so.6 and the other shared libraries, libmvec, the placeholder libraries, ldd, ldconfig, localedef and the other utilities) are linked with `-z shstk`. (3) `niji-Mcrt1.o` (no code) gets the start files' note (IBT and SHSTK, `csys/start/notes.inc`). (4) After the last product, `cetnote::check_release` reads every product the packages ship, as their manifest names them (the source of each `file` row of `tools/deb/manifest.tsv`, PKG-MANIFEST): every ELF file and archive member among them without SHSTK fails `cargo xtask so`, naming it, and so does a listed product the build did not make. What else is under `target/niji` is not shipped and not checked: the test programs, the Rust dylibs and programs of `cargo xtask rust-dylib` (`rust/`, `rust-test/`) and the by-path copy of libc.so.6 under `native/` (SHSTK-OPT-IN-2; the walk of the whole directory had failed the train on those). What makes the claim true is D-21.5's assembly audit (setjmp/longjmp, the context functions and vfork handle the shadow stack; SHSTK-SCOPE item L found no other assembly that breaks call/return pairing; Rust has no inline assembly). Nothing enables the shadow stack yet (SHSTK-ENABLE), so the note changes no behaviour: the kernel never enables it by itself. Tests: xtask `cetnote::tests` (`a_note_is_added_once_and_reads_back_as_shstk`, `the_check_names_an_unmarked_member_and_refuses_a_note_without_shstk`, `the_check_reads_the_products_the_manifest_ships`) and the check in every `cargo xtask so`.
'''
