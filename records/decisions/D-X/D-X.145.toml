tests = ["xtask/src/binbudget.rs::a_profile_whose_counts_do_not_block_reports_them_and_keeps_the_byte_checks", "xtask/src/layout.rs::window_counts_block_in_the_shipped_profile_only"]
body = '''
**WINDOW-BIN-BYTES's windows per mode block on the shipped (`release`) products only; in the `fast` tool profile they are a non-blocking WINDOW-COUNT REPORT** (WINDOW-GATE-STABLE; amends D-X.136). The contract's `windows-block=release` names the profiles whose count blocks (each needs its own `windows-<profile>` budget; an empty list or a profile without a budget is an error). The bins' bytes and placement, a mode without a budget or a budget without a mode, `.rodata1`/`.data1` and the data bins of D-X.138 stay blocking in every profile. Why: the `fast` products (thin LTO, 16 codegen units per crate) re-partition a crate's codegen units when any of its files changes, which moves inlining and outlining in unrelated functions; the shipped build (fat LTO, one unit) does not. HEAP-ADDRESS-SPACE-10 (ruling #7126) edited only heap code in `niji-boundary`; on the Skylake-SP host the fast window count went `tool` 2 -> 3 (bin 2 lost the locale group: `thread::each_block<locale::publish_global>` 696 -> 2,083 B, `setlocale_env_kept` newly outlined) while its release products held every mode at its budget, as on next. Measured choice (Skylake-SP host, 48 threads, ~/w role on zram): option A, one codegen unit per crate in the fast profile, doubles the libc crates' compile after a heap.rs edit (cargo-libc 41.7 s -> 84.5 s) and breaks trace-at-build on next itself (STARTUP-DATA-DECLARED: `heap::RSEQ_NODE.0`, a name the one-unit thin-LTO build gives), so every fast level would need re-measuring and a tracer rule, and it would still judge a layout that ships nowhere (thin, not fat LTO). Option B costs no build in the per-story gate; the release verdict comes from `NIJI_FULL_PROFILE=1 cargo xtask so`, which the start-up checks of every start-up story and the CI train already run (421 s cold on next vs 401 s for fast: the gdb trace dominates both). Cost accepted: a story whose gate builds only the fast products no longer sees a window-count regression there; it sees it in its full-profile start-up check or in CI. Plants: handoff/WINDOW-GATE-STABLE-plants.txt.
'''
