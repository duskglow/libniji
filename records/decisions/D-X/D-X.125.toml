body = '''
**ld.so's start-up pages no longer move with its size or its codegen partition** (LAYOUT-LDSO-WINDOW, follow-up of D-X.123). Three parts, each measured on the Skylake-SP host (Linux 6.8, ASLR off, per-page attribution with `perf record -d page-faults`) with a 46 KiB cold function as the probe. (1) Span: the kernel maps the interpreter top-down with its end at the mmap base, so growth moved its start (the start-up text group's 64 KiB fault-around phase, +1 text fault) and every mapping below it (vDSO, libc, the thread block: libc's thread registry hashes the thread pointer, +1 anonymous fault). `cargo xtask so` links the interpreter with `ld-span.ld`, an `INSERT AFTER .lbss` fragment whose empty `NOLOAD` section aligns the image's end to `LDSO_SPAN_BUCKET` (0x80000), and refuses an interpreter whose span is not a whole number of buckets; rejected: 64 KiB rounding (leaves the mappings below moving) and `-z max-page-size=0x10000` (Linux 6.8 does not honour `p_align` for the interpreter's base). (2) Codegen units: in the fast profile (16 units) the probe re-partitioned the interpreter's crates, which grew RELRO across a page (per-unit copies of pointer constants) and moved two 20 KiB `.bss` tables between the start-up words (+3 faults with the span fixed); release already used one unit and showed neither. `LD_RUSTFLAGS` now adds `-Ccodegen-units=1` and the build refuses an interpreter archive with members of units past the first. (3) Cold `.bss`: with one unit the `.bss` order is stable but split the start-up words around the same two tables (+1 fault against origin/next at N=0); libc's cold-bss pass (PAGEFAULTS-4) now runs on a copy of the interpreter's archive with a 4 KiB threshold, so those tables go to `.lbss` after the small words. Result (fast profile, faults at N=0/3/12 with ASLR off, 21 runs each, every run equal): origin/next 79/95/131 and 83/98/134 with the probe; this change 78/93/129, and 78/93/129 with the probe (instructions at N=0 9038k before, 9004k after, unchanged by the probe). Cost: the span rounding is untouched `.bss` (address space and commit charge under 512 KiB, no file bytes); one codegen unit makes the fast profile's interpreter build serial per crate. No spec clause (layout of the products; the loader's behaviour is unchanged).
'''
