tests = ["xtask/src/provenance.rs::counts_follow_the_tables", "xtask/src/provenance.rs::history_orders_by_key_then_name", "xtask/src/provenance.rs::malformed_fragments_are_rejected", "xtask/src/provenance.rs::view_without_fragments_is_an_error"]
body = '''
**`spec/abi/PROVENANCE` is a generated view: one fragment per story under `spec/abi/provenance.d/<STORY-ID>.txt` (front matter `order: <n>`, ties by file name), after the current counts of the `spec/abi` tables, which `cargo xtask records-gen` takes from the tables themselves** (PROVENANCE-FRAGMENTS). Every header story used to append a paragraph to the same hand-kept file, so any two of them edited the same last lines. On 2026-11-24/25 four merges stopped in CI on that file. Each cost a continuation and a train cycle. The stated totals had also drifted: the file said 161 types and 1372 layout rows when layouts.tsv had 275 and 2526. Now a story adds its own file and never edits a count, and the view is train-owned like the decision tables (D-X.55, D-X.59): `records-gen` renders it, and the static check `records-gen` names it when it is stale (advisory on a story branch, fatal on the train). A malformed fragment is an error everywhere. The 20 paragraphs of the old file were split into fragments with their text unchanged and their order kept as `order` 10 to 200. A paragraph that names its story got that story's id; the five that name none (the first abi_extract.py run, libm-ulps.tsv, callsites/noexcept, diagattrs) got the name of their tool or table. Counts in a fragment are what that run gave; the current totals are only in the generated part. `spec/tools/abi_extract.py` writes a fragment (`--story`) instead of the file, and `spec/tools/appendix_c.py` reads the reference line from the fragments. validation/headers_unshipped.tsv stays hand-kept: its `waits_for` column is a reason, which no table records. The list is also a ratchet: a header that stops shipping must fail P4, and a regenerated list would absorb that.
'''
