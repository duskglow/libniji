body = '''
**Start-up data is gated per story in bytes per section; the STARTUP-DATA-WINDOWS window and page counts are a release metric** (LAYOUT-BYTE-BUDGETS-3, owner ruling R2 of `plan/layout-budget-rethink.md`, finishing for start-up data what D-X.136 did for start-up text; amends D-X.62 and D-X.136; tooling only, no ABI or behaviour change). (1) `WINDOW-BIN-BYTES` (`xtask/src/binbudget.rs::data_verdict`) takes the start-up data objects STARTUP-DATA-WINDOWS counts (the `keys=` objects and the RIP-relative operands of the `text-keys=` functions, each cut to its first unit) and groups them by output section into data bins; a bin's bytes run from the page (written section) or 64 KiB window (read-only section) boundary below its first object to the end of its last and must fit `data-bins-<profile>` units. Sections whose start-up data shares a unit are joined in one bin (`.data1+.bss`), so the bins' units add up to the count and a section the one ahead of it pushes onto a unit of its own is red in bytes. Objects an untouched unit apart in one bin (release: two large buffers 0x4f000 bytes apart in `.lbss`) are separate runs, each run but the last charged its whole units, so the bytes fit `n` units exactly when the runs touch at most `n`. A section holding start-up data with no budget, a budget no start-up data lies in, and a bin joining written and read-only sections are red. Levels (fast, Skylake-SP host, next 50abc44ed): `.data.rel.ro` 6,728 bytes of 2 pages, `.got` 457 of 1 page (it starts 272 bytes into its page), `.data1+.bss` 11,784 of 3 pages, `.lbss` (the heap reserve's head) 4,096 of 1 page, `.rodata1` 37,888 of 1 window: 7 written pages = `rw-budget-fast` 7, 1 window = `ro-budget-fast` 1. Release: `.data.rel.ro` 4,153 of 2 pages, `.got` 3,713 of 1 page (it starts 3,696 bytes into its page: 383 bytes of headroom, the next edge), `.data1+.bss` 11,784 of 3, `.lbss` two buffers of 2 pages, `.rodata1` 34,398 of 1 window: 8 = `rw-budget-release` 8. Why: THREAD-FORCED-UNWIND-2 counted 8 written pages while the byte gate passed; its `.data.rel.ro` is 0x148 bytes shorter, which places `.got` (200 bytes) 4,040 bytes into its page, so `.got` straddled a page; the byte gate modelled only `.data1` and `.rodata1` as whole sections. On its products the gate now names `.got`: 4,225 bytes > 4,096. (2) STARTUP-DATA-WINDOWS lists every window and page with its class (`ro window`, `rw page`) and address on every build; over a budget it prints a non-blocking `PAGE-COUNT REPORT` per story and blocks only under `NIJI_FAULT_BOUNDS=enforce`, the switch of the runtime fault bounds of `hot_text_products` (the release ratchet). Its budgets are unchanged (`ro-budget` 1/1, `rw-budget` 7 fast, 8 release): the count is where the release ratchet reads them. Not done: the data bins name their largest objects but not objects new or grown against a base (the base plan `NIJI_LAYOUT_BASE_BINS` holds text members only).
'''
