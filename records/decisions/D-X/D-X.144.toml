story = "CRT-START-FILES"
date = "2026-11-20"
body = '''
**The start files hold only what a program needs of them; libc.a's layout anchors are its first members (CRT-START-FILES, GitHub #27; amends D-X.64 and D-X.68 on where the cluster anchors live, and LAYOUT-WINDOW-BINS-5's text-group end).** The empty anchor sections (`.rodata1`, `.data1`, the relro anchor aligned to the start-up clusters' sizes, and `.text.sorted.h9z.niji_group_end` aligned to 64 KiB) moved from `csys/src/machine/entry.S`'s start object into two libc.a members that `cargo xtask so` inserts ahead of all others: `niji_static_anchor.o` and `niji_static_pie_anchor.o` (entry.S with `-DNIJI_STATIC_ANCHOR`, the second also with `-DNIJI_STATIC_PIE` and its 4 KiB `.data1`). Why: a dynamic program never reads libc.a, but the start objects carried those alignments into it, which gave it a second `R E` LOAD and a 64 KiB-aligned RW segment. How the anchor stays libc.a's first input: a static link takes the first index entry that defines a still-undefined symbol, and the start object leaves exactly one (`__libc_start_main` from crt1.o/gcrt1.o, `niji_start_main_static_pie` from rcrt1.o/grcrt1.o); each anchor defines its own weakly, as `jmp __niji_libc_<name>` (one jump per static start), and neither names the other's. The start objects now have `_start` (beginning with endbr64), `.note.gnu.property` (IBT, SHSTK, x86-64 baseline; crti.o and crtn.o carry it too), `.note.ABI-tag` (Linux 3.2.0), `__data_start`, weak `data_start` and `_IO_stdin_used` (4 bytes, 0x20001, from a readelf probe of the reference start files), and no section aligned above 64 bytes; `cargo xtask so` checks each one (`check_start_file`). The relro anchor is an empty `.preinit_array` rather than `.data.rel.ro.local`: in libc.a the latter came after a program's own `.data.rel.ro.local*` inputs and padded them to the boundary (up to 60 KiB of fill inside relro, `init_startup_data_pages_hold_at_every_data_phase`); the linker's script places `.preinit_array` ahead of `.data.rel.ro` in relro and programs rarely fill it, so relro starts on the boundary and a program's relro precedes the cluster with less than a page of fill, as with the anchor first in the link (a static and a static-PIE probe padded by 0x4d0-0x14d0 bytes of relro: fill under a page, static PIE one writable LOAD). The start symbol's jump sits at the group end's 64 KiB boundary, in the window of the program's own text, so no libc.a input precedes the hot group (TEXT-PREFIX, D-X.63); STARTUP-TEXT-WINDOWS counts it in no window. Tests: xtask `start_file_check_names_each_missing_or_extra_piece`, `start_files_and_static_anchors_assemble_as_checked`; `crates/core/tests/crt_products.rs` `programs_get_one_executable_mapping_and_keep_their_properties`.
'''
