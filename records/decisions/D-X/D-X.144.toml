story = "CRT-START-FILES"
date = "2026-11-20"
body = '''
**The start files hold only what a program needs of them; libc.a's layout anchors are its first members (CRT-START-FILES, GitHub #27; amends D-X.64 and D-X.68 on where the cluster anchors live, and LAYOUT-WINDOW-BINS-5's text-group end).** The empty anchor sections (`.rodata1`, `.data1`, the relro anchor aligned to the start-up clusters' sizes, and `.text.sorted.h9z.niji_group_end` aligned to 64 KiB) moved from `csys/src/machine/entry.S`'s start object into two libc.a members that `cargo xtask so` inserts ahead of all others: `niji_static_anchor.o` and `niji_static_pie_anchor.o` (entry.S with `-DNIJI_STATIC_ANCHOR`, the second also with `-DNIJI_STATIC_PIE` and its 4 KiB `.data1`). Why: a dynamic program never reads libc.a, but the start objects carried those alignments into it, which gave it a second `R E` LOAD and a 64 KiB-aligned RW segment. How the anchor stays libc.a's first input: a static link takes the first index entry that defines a still-undefined symbol, and the start object leaves exactly one (`__libc_start_main` from crt1.o/gcrt1.o, `niji_start_main_static_pie` from rcrt1.o/grcrt1.o); each anchor defines its own weakly, as `jmp __niji_libc_<name>` (one jump per static start), and neither names the other's. The start objects now have `_start` (beginning with endbr64), `.note.gnu.property` (IBT, SHSTK, x86-64 baseline; crti.o and crtn.o carry it too), `.note.ABI-tag` (Linux 3.2.0), `__data_start`, weak `data_start` and `_IO_stdin_used` (4 bytes, 0x20001, from a readelf probe of the reference start files), and no section aligned above 64 bytes; `cargo xtask so` checks each one (`check_start_file`). The relro anchor is an empty `.preinit_array` rather than `.data.rel.ro.local`: in libc.a the latter came after a program's own `.data.rel.ro.local*` inputs and padded them to the boundary (up to 60 KiB of fill inside relro, `init_startup_data_pages_hold_at_every_data_phase`); the linker's script places `.preinit_array` ahead of `.data.rel.ro` in relro and programs rarely fill it, so relro starts on the boundary and a program's relro precedes the cluster with less than a page of fill, as with the anchor first in the link (a static and a static-PIE probe padded by 0x4d0-0x14d0 bytes of relro: fill under a page, static PIE one writable LOAD). The start symbol's jump sits at the group end's 64 KiB boundary, in the window of the program's own text, so no libc.a input precedes the hot group (TEXT-PREFIX, D-X.63); STARTUP-TEXT-WINDOWS counts it in no window. The property note gives every program a `PT_NOTE` and a `PT_GNU_PROPERTY`, and the static start walks all of a program's headers (`niji_rt::start::program`), where an unread non-load header cost 14 instructions (a `PT_LOAD` 8); CRT-START-FILES-2 made each header cost one bit test of its type's low six bits against a mask of the three types the start reads (`PT_PHDR`, `PT_TLS`, `PT_GNU_RELRO`; any type sharing a bit is then compared exactly), over whole headers with one bound: 6 instructions per header (the static empty start, `cbench_startup/startup_instr_c` on the Zen 1 host: 2188 -> 2133 with the notes, 2160 -> 2121 without). Tests: xtask `start_file_check_names_each_missing_or_extra_piece`, `start_files_and_static_anchors_assemble_as_checked`; `crates/core/tests/crt_products.rs` `programs_get_one_executable_mapping_and_keep_their_properties`; `crates/rt/src/start.rs` `program_reads_only_its_three_types_among_any_others`. The window-bin planner (D-X.103) puts a group that counts a measured phase (a phase mode without its warm-up in the signature) in a later bin rather than the head bin when both charge it the same modes (`xtask/src/bins.rs` `head_takes`, a tie-break only, so no mode's window count changes): the head bin does not start on a window boundary, so text ahead of the group beyond its 1 KiB room pushes a suffix of the head bin into a window of its own, and a phase-only section there with no warm-up section after it was the phase's first touch of that window (the smaller start let six rebind-phase sections fill the head bin to 64,395 of 64,512 bytes; a start file padded by 0x800 bytes then gave the rebind phase 1 fault, `init_zero_fault_calls_hold_at_every_text_phase`). Merged with HEAP-ADDRESS-SPACE-6's rule for the same failure (a group only measured phases count never joins the head bin, `head_may_take`), the tie-break still covers the groups a measured phase and other modes count. Test: xtask `a_section_a_measured_phase_counts_prefers_a_later_bin_on_a_tie`.
'''
