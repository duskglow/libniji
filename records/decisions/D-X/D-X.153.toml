id = "D-X.153"
section = "x"
status = "active"
story = "VALGRIND-LOADER-VIEW"
date = "2026-11-21"
tests = ["xtask/src/so.rs::versioned_defaults_of_compat_functions", "xtask/src/so.rs::versioned_default_alias_copies_its_function", "xtask/src/so.rs::loaded_bytes_compare_only_what_is_loaded", "crates/core/tests/tool_symtab_products.rs::compat_defaults_are_named_with_their_version_in_symtab"]
body = '''
**Each function libc.so.6 exports at a default version with a compat version beside it is also named `name@@VERSION` in `.symtab`** (VALGRIND-LOADER-VIEW, GitHub issue #13, #7303). Cause: valgrind's tools (3.24, trixie's; its source read for this: `coregrind/m_redir.c`, `helgrind/hg_intercepts.c`) match `.symtab` names literally and never derive a version from `.gnu.version`; helgrind wraps `pthread_create` on Linux only as `pthread_create@*` (and `pthread_join` by its plain name). The link versions a default through the version script, so `.symtab` named it plainly, while its compat stub (`.symver`, D-27.4) was `pthread_create@GLIBC_2.2.5` there: helgrind wrapped the stub, never the default every current program calls, and asserted at `pthread_join` (`hg_main.c:5421`) on a thread it had never registered (measured in a swapped trixie root on origin/next: thr and race both assert; stock's trace names its wrapped default `pthread_create@@GLIBC_2.34`). Change: after the link (`cargo xtask so`), objcopy adds each alias by name and the build copies the function's own `.symtab` entry into it (binding, type, section, value, size): valgrind takes symbols of one address and one size as one function with several names, and passes over a size-0 one, so the plain name stays and every tool that looks it up still finds it. Functions only (tools redirect functions). The build refuses a result whose loaded bytes (ELF header outside the section-header fields, program headers, every segment's file range) or `.dynsym` changed, or an alias away from its function's value, size or type. Options weighed: renaming the default to `name@@VERSION` (drops the plain name that the layout contracts, the hot-text tools and tools' plain-name wrappers look up); a `.symver name@@VERSION` in the defining object (the defaults are Rust functions; the version script is their one versioning point); naming only in the libc6-dbg debug file (a libc.so.6 run with its `.symtab`, as from the build tree, would keep the fault).
'''
