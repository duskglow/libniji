tests = ["crates/core/tests/hot_text_products.rs::init_first_localtime_r_stays_within_its_page_fault_bound", "crates/core/tests/hot_text_products.rs::init_first_localtime_r_and_mktime_stay_within_their_combined_page_fault_bound"]
body = '''
**The first-`localtime_r` page-fault bounds count the whole process (start-up plus the first call), ratcheted on next's whole-process count; the vDSO lookup stays lazy** (HEAP-RSEQ-NODE-3, 2026-11-14; amends D-X.53 for these two bounds only; test and probe only, no symbol, ABI or behaviour change). (1) The `localtime` and `localtime_mktime` modes of `crates/core/tests/oracle/page_faults.c` print the process's own minor-fault count (getrusage `RUSAGE_SELF`) at the end of the first `localtime_r` (and of the first `mktime` after it), not the delta across the calls. (2) The bounds are per product profile and equal origin/next's whole-process count measured the same way (same probe, same relay harness, no randomisation, warm-up plus five runs, lowest kept): origin/next 5bbefc645 on a Skylake-SP host with two NUMA nodes, every run identical: fast 40, release 42, for both modes; the branch reads the same. (3) A count more than 4 under its bound also fails: the probe no longer counts start-up (a call-only count reads about 20 under these bounds), or the level improved and the bound must come down (ALWAYS FORWARD). Every other start-up bound is unchanged. Why (owner ruling #5735 (b), extended to every host class, #5769): the vDSO is looked up lazily, at the first call that needs it. When the heap's first allocation stopped calling the vDSO `getcpu` (HEAP-FIRST-USE-8 on one-node hosts, D-3.21's rseq `node_id` read on two-node hosts), the lookup moved from start-up into the first clock call; the call-only count read that move as +2 (20 > 18) although the process did no more work. The owner refused both alternatives: making the trace probe call `clock_gettime`, and an eager vDSO lookup at start-up ("feels like moving the measurements to accept an inefficiency"); a short program that never reads the clock should not pay for the lookup. Counting the whole process makes one-time work that moves between start-up and the first call read as no change, while work added anywhere before the end of the call still shows. Not measured on the other host classes (Zen 1, Haswell-EP, Broadwell-EP); the slack of (3) leaves room for a one-fault spread between them.
'''
