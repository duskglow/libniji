body = '''
**The start-up data set is declared by rule; the trace only checks it** (LAYOUT-CANONICAL-SET, owner ruling R3 of plan/layout-budget-rethink.md, #5745; layout input only, no symbol, ABI or behaviour change; bounds unchanged). `startup-data.keys` (the STARTUP-DATA-WINDOWS keys, the read-only keys of `.rodata1` and the relro cluster's written keys) was the union of perf page-fault traces of the build host and the start-up functions' `# <addr>` operands, so its members followed the build host's CPU, environment and locale data. `tools/hottext/startup_data.py` now writes the set declared by rule from the linked probe alone: the data objects addressed by (1) the operands of the start-up functions of `startup-text.keys`, RIP-relative and absolute (the linker relaxes a GOT load of a static non-PIE link to `mov $<addr>, %reg`; the old scan missed `environ`, `process::ARGC` and the CPU-classed words of csys/src/machine that way), (2) the same operands of `page_faults.c`'s own functions (its statics left out), (3) one level of pointers (aligned 8-byte words inside those objects that address a data object). Left out: `.lbss` (the build's cold class, D-X.22: `global_locale::SLOTS` is written by the locale paths only, and its head would count a written page start-up does not write; `heap::RESERVE_MEM` is not touched by `page_faults true` either). The perf traces of both probes now run under `env -i LANG=C PATH=/usr/bin:/bin setarch -R`; a traced object outside the declared set fails the build (`STARTUP-DATA-DECLARED`), naming it and the CPU. Measured with one pair of probe binaries on the Haswell-EP, Skylake-SP and Zen 1 build host classes: the declared list is byte-identical (99 objects), the traces differ (57, 58 and 58 objects) and each is a subset. Options weighed (plan/layout-budget-rethink.md 5): a fixed trace environment alone keeps the CPU dependence; a union of committed traces of several hosts makes names cross builds again; the call closure was 2-4x the traced bytes (plan/layout-rethink.md 3.3). Plants: handoff/LAYOUT-CANONICAL-SET-2-plants.txt.
'''
