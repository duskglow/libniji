story = "VALGRIND-LOADER-VIEW"
date = "2026-11-21"
tests = ["crates/boundary/src/ld/image.rs::hidden_view_is_inaccessible_until_revealed_and_the_bare_machine_does_not_hide"]
body = '''
**Under valgrind the loader maps each whole-file view inaccessible and then makes it readable; on the bare machine a view stays one readable mapping** (VALGRIND-LOADER-VIEW, GitHub issue #13, ruling #7301). Cause: valgrind's debug-information reader (3.24, trixie's; its source read for this: `coregrind/m_debuginfo/debuginfo.c`, `di_notify_mmap`) records every readable mapping of an object file made before the object's segments as a mapping of that object, passes over an inaccessible one, and does nothing on `mprotect` (`di_notify_mprotect`). The loader's whole-file view (`map_view`, the file mapped read-only so its headers can be read before the segments) covers every read-only segment's file range, so valgrind took the load bias of `.eh_frame` and `.rodata` from the view, and every stack walk through libc.so.6 read unwind data at the wrong address: memcheck's record of a leak through `vasprintf` ended in `???` frames after libc (measured in a swapped trixie root with the whole libc6-dbg, origin/next; stock names the program's frames down to `main`). Change: `views_hidden()` asks valgrind's documented `RUNNING_ON_VALGRIND` client request (`niji_machine_running_on_valgrind`, `csys/src/machine/tool.S`) once per process and caches the answer; when it is nonzero, `map_view` maps the view `PROT_NONE` and then `mprotect`s it readable (`#[cold]` `map_view_hidden`). Options measured (perf stat -r 50 user and kernel instructions and page faults, strace system calls; Zen 1 host; next / this head / (a) = every view hidden, unconditionally): rows head (b) -> (a), means of 50 runs each, through env (its own start is in every value): empty main user instructions 1044564 -> 1044260, kernel 2308606 -> 2283366, page faults 141 -> 141, system calls 28 -> 29, mprotect 2 -> 3; three libraries user 1259839 -> 1259613, kernel 2680150 -> 2610446, faults 150 -> 150, system calls 58 -> 62, mprotect 5 -> 9; dlopen of one library user 1409158 -> 1408754, kernel 2798013 -> 2738179, faults 171 -> 171, system calls 70 -> 74, mprotect 3 -> 7. User instructions and faults do not move; kernel instructions vary by several percent from run to run (here (a) came out lower), so the deterministic counter that decides is the system calls: one more per whole-file view. The bare machine against the same build with origin/next's views (base -> head, two rounds of 50 runs each): user instructions empty main 1044547, 1044509 -> 1044564, 1044578; three libraries 1260012, 1259974 -> 1260023, 1260018; dlopen 1409162, 1409164 -> 1409280, 1409257 (about +40, +40 and +100, under 0.01 %, the client request and the cached test); page faults and system calls equal (141, 150, 171 and 28, 58, 70; one strace of base dlopen showed 68); kernel instructions within their run-to-run spread. (a) adds one `mprotect` per view (empty main, three libraries and a dlopen each pay it) and its kernel instructions, so the brief's rule chose (b), the valgrind-only path. Its cost on the bare machine: one client request per process (a few rotate instructions and no system call), and a cached byte test per view. The hidden path is not left to valgrind runs alone: the unit test runs `map_view_hidden` on the bare machine (inaccessible when mapped, readable after the reveal, nothing left mapped when the reveal fails) and checks that the bare machine's client request answers 0; it lives in the loader module, which only `cargo test -p niji-boundary --lib --features ld` builds (the gate's library tests leave `ld` off: a ruling is asked for). Not chosen: reading the headers without a view (the view serves the loader's reads of the file until the object is linked, so that would cost system calls per object on the bare machine too).
'''
