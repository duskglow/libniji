body = '''
**libniji's headers give an object built when optimizing for speed the references the reference's headers give it, through GNU inline bodies written from each function's specification; and no function that may set errno is declared pure or const** (HEADERS-O2-INLINES; amends the slice 18 and slice 19 header tables; owed #145). Why: P3 (SL-HEADERS-S18) left 55 call-site rows over 26 names where an object built at -O2 against the reference headers referenced other symbols than the same source against libniji's (e.g. no `getchar` at all, `strtol` for `atoi`, `__getdelim` for `getline`), so a program could link against one library's headers and not the other's, and `atof` was declared pure (slice 19's `diagattrs.tsv`), which let a caller keep an errno from before the call (conformance `s08_strto_fenv_flags`, 61 atof rows, with libniji's headers). Method, black box only (no reference header text, no `-E`/`-dM`): undefined symbols of objects compiled against each header set, over -O0/-O1/-O2/-O3/-Os/-Og/-fno-inline/-ffreestanding/-fno-builtin and 14 feature-test macro sets, C and C++. (1) `<features.h>` defines `__NIJI_INLINES` 1 when `__OPTIMIZE__` is defined and neither `__OPTIMIZE_SIZE__` nor `__NO_INLINE__` is (the levels at which the probes showed the reference's objects drop or change the reference), and `__NIJI_INLINE_FN` as `extern __inline __attribute__ ((__gnu_inline__))`, so a taken address or a call the compiler keeps binds to the exported definition. (2) Bodies, written from the specifications: the `_unlocked` byte functions are Appendix C.9's protocols over the FILE window (`__uflow`, `__overflow`) and `_flags` bits; `getchar`/`putchar` are `getc (stdin)`/`putc (c, stdout)` (C 7.21.7.6, 7.21.7.8); `getline` is `__getdelim (.., '\n', ..)` under `_GNU_SOURCE` (POSIX getdelim); `atof`/`atoi`/`atol`/`atoll` are the `strtod`/`strtol`/`strtoll` calls C 7.22.1.1-2 makes them equivalent to (the strtol family keeps its language-mode name); `bsearch` is libniji's own binary search (C 7.22.5.1), probing in the library's order; `mbrlen` is `mbrtowc (NULL, s, n, ps)` with its own state (C 7.29.6.3.1); the `<string.h>`/`<strings.h>` names get C++ const-correct overloads. (3) `spec/tools/attr_probe.py` adds an `e` test (`errno = 0; r = F (opaque); if (errno) mk ();`, in a unit of its own): where the reference's object keeps the marker, the call may set errno and the table marks F neither pure nor const, whatever the literal-argument tests say (ERRNO_VETO); atof, atoi, atol and atoll lose `pure`. (4) `spec/tools/callsite_probe.py` compiles its C++ units with the C++ library's include directories on both sides (the `&abs`/`&div` rows were a probe artifact). Results (Zen 1 host): P3 on the 26 names 55 rows -> 0; equal undefined symbols over every level and macro set above (the reference's C++ `-ffreestanding` stdlib rows are libstdc++'s, not the header's); C++ `noexcept` of 32 call forms equal at -O0 and -O2; callers that fold an errno check libniji's way and not the reference's: 269 -> 0; table and headers byte-stable across two regenerations. Tests: `xtask/src/headers/slices/o2inlines.rs`; plants: `validation/headers_o2inlines.plants`. Difference: atof/atoi/atol/atoll not pure (`docs/differences-from-glibc.md`, no compatibility option: the attribute lets a compiler drop an errno the call sets).
'''
