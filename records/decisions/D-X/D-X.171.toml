tests = ["spec/tools/header_checks/form.py", "xtask/src/headers.rs::every_table_row_is_emitted_and_matches_the_tables", "xtask/src/headers/slices/s12.rs::network_headers_pass_header_check"]
body = '''
**A macro that is an enumerator in the reference names that enumerator in libniji, and the enumeration has the reference's members, so in C++ the macro has the enumeration's type; a char-constant macro is a char literal** (HEADERS-CXX-ENUM-TYPES; coordinator ruling #8421, "match the type"). Source: black-box probes of the reference by `spec/tools/enum_probe.py` (a C++ program per header prints, per macro, `__is_enum`, the enumeration's identity through `__PRETTY_FUNCTION__` and `std::type_index`, `__underlying_type`, `sizeof` and the value; a C program records whether `#if` sees an identifier). `--derive` writes two tables. (1) `spec/abi/enumerators.tsv` rows with tag `anon FIRST` (FIRST = the enumeration's first enumerator) for the reference's enumerations that neither a tag nor a typedef names (59, 758 rows); `spec/abi/enum-macros.tsv`: macro, the enumerator it names (itself, or the enumerator of the same enumeration with its value), and the headers where it is not an enumerator (897 macros). 37 `<langinfo.h>` macros with no same-value enumerator name a reserved member `__niji_NAME`. (2) The generator declares an `anon` enumeration once per translation unit (guard `__NIJI_D_anon_FIRST`, whichever header comes first), each member under its own condition and `#ifndef NAME` (a kernel header that came first may define the name as a macro); the whole `enum { ... };` is under an `#if` that at least one member it would declare is left, since `enum { };` is invalid (`<linux/in6.h>` before `<netinet/in.h>` defines every member of one enumeration). An enumerators.tsv `enum TAG` enumeration is always declared whole, with or without a typedefs.tsv row (EPOLL_EVENTS, `__socket_type`, `__itimer_which`, `__priority_which`, `__rusage_who`). A mapped macro is `#define NAME ENUMERATOR` where its header declares the enumerator in every configuration where it defines the macro, else the literal. (3) macros.tsv type `char` (20 rows: tar.h `*TYPE`, CBRK/CEOL/CSTATUS, ELFMAG1-3, REC_EOF/EOR/ESC, SCOPE_DELIMITER, _POSIX_VDISABLE) is emitted as a char literal (`'0'`, `'\377'`): `char` in C++, `int` in C, as the reference. In C every enumerator is `int` (the C type and `sizeof` are unchanged). Checked by the form module of header_check (`type differs` and `enumeration differs`, from the facts `ut` underlying type and `same-as` one type with the previous enumeration-typed macro, now FAIL); cxx17 type rows 1198 before, 45 after (27 `MS_*`: D-X.126; 18 `REG_*`: `<regex.h>` declares no `reg_errcode_t` yet, a labelled gap). An enumerator emitted outside any header (the rows test) declares its whole enumeration.
'''
