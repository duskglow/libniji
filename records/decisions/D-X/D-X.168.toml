body = '''
**The compiler drivers compile against Liella's headers by default, and the coexist package installs them as a sysroot under `/usr/lib/niji/usr/include` (with the multiarch directory `/usr/lib/niji/usr/include/x86_64-linux-gnu`)** (SL-HEADERS-S20, plan/headers.md slice 20; owner ruling #8413 of 2026-11-24). `niji-cc` and `niji-gcc`/`niji-g++` pass `-nostdinc`, then (C++ only) the C++ library's directories from the compiler's own `-v` search list, Liella's headers, the compiler's include directory and the kernel UAPI headers, after the program's own `-I`/`-isystem`; `NIJI_SYSTEM_HEADERS=1` restores the system's headers. The plan named `/usr/lib/niji/include`; the coexist tree mirrors `/` as it already does for the libraries, so one manifest row per header serves both flavours (the system flavour ships `/usr/include/<h>` and the multiarch directory). The coexist sysroot links the kernel UAPI directories to the host's linux-libc-dev, which `niji6-dev` depends on. Six C headers the spec names are not shipped yet (`aio.h`, `complex.h`, `mqueue.h`, `proc_service.h`, `tgmath.h`, `thread_db.h`, and the Fortran `math-vector-fortran.h`; `validation/headers_unshipped.tsv`, which P4 holds equal to what is missing): the switch lands with them as a known limitation (coordinator ruling on #8419, 2026-11-24, SL-HEADERS-S20-2), `NIJI_SYSTEM_HEADERS=1` being the per-package workaround in the coexist flavour; `complex.h` and `tgmath.h` follow in a story of their own.
'''
