body = '''
**Slice 12 headers (network core and name services): alias macros, kernel coexistence, accepted probe classes and P10** (SL-HEADERS-S12, plan/headers.md section 2.4; rulings #6406, #6458). The sixteen headers `sys/socket.h`, `sys/un.h`, `netinet/in.h`, `arpa/inet.h`, `netdb.h`, `net/if.h`, `ifaddrs.h`, `netinet/tcp.h`, `netinet/udp.h`, `resolv.h`, `arpa/nameser.h`, `arpa/nameser_compat.h`, `nss.h`, `aliases.h`, `rpc/netdb.h` and `sys/socketvar.h` are templates under `headers/`, generated into `libc-include/`; the tables gained `struct res_sym` (`spec/abi/layouts.tsv`, with the `abi-gen` output regenerated). Alias macros: `headers/netinet/in.h.in` owns (`@@owns-macro`) and spells as another macro `IP_RECVRETOPTS` (as `IP_RETOPTS`), `IP_RECVORIGDSTADDR` (as `IP_ORIGDSTADDR`) and `IPV6_RECVORIGDSTADDR` (as `IPV6_ORIGDSTADDR`); the slice's `@@alias NAME OF` marker (`xtask/src/headers/slices/s12.rs`) emits them and refuses a pair that `macros.tsv` gives different types or values. The kernel UAPI header `linux/in.h` defines these names with that spelling; a literal in libniji's header made the second definition differ token for token, so `<netinet/in.h>` followed by `<linux/in.h>` failed with a redefinition error (P8). With the alias spelling the redefinition is identical, which C 6.10.3 allows, so `<linux/in.h>`, `<linux/in6.h>` and `<linux/if.h>` after libniji's headers compile with and without `_GNU_SOURCE`. Kernel header first: `<linux/in.h>` before `<netinet/in.h>` is not supported (#6458: libc-first only; the kernel-first measurement and an extension proposal are with slice 13), so `spec/tools/header_check.py --kernel DIR` asserts the libc-first order only, and `--system` prints the same units against the build host's own headers for comparison. Optional includes: `arpa/nameser.h`, `resolv.h` and `netdb.h` include `<sys/param.h>` and `<signal.h>` behind `__has_include` until those slices are in the tree (ruling #6406); SL-HEADERS-S07-TAIL removes the guard and adds the check. Accepted differences of the P2 and P3 probes (`handoff/SL-HEADERS-S12/accept.py`): (a) names that `sys/param.h` and `signal.h`, and what they include, supply to the three headers above; (b) `_SIGSET_NWORDS` and `_STRUCT_TIMESPEC`, reserved names no template defines; (c) `bindresvport6`, which is omitted (`headers/reserved.tsv`) because it is not exported at a default version, so no program can link it (a row in docs/differences-from-glibc.md, no compatibility option); (d) the `recv` and `recvfrom` fortified call forms, which belong to slice 18. P10: `spec/tools/p10_net.c` evaluates `CMSG_*`, `IN6_IS_ADDR_*`, `IN6_ARE_ADDR_EQUAL` and the byte-order conversions on both header sets (1299 output lines, identical) and `header_check.py --p10` runs it; P1 (sizes, alignments, member offsets, integer constants) and P5 pass for all sixteen headers, and the xtask test `network_headers_pass_header_check` runs header_check (P8 and P10 only where the build host has the kernel and reference headers).
'''
