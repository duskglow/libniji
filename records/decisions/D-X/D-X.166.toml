id = "D-X.166"
section = "x"
status = "active"
story = "RELEASE-NOTES-FRAGMENTS"
date = "2026-11-23"
tests = ["xtask/src/release_notes.rs::assembly_is_independent_of_input_order", "xtask/src/release_notes.rs::sections_assemble_in_the_declared_order", "xtask/src/release_notes.rs::a_fragment_naming_an_unknown_section_is_rejected", "xtask/src/release_notes.rs::malformed_fragments_are_rejected", "xtask/src/release_notes.rs::the_shared_document_holds_only_released_sections", "xtask/src/release_notes.rs::release_inserts_above_the_newest_section_removes_the_fragments_and_is_idempotent", "xtask/src/release_notes.rs::the_tree_fragments_and_document_pass_the_check"]
body = '''
**Unreleased release notes are one fragment file per change, `docs/release-notes.d/<STORY-ID>.md`, assembled into `docs/RELEASE-NOTES.md` only at a snapshot or release** (RELEASE-NOTES-FRAGMENTS). Every note used to be added under one "Unreleased" heading of the shared file, so each landing changed the lines the other note branches had to merge into: on 2026-11-23 three branches conflicted there after one train and two of their follow-ups, written only to resolve that conflict, conflicted again after the next. A fragment is its own file, so two notes merge in either order without a conflict. The practice is the common changelog-fragment one (a `changelog.d` directory, as towncrier uses). A fragment is YAML-style front matter naming one known section (`changes`, `compat`, `known-limitations`, `contributors`; `SECTIONS` in `xtask/src/release_notes.rs`) and one or more Markdown list items. `cargo xtask release-notes` prints the assembled notes; assembly orders by section, then by file name, so the result does not depend on landing or directory order. `release --heading <text>` writes the section above the newest released one, keeping every other byte of the shared file, and deletes the fragments it used; a rerun with the same heading is a no-op. The `release-notes` static check (in `cargo xtask static` and the precheck) rejects a malformed fragment, an unknown section, a stray file in the directory, and an `## Unreleased` section or a repeated heading in the shared file.
'''
