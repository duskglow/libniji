tests = ["xtask/src/affected.rs::entry_table_diffs_tell_entries_from_code", "xtask/src/affected.rs::an_entries_only_layout_change_selects_by_its_entries"]
body = '''
**Direct tier: an entries-only diff of a generated entry table selects by its changed entries** (AFFECTED-LAYOUT-ROWS, coordinator ruling #8698; tooling only, no ABI or behaviour change). The rule is in the module doc of `xtask/src/affected.rs` (TIERS, `ENTRY_TABLES`, `entry_change`, `Selection::narrow_entries`); this record holds why. A generated entry table (`crates/abi/src/layout.rs` and its aarch64 twin, written by `cargo xtask abi-gen`) is one module that most of the tree names, so before this rule any change to it selected that module's one-hop users and their spec sections: on the header stories, which add rows to it, 225 of 328 test targets and 103 of 155 conformance programs per gate (27.5 min on an idle Zen 1 host). When the base diff (`git diff -U0`, or on a role tree the `.changed.abi` the sync writes) changes only entries (every changed line is one `abi-gen` writes for an entry, a literal array length, a line inside an entry, or a comment, and the diff matches the tree), the users are the modules naming a changed entry (or an entry containing one) and the targets naming a changed entry are selected too; no diff, or any other change (code, a helper, an impl), selects by the module as before. In this tier the image bounded set (D-X.142) then adds no dependents' unit tests for such a change. Why: a new or changed entry reaches only code that names it (a type nobody names yet cannot change what existing code does), while the table's own generator check (`abi-gen --check`, a cheap step every such run keeps) catches a table that drifts from its input. Measured on `headers-stage2-gaps-b-4`'s tree: 225 targets / 103 programs before, 5 targets / 0 programs after. Only `--tier direct`: `wide`, `full` and the CI train's FULL gate still run everything the module reaches, so what the narrow selection leaves out is checked on the merged tree before it lands.
'''
