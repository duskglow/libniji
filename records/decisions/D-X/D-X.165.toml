tests = ["crates/core/tests/hot_text_products.rs::init_data_clusters_hold_at_every_text_phase", "crates/core/tests/hot_text_products.rs::init_short_programs_stay_within_their_page_fault_bounds", "crates/core/tests/hot_text_products.rs::init_dynamic_startup_only_program_stays_within_its_page_fault_bound", "crates/core/tests/hot_text_products.rs::init_dynamic_empty_main_stays_within_its_instruction_bound", "crates/core/tests/hot_text_products.rs::init_coreutils_shaped_program_stays_within_its_page_fault_bound", "crates/core/tests/hot_text_products.rs::init_fork_child_stays_within_its_page_fault_bound"]
body = '''
**Start-up layout gates on its cause; runtime start-up metrics are ratios to the reference on the same host; the kernel's instructions are reported** (GATE-HONEST-METRICS, owner rulings #8133-#8136, #8144 and #8158, 2026-11-23, from TEST-BOUNDS-AUDIT and PERF-GAP-STRUCTURE-AUDIT; amends D-X.136's metrics, keeps its report-unless-enforced switch). (1) #8133: `init_data_clusters_hold_at_every_text_phase` no longer requires equal fault counts at the text pads (`pre`, `cold`). It traces `page_faults` in modes true, locale, tool and fork (into the child) with the build's tracer (`tools/hottext/trace_gdb.py`, new `HOT_TEXT_ADDRS` output) on the host's own CPU, in one locale load form, the locale-archive (owner ruling #8323, 2026-11-24; the CI host's default and the form the build traces): `true` and `fork`, which load no locale, with the host's own data files, `locale` and `tool` with the build's data files in their archive form (`canon_host.sh`'s redirection) whatever form the host's own files take, and fails naming every function of `libc.a` that ran outside the hot group's address range. Group membership is by section, so one link covers every text phase, and a function outside the group is caught whether or not a pad makes it straddle a window (the count saw it only then: 58 at every pad, 59 at `cold 0x2000`, on the Skylake-SP host only, and an unrelated `glob` change hid it). On next 0495c4684's products, traced with a host's own files in their per-locale-directory form, the check named `locale::name::candidates<..find_named<Files>..>` and `global_locale::note_failure` (the per-locale-directory load); the archive form pins that out. Equal counts stay required at the `lbss` and `data` pads (they move data, no text), with `FORK_BOUND`. (2) #8134 (group the per-locale-directory load path) is held by owner ruling #8323 until the target distributions' default locale form and the archive host's cost of the grouping are measured: the build traces the archive form only. Traced in both forms (GATE-HONEST-METRICS-2 and -3), the 5 functions only the directory path runs joined the `locale` and `tool` signatures, and the release-profile `tool` mode took 3 windows against its budget of 2 on a merged head (train 975). The window budgets (WINDOW-BIN-BYTES) stay gated: owner ruling #8322 makes them report-only together with a blocking fault-ratio gate, and the ratios here report unless enforced. (3) #8135: every runtime fault bound of `hot_text_products` (start-up only, setlocale + printf, coreutils-shaped, fork child, first localtime_r, localtime_r + mktime, first `%.2f`, the dynamic start) is the ratio libniji / reference, the reference being the same `page_faults.c` linked against the host's C library (static, or position-independent dynamic for the dynamic probe), run by the same harness on the same host; bounds in thousandths at the highest ratio measured on the Skylake-SP (per-locale directories), Haswell-EP and Zen 1 (locale-archive) hosts, no margin (every run identical). Absolute counts are printed and do not gate; the stale under-side reports ("more than 4 under") are retired. The release ratchet (`NIJI_FAULT_BOUNDS=enforce`) applies to the ratios. (4) #8136: the dynamic probe also counts its locale and tool modes, against the reference's (Skylake-SP 107 / 81 and 109 / 81; Haswell-EP and Zen 1 93 / 66 and 95 / 66). (5) #8144: `oracle/exec_instr.c` opens a second counter, the same event with exclude_user. Determinism, 20 runs, three series per host, dynamic empty main: run-to-run spread (max - min over the median) up to 10.6% (Skylake-SP), 10.2% (Haswell-EP), 15.4% (Zen 1) for libniji and up to 20% for the reference, so the kernel's instructions are reported (min / median / max, median ratio 1.30-1.32, user + kernel ratio) and not gated; the test fails if the counter is missing where perf_event_paranoid allows it. (6) #8158: `init_dynamic_empty_main_stays_within_its_instruction_bound` bounds the user instructions as a ratio to the reference's count of the same program on the same host, in ten-thousandths, per CPU model with a default row (the highest) for any other model, so no class is skipped. Each row is its old absolute bound over that host's reference count, rounded down, so it fails exactly where the old bound failed: as tight, not looser. The 11 reds of this test since 11-16 were growth past a bound with 2% headroom (user counts are identical run to run on every class, the reference's too), not host noise, so the ratio changes no verdict; the 11-23 red (173,794) stays red (17,060 > 17,040). Haswell-EP, before skipped, takes the Skylake-SP absolute bound over its own reference (libniji counts agree to 0.12% across classes). Measured on next 0495c4684 fast products. No spec clause (cost and layout of the products).
'''
