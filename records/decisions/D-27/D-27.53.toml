body = '''
**A pending C++ `thread_local` destructor pins its `dlopen`ed object (spec s1_2_c_6: `__cxa_thread_atexit_impl(fn, obj, dso)` keeps `dso` loaded until the destructor has run; amends D-27.50's liveness and removes its known edge "thread_local destructors a plugin registered do not pin it").** (1) **Pin:** registering with a `dso` inside a `dlopen`ed object adds one to that object's `pins` count in `ld.so` (under `STATE` only, so a constructor running under `CALL` may register); the registration node keeps the pin's token (the object's index plus one) in the word that held `dso`. A `dso` of the program, an initial object or `ld.so`, a NULL `dso`, or an address in no object takes no pin (those are never unloaded). A static program has no loader entry and takes none. (2) **Liveness:** an object with `pins > 0` is a root of the live set like an open one, so `dlclose` of its last handle finalises nothing and leaves it (and what it needs) loaded. (3) **Release:** after the destructor returns, the thread's destructor loop drops the pin (`StartInfo::dl_pin` `(1, token)`); at an object's last pin, with no open left and not `nodelete`, the loader unloads what is no longer live exactly as `dlclose` does (finalisers under `CALL`, then unpublish and unmap): the object's static destructors run after its `thread_local` destructors, and nothing leaks. A destructor that `dlopen`s or `dlclose`s its own object runs to its end in it (the pin is held during the call). A pinned slot is never reused, so the token names its object until dropped. (4) **Exit:** `exit` runs the calling thread's destructors first (ERRATA E9), dropping their pins, so a closed object is finalised before the exit handlers; another thread's pending pins keep it loaded and the exit's `fini_loaded` finalises it. (5) **fork:** the child inherits the counts; pins of threads that do not exist in the child are never dropped there, so such an object stays loaded in the child until it exits (never unmapped under a caller; the cost is the mapping). (6) A count that reaches `u32::MAX` makes the object `nodelete`. Interface: `StartInfo` gains `dl_pin` (the loader's `(op, arg)` entry; private between Liella's `ld.so` and `libc.so.6`, which are built together). Tests: crates/ld/tests/dlclose.rs `s1_2_c_6_thread_local_destructor_keeps_its_object_loaded`; plants handoff/DL-TLS-DTOR-PIN-plants.txt.
'''
