tests = ["crates/ld/tests/elf_reader.rs::valid_image_reads_back", "crates/ld/tests/elf_reader.rs::program_header_fields_read_their_own_offsets","crates/ld/tests/elf_readelf_parity.rs::readelf_l_parity", "crates/ld/tests/reloc.rs::reloc_image_reader_slices_only_unchanging_segments"]
body = '''
**The ELF reader's program header walks read the once-checked table at fixed offsets; no decoded copy is stored (LD-PHDR-ONCE).** A dynamic start walks the program header tables a few hundred times (the image views, `link`, the table checks, every by-address table read through `bytes_at` and `bytes_from`), and each walk decoded every header through eight separately bounds-checked reads, about 150 instructions per header (STARTUP-STRUCTURE-REVIEW, C3). Making a reader (`Elf::parse`, `Elf::from_image`) already checks that `e_phnum` whole entries lie at `e_phoff` of the bytes it holds (image mode: the bytes are the table and `e_phoff` is 0), and `check_table` checks every header; both stay as they were. A walk now takes that slice once (one range check per walk) and decodes each 56-byte entry from fixed offsets, so a header costs a few loads and fields the walk does not use are not read. The brief proposed a decoded fixed array per object; it is not stored because `Object` (which holds an `Elf` through its `Dynamic`) has a fixed size the loader's start-up stack relies on (DL-CANONICAL-PLT), and a table that is already checked decodes as cheaply as a copy would read. Measured on the Zen 1 build host (fast products, user instructions from exec to exit, ASLR off, median of 21; host C library in brackets): empty dynamic main 705,569 -> 634,146 [96,015]; a main calling one function in each of three one-function libraries 956,034 -> 819,961 [132,677]; the marginal cost of one more object 83,488 -> 61,938.
'''
