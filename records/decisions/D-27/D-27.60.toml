tests = ["conformance/c/s27_dynamic_address_entries.c", "crates/core/tests/s27_dynlink_clauses.rs", "crates/ld/tests/reloc.rs"]
body = '''
**The loader publishes each loaded dynamic array's address entries as run-time addresses (DL-DYNAMIC-RELOC, GitHub #22; probe `tools/probe/dl/dynreloc`, spec/behaviour/dynlink.md "The loaded dynamic array").** Programs read an object's dynamic array through `_DYNAMIC`, `dl_iterate_phdr` (`dlpi_addr` + `PT_DYNAMIC`) and `l_ld`, and use its table entries as pointers (systemd reads `DT_RUNPATH` at `DT_STRTAB` + `d_val`). (1) **Which entries:** `DT_PLTGOT`, `DT_HASH`, `DT_STRTAB`, `DT_SYMTAB`, `DT_RELA`, `DT_JMPREL`, `DT_RELR`, `DT_GNU_HASH`, `DT_VERSYM` hold the link-time value plus the load bias; every other entry (`DT_INIT`, `DT_FINI`, the `*_ARRAY` tables, `DT_VERDEF`, `DT_VERNEED`, `DT_TLSDESC_*`, sizes, flags, `DT_NEEDED` offsets) keeps its link-time value, as the probe settled for the main program, start-time libraries, libc, `ld.so` and `dlopen`ed objects. The set is `niji_ld::elf::RUNTIME_ADDRESS_TAGS`. (2) **Which objects:** an object whose `PT_DYNAMIC` lies wholly inside one writable `PT_LOAD` (`niji_ld::elf::dynamic_published`: the one rule for the writers and every reader); any other array is never written (the loader writes nothing outside a writable segment). The vDSO is never written. (3) **When:** `ld.so`'s own right after its self-relocation (`boot::publish_dynamic`, from `niji_ld_start`); the program's and every start-time library's after relocation, before RELRO is protected and before any constructor (`reloc::publish_dynamic` in `link`); a `dlopen`ed object's likewise before RELRO and its constructors (`load_set`). On x86-64 GNU ld places `.dynamic` in the RELRO part of the writable segment, a page relocation already writes. (4) **The loader's own reads keep link-time values (one view):** dependencies and `dlopen`ed objects are read from their file mapping (unchanged); the program's view (D-27.18) is taken before publication; `image_view` called with `published` (`own_object` for `ld.so`, `adopt_start` re-reading the start-time objects) shifts its copy of a published array (and of a whole-segment copy holding it) back by the bias; `readers::soname_at` takes `DT_STRTAB` as a run-time address when the array is published. `reloc::publish_dynamic` derives each value from the link-time view (bias added once), so a second call stores the same words. Out of this record (follow-ups): static-pie self-relocation and the no-dependency start path (`run` -> `relocate_self`) leave their arrays link-time; `DT_DEBUG` is not set.
'''
