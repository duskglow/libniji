tests = ["crates/ld/tests/dlopen_process_objects.rs::dlopen_process_objects_past_the_old_object_tables", "crates/ld/tests/dlclose.rs::s27_1_c_4_dlopen_waits_for_readers_only_outside_them", "crates/ld/tests/init_order.rs"]
body = '''
**The loader's object tables grow by generations; memory is their only bound (DL-PROCESS-OBJECTS part 2, audit HL-3 without TLS).** The link-map nodes, the object and symbol records, the readers' table, the `Finis` entries and the lock-held lists (`global`, `log`, `retired`) were sized for 512 objects. Each is now a table whose generation 0 is the old 512-entry array in place, so a process within 512 objects runs the same code on the same bytes; past it, generation g >= 1 (`ld/table.rs` `Gens`/`Grown`, the arithmetic of D-27.70's `Arena`) holds `512 << (g - 1)` entries in a private mapping made at first use and never moved or unmapped, since a `struct link_map *`, `dlpi_name` or `_dl_find_object` result is an address readers follow without a lock. A reader decodes an address or index by the generation-0 range test first, then one test per mapped generation (directory words loaded with Acquire); each lock-free walk (`dladdr`'s chain walk, `dl_iterate_phdr`, `_dl_find_object`) runs generation 0 in its own loop, the index bounded where it is decoded, and continues past it in one cold function: within 512 objects no extra compare per object (counted, 104 objects: `dladdr` 2441 -> 2239 instructions for the last object, `_dl_find_object` 18464 -> 18462, `dl_iterate_phdr` 16021 -> 16024 per walk). Indices are u32 (dependency entries widen from u16). The lists the lock holder alone reads (`log`, `global`, `retired`) keep 512 entries in place and move whole to a contiguous mapping (`Spill`) past it. **`dlclose` and the exit never allocate.** The `dlopen` that takes the count past 512 (`Loader::grow_to`, one `#[cold]` function) reserves everything the larger count needs: the table generations, and a `Scratch` mapping for the per-call sets (`live_set`, `close_end`, `exit_set`, the load set, reopen, `dlsym`'s scope), each sized for the new count. Within 512 objects those sets stay stack arrays. A `Finis`'s entries past 512 go to a reserved store (`fin`) used last-in first-out across nested `dlclose` calls from destructors, read by address so a destructor's own `dlopen` never aliases the loader. A failed reservation fails the `dlopen` with `<name>: cannot allocate memory` before the new object is written (what was already mapped stays, as every generation does); "cannot load more objects" is gone. Lists and scratch grow by doubling. The readers' wait rule (ruling #5651) keeps its count clause (128 retired objects) and applies the "top past three quarters" clause only while the top is within the first generation, where a reused slot is what frees room. The start-time objects stay within the first generation (the start writes the in-place nodes before any loader exists). TLS modules (`MODULES_MAX`) are part 3 (handoff/DL-PROCESS-OBJECTS.md).
'''
