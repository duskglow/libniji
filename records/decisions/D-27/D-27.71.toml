body = '''
**A start dependency the search checked is mapped by the plan its check made; the check's record is written into the loader's slot, not returned up the search (story COMPAT19-LDSO-COST).** At program start each dependency found by a search was parsed and planned by the candidate check (`dlopen::check`, so the search can skip another machine's object, by the probed start rule), then parsed and planned again by `map::load`, parsed a third time for its segments, and twice more for its dynamic section and link-map object: five program-header scans, two plans and three dynamic-section reads per object. Measured with Intel PT (every user instruction, products of equal path length, ASLR off), the program-header reads were the cost COMPAT19-TUNABLE's restructuring had made visible (about 1.4k instructions per extra object). Now `dlopen::check_into` gives the same verdict in the same order and keeps what it read (`Checked`: the parsed file, its plan, its dynamic section); `map::map_planned` reserves and maps by that plan from the same parsed headers; the link-map object is built from the same parse. Nothing is checked less: the plan used is the one the check made from the same read-only view of the file (loaded data stays untrusted, owner 11-17), and every path that was not checked by the search (a `DT_NEEDED` name with a `/`, an object whose executable-stack request the COMPAT-19 tunable accepted, `dlopen`, the program itself) keeps `map::load`, which parses and plans for itself. The record (about 340 bytes) is written into a slot in `link`'s frame (`check_into`'s `out`, passed through `open_candidate`): returned by value, it was copied through three frames under the search's 8 KiB frame, and the parse beneath them touched one more stack page per start (one more user fault, measured). The slot is cleared on every refusal, on the accepted executable-stack path, when a secure-mode preload is rejected by its file mode, and for a file found by path. Skylake-SP host, median of 101, against the base it was cut from: user instructions per start 740,620 -> 721,809 (empty main), 995,890 -> 973,448 (three libraries), 774,630 -> 755,763 (`clock_gettime`); user faults 52/67/56 unchanged; syscalls unchanged. No difference from the reference, so no differences row or compat flag.
'''
