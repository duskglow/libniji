tests = ["crates/core/tests/hot_text_products.rs::init_dynamic_start_system_calls_stay_within_their_bounds"]
body = '''
**The start's whole-file views come from one arena; the start's objects keep their reservation slack** (DYN-START-RING). `link` arms a view arena: the first view reserves 64 MiB of inaccessible address space (a first 1 GiB arena moved every mapping made while it was open into another 1 GiB page-table range than the loader's; that build measured +11.6k kernel instructions on an empty main on the Zen 1 host, together with a text layout split fixed at the same time, not measured apart; at 64 MiB with the split fixed, Skylake-SP measured -34k kernel instructions on an empty main and -55k with three libraries) (no memory committed; refused, e.g. under an address-space limit, every view is mapped on its own as before), each object's view is mapped over its next 64 KiB-aligned slot with one `mmap` (the alignment, so the fault-around windows, of a view mapped alone), and one `munmap` removes the arena with every view at the end of `link`. A view in the arena is never unmapped alone (a hole another mapping could take would then be removed with the arena). That is 4 system calls fewer per loaded object. The start's objects are never unmapped, so their mapper keeps an aligned reservation's slack (over-reserved for an alignment above the page: libc.so.6's 64 KiB) reserved and inaccessible rather than trimming it: 2 `munmap`s fewer per such object. `dlopen` and the list mode map as before.
'''
