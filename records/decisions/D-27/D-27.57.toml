story = "LDCONFIG-LIMITS"
date = "2026-11-17"
tests = ["crates/ld/tests/cache_write.rs::write_has_no_count_caps", "crates/ld/tests/ldconfig.rs::a_large_configuration_is_read_to_its_last_line", "crates/ld/tests/ldconfig.rs::a_configuration_read_out_of_memory_ends_the_run", "crates/ld/tests/ldconfig.rs::many_configured_directories_are_all_kept", "crates/ld/tests/ldconfig.rs::many_hwcaps_subdirectories_reach_the_cache", "xtask/tests/transcripts.rs::the_shipped_ldconfig_reads_every_argument_and_reports_exhaustion"]
body = '''
**ldconfig has no input caps (LDCONFIG-LIMITS, audit HL-15; owner ruling 2026-11-17 "Hardcoded-limits audit table": no artificial limits, growth with use, fallible allocation; ruling #5594: process limits are the user's bound).** Removed: the 1 MiB configuration-file cap (the rest of a longer file was ignored silently), the 65536-directory cap ("too many directories, ignored"), the writer's 64 distinct hwcaps names, 4096-byte generator text and 2^20 entries (`TooManyHwcaps`, `Generator` for length, `TooManyEntries`), and the 4096-argument cap of the freestanding program (`E2BIG`'s text). What bounds them now: memory (a fallible allocation; exhaustion is the run's `<program>: out of memory`, exit 1, never a crash and never the misleading "too large") and, for the cache, the format's 32-bit offsets (`WriteError::TooLarge`, "the cache was not written: too large"). Amends D-27.43's **No allocation**: the writer keeps the distinct hwcaps names in an inline list of `NAMES_INLINE` = 64 (the common case, no allocation, unchanged cost) and spills past it to an allocated list (gathered skipping runs of one name, then sorted and deduplicated once: O(n log n) whatever the order; `WriteError::Oom` when memory runs out); name offsets are recomputed from the string table's start instead of a fixed array. Duplicate configured directories are found through an open-addressing hash index of file identities (rebuilt at twice the size when half full), so naming many directories costs linear time instead of the quadratic linear search. Kept on purpose: the include depth guard `DEPTH_MAX` = 32 (HL-28) and the bounds on hostile cache and ELF input in `ldconfig/scan.rs` (HL-24). Probe (black box, reference ldconfig 2.39 in private roots, AVX2 build host): a 3 MiB `ld.so.conf` whose last line names a directory (scanned, link made), 70000 directories (all listed, the repeated first one reported once), 100 glibc-hwcaps subdirectories (101 entries in the cache, each with its name), 5002 arguments (exit 0): the reference takes all four; libniji now does too (before: the last directory not read, 65536 kept and 4465 "too many" lines, cache not written, `Argument list too long`).
'''
