body = '''
**`_dl_find_object` and `dladdr` find an address's object through a sorted address index, not a walk over every object (DL-FIND-OBJECT-FAST).** The unwinders call `_dl_find_object` once per frame in both phases of every throw; the walk cost grew with the objects loaded (18,387 instructions for the last of 104, 110,124 of 600). `crates/boundary/src/ld/index.rs`: one entry per `PT_LOAD` segment of a published object, `[segment start, segment end, object low, object high, PT_GNU_EH_FRAME, object index]`, sorted by segment start; a lookup is a binary search for the last entry starting at or below the address, kept when its object's range (lowest to highest `PT_LOAD` address) holds it. The start-time objects get an immutable index built by the first reader or `dlopen` in a private mapping, published by one compare-and-swap (nothing at start-up). After the first `dlopen` the index lives in two copies behind a sequence latch (Boehm, "Can seqlocks get along with programming language memory models?", MSPC 2012): only the loader-lock holder writes (`readers::publish`/`unpublish` call `index::added`/`removed`); `SEQ` odd sends readers to copy 1 while copy 0 is rewritten, even to copy 0 while copy 1 is; a reader keeps an answer only when `SEQ` did not move (8 tries, then the walk), so a torn entry is never used, and `dlclose` removes the entries when it unpublishes, before the grace period that lets the slot be reused. A copy that must grow moves to a mapping twice its size and the old one stays mapped (readers may be in it); a failed mapping disables the index (the walks answer). `NESTED` (two objects' ranges overlap, never with one reservation per object) sends lookups to the walk. **`_dl_find_object` in a dynamic program finds every pc in an object's span, gaps between segments included** (probe R-5, `spec/behaviour/dynlink.md`; before, a pc past a segment's `p_memsz` gave -1); the static program's per-segment answer is unchanged. **`dladdr` walks the chain while at most 12 objects are published** (about 17 instructions a node, cheaper than the index there) and past that tries the program first, then the index. Counted per call (validation/percall/dl_objects.c, dynamic, Zen 1 host): `_dl_find_object` of the last of 104 objects 18,387 -> 403 instructions (reference 173), of 600: 110,124 -> 471 (159); the first object (the program) 639 -> 402 (51). The remaining gap to the reference is the constant cost of the read section and the search (handoff/DL-FIND-OBJECT-FAST.md).
'''
