body = '''
**COMPAT-19 implemented: `GLIBC_TUNABLES=niji.compat.execstack=1` accepts objects asking for an executable stack (story COMPAT19-TUNABLE; Yohane's request, owner ruling 2026-11-20).** The default is unchanged (R14-13, threat model loader rule 10): a program, a start-up dependency or preload, or a `dlopen`ed library whose `PT_GNU_STACK` has `PF_X` is refused. **Tunable:** `niji.compat.execstack` (0 or 1, libniji only), parsed by `niji::config::Tunables` like the other `niji.compat.*` entries; a secure (`AT_SECURE`) process honours no tunable, so it stays refused there (as COMPAT-12, ruling #2662). It is read only on the executable-stack branch: the program check in `ld.so`'s `run`, the start search's candidate check (`open_candidate`), the start map, and `dlopen`'s candidate check (which reads the environment and auxiliary vector the process started with, as its search does). **Effect** (black-box probe of the reference, `tools/probe/execstack`, Zen 1 host): once such an object is accepted, the main stack and every thread stack the library made, before and after, are `rwxp`; a caller-supplied stack (`pthread_attr_setstack`) is left as it is. libniji: the main stack by one `mprotect` with `PROT_READ`, `PROT_WRITE`, `PROT_EXEC` and `PROT_GROWSDOWN` on the page holding the end of the `AT_EXECFN` string (the top of the initial stack mapping; `PROT_GROWSDOWN` carries the change to the mapping's start, mprotect(2)); the thread stacks by the C library's private `__niji_stack_exec` (`NIJI_PRIVATE`), which under the thread-list lock sets a flag and changes every listed library-made stack; `pthread_create` reads the flag under the same lock before linking a new thread, so no thread is missed. At start this runs after the C library's early initialisation and before any constructor; for `dlopen`, after the object is mapped and before its relocation and constructors. If the rest of a `dlopen` set then fails, the stacks stay executable (as the reference's). **Messages** (ruling 2026-11-20 (b)): the refusal names the object, the program (start: `ld.so: <program>: ...`, or the standard `<program>: error while loading shared libraries: <path>: ...` line for a dependency) or the `dlopen` caller (`dlerror`: `... (dlopen called from <caller>)`), and the two ways in: the tunable, and the system allowlist, said to be planned (registered in COMPAT-19, not implemented). **Cost:** none on a normal start (amended by COMPAT19-STARTUP-ZERO, ruling #6941): at start the C library's early initialisation, only when `GLIBC_TUNABLES` sets this tunable, walks the start objects (`dl_iterate_phdr`) and, when one asks for an executable stack (`ld.so` accepted it, as it refuses one otherwise), makes the main stack and its later thread stacks executable; `ld.so` reads its own accept flag only in a start without libniji's C library. One relaxed load per `pthread_create` under the list lock it already holds. Tests: `crates/ld/tests/exec_stack.rs` (program run directly and through `ld.so`, dependency, `dlopen` after threads exist, secure process, a GCC nested function taken by address). Clean room: black-box probes of the reference; mprotect(2) and kernel UAPI.
'''
