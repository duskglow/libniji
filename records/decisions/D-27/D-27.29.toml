tests = ["crates/ld/tests/atexit_owner.rs::s1_2_c_5_opted_in_handlers_run_at_dlclose_never_after_unmap", "crates/ld/tests/atexit_owner.rs::s1_2_c_5_opted_in_handlers_run_once_at_exit", "crates/boundary/tests/s01_startup_symbols.rs::s1_2_c_5_owner_opt_in_link_and_reference_refusal", "crates/boundary/tests/s01_startup_symbols.rs::s1_2_c_5_nonshared_archive_two_way"]
body = '''
**An opt-in registers exit, quick-exit and fork handlers without `libc_nonshared.a` (owner rulings #4860-#4862; design and probes P1-P3 in handoff/DL-NONSHARED-OPTOUT.md).** The default is unchanged: a default link takes the archive's stubs (D-27.28) and stays two-way compatible.

* **Interface.** `libc.so.6` exports `atexit`, `at_quick_exit` and `pthread_atfork` at the Liella-only version node `LIELLA_OWNER_1`, each as a NON-default version only, so a default link never binds them. `cargo xtask so` also writes the link-stub directory `liella-owner/`: `libc-owner.so` (a link-time interface stub with soname `libc.so.6`, the three names at `@@LIELLA_OWNER_1`, never loaded) and a `libc.so` script `GROUP ( libc-owner.so libc.so.6 AS_NEEDED ( ld-linux-x86-64.so.2 ) )` that names no archive. A module linked with `-L<dir>/liella-owner -L<dir>` needs `libc.so.6` once and the node `LIELLA_OWNER_1`; a loader without the node refuses it at load, naming the node (test against the reference). The build checks that the three are exported exactly once each, non-default, and nothing else at the node (`take_owner_node`); the compat-export check accepts exactly these three pairs besides the `versions.tsv` compat rows.
* **Attribution (a).** Each export is a frame-free shim (`csys/owner/owner.S`) passing the caller's return address. The owner is the lowest mapped address of the module holding it, found once through the loader's lock-free `_dl_find_object` reader (a registration may run in a constructor while `dlopen` holds the loader's lock), or the process when no module holds it.
* **The net (b), opted-in entries only (#4862).** After an object's finalisers, while its code is still mapped, `dlclose` calls libc's `__liella_owner_unload(lo, hi)` (`LIELLA_PRIVATE`) with the object's mapped range. Every opted-in exit entry whose owner OR handler lies in the range runs, most recent first; such opted-in quick-exit entries and atfork nodes are forgotten. Entries registered through the archive's stubs or `__cxa_atexit` keep the owner-only behaviour of `__cxa_finalize`: no differences row and no compat flag for them.
* **Markers.** Exit and quick-exit entries carry their own kinds (`OPTED_EXIT`, `OPTED_QUICK`), so `__cxa_finalize(dso)` never matches them (the owner is a map start, not a `__dso_handle`). An opted-in atfork node stores `owner | 1`: a module's lowest address is page-aligned and a `__dso_handle` pointer-aligned, so bit 0 marks the node and never equals a `__cxa_finalize` key.
* **Not yet built (#4861).** The opt-in build setting that adds `.note.liella.nonshared` and `.gnu.warning.<sym>` sections to the archive members, and the `ld.so` debug report of modules still using stubs: off by default, nothing is deprecated by default.
'''
