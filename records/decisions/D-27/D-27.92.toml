body = '''
**A program start reads each dependency from its headers and its mapped image, not from a whole-file view (story LD-START-MAPS; amends D-27.71's record of what the search's check reads).** A start candidate is opened, its ELF header and program header table read with one `pread` into the loader's scratch arena (the first 1 KiB, cut to the table's end), parsed by the same reader (`Elf::parse` reads only those bytes and checks the table's range against them, so a table past the read bytes is past the file), refused for `ET_EXEC`, planned with each `PT_LOAD`'s file range checked against the file's `fstat` length (`map::plan_headers`, the same `OutOfRange` error as a read past the file), mapped by that plan, and only then read for its dynamic section, from its mapped image as the program is (D-27.18). The verdict order is unchanged (header, `ET_EXEC`, plan, dynamic section); a refusal at the last step unmaps the object and ends the search as the same refusal from the whole-file check does (the start stops with the path and the refusal's text, status 127). The check reads loaded data once, at map time, as before; none is dropped. A read-only segment's last partial page with zero fill takes its bytes by one `pread`. An executable-stack request, a table ending past the first 1 KiB, or a full arena falls back to the whole-file view path unchanged; `ld.so --list`, `dlopen` and a dependency named by a path keep the view. Gain: no 64 MiB view arena, no whole-file mapping of each library and no arena unmap on the start path (three system calls fewer, and the view's page faults). Difference on malformed files only: a `PT_DYNAMIC` that does not lie in the file-backed part of a readable `PT_LOAD` is now refused at the search (`NoDynamic`: the start stops with `<path>: object file has no dynamic section`), where the whole-file reader, which reads the array at its file offset, accepted it; such an object's `_DYNAMIC` would not be mapped at run time. A dependency named by a path that this path refuses is checked again by the whole-file path, which reports it as before. The scratch arena grows from 4 to 16 KiB of `.bss` (untouched pages cost nothing) so the dependencies' image views fit in it.
'''
