id = "D-27.87"
section = "s26-29"
spec = "§27.1"
ann = "—"
status = "active"
story = "LD-RELR-LOOP"
date = "2026-11-22"
tests = ["crates/ld/tests/elf_tables.rs::relr_runs_match_the_iterator", "crates/ld/tests/reloc.rs::reloc_relr_entry_checks_its_whole_run", "crates/ld/src/boot.rs::relr_bitmap_across_segments", "crates/core/tests/hot_text_products.rs::init_dynamic_empty_main_stays_within_its_instruction_bound"]
body = '''
**The loader applies `DT_RELR` an entry at a time, and `libc.so.6` is linked with packed relative relocations (LD-RELR-LOOP, ruling #7402).** `Relrs::runs` hands its callback one `(base, bits)` pair per table entry (an address entry is `(addr, 1)`, a bitmap entry its 63 bits), with the same addresses, order and errors as the `Relrs` iterator; an entry that would name a word past the end of the address space gives the words that fit, then the iterator's error (cold `relr_overflow`). **Rule:** `reloc::pass1` applies an entry with no per-word check when its lowest and highest words both lie inside the copied segment window (one segment is one range, so every word between does too): a set bit costs 8 instructions (find the bit, form the address, add the bias in place, clear the bit). Any other entry goes to the cold `relr_checked`, which checks word by word with `Loads::inside` exactly as before and moves the window. The boot self-relocation (`boot::Writer::add_bits`) does the same with the bitmap's lowest and highest words in one writable segment, taking one segment view; any other bitmap goes to the cold `add_bits_checked` (the previous loop). No check on loaded data is dropped: each is folded into a per-entry range test. `libc.so.6` is linked with `-z pack-relative-relocs`: its 1,441 `RELATIVE` entries become 63 RELR words (7 address and 56 bitmap entries); `.rela.dyn` shrinks from 35,808 to 1,224 bytes (55 symbolic entries left), plus a 504-byte `.relr.dyn`. The library gains no version need (it already defines `GLIBC_ABI_DT_RELR`). **Measured** on the Zen 1 host, release products, the STARTUP-REPROFILE kit (execcount median of 101), base `next` fd973fc44 against this change: dynamic empty main 268,837 to 243,688 user instructions (-25,149), three libraries 378,132 to 352,952 (-25,180), `/bin/true` 329,222 to 304,186 (-25,036); page faults 58 to 57 and 70 to 69; system calls unchanged. `hot_text_products` on the same host: fast 255,972 and release 243,825 (its bounds tightened). **Estimated, not measured** (no instruction trace on the Zen 1 host; from the disassembly and the tables): `libc.so.6`'s RELR pass about 13.4k (1,441 words at 8, 63 entries at about 30) and the self-relocation about 3.5k (233 words at 13, including a bounds check per word that the safe slice view keeps), about 17k in all against the story's 15k target. Next step: a word-add method on the image (no null-address branch per word) and a self-relocation loop without the per-word view check, about 3-4k more.
'''
