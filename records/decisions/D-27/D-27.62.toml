tests = ["crates/ld/tests/rendezvous.rs::rendezvous_pie_matches_dl_iterate_phdr", "crates/ld/tests/rendezvous.rs::rendezvous_copy_relocation_is_kept_current", "crates/ld/tests/rendezvous.rs::rendezvous_gdb_breaks_in_a_dlopened_library"]
body = '''
**The debugger rendezvous from program start (DL-23, GitHub issue #19; plan M14-9, base namespace).** `ld.so` exports `_r_debug` (OBJECT, 40 bytes: `r_version` 1, `r_map`, `r_brk`, `r_state`, `r_ldbase`, every field an atomic word) and `_dl_debug_state` (a non-inlined function that does nothing; `r_brk` holds its address) at `GLIBC_2.2.5`, as `spec/abi/versions.tsv` lists them. **List:** the start links the public `link_map` prefix (`l_addr`, `l_name`, `l_ld`, `l_next`, `l_prev`) of the nodes the loader already keeps per object (`dlopen`'s node table, a static of `ld.so`), so the start-time list costs pointer writes, no allocation and no second pass; order is `dl_iterate_phdr`'s: the program (`""`), the vDSO (`linux-vdso.so.1`, one static link map that the loader's own walks step over), each `DT_NEEDED` object by the path it was opened by (the path store is kept for that), `ld.so` at its place by the program's `PT_INTERP`; `dlopen`ed objects follow; the `dlopen` handle is the link map. `r_ldbase` is `ld.so`'s base. **States:** the start sets `RT_ADD` and calls `r_brk` before relocation and `RT_CONSISTENT` before the first constructor; `dlopen` calls it with `RT_ADD` before linking and `RT_CONSISTENT` after publication; `dlclose` with `RT_DELETE` before the first unmap and `RT_CONSISTENT` after: the list is never changed while `RT_CONSISTENT` is visible. **`DT_DEBUG`:** the program's entry, when its dynamic array is writable, holds `ld.so`'s `_r_debug` (probe P-DL23-1: the reference points it at `ld.so`'s object for PIE and `-no-pie` programs, not at a program's copy). **Copy relocation:** a program that names `_r_debug` gets an `R_X86_64_COPY` of it (non-PIE, and PIE built `-fPIE`); the loader notes the copy's address at the `COPY` relocation and, once relocation and RELRO are done, keeps it (8-byte aligned and outside the program's RELRO range, else dropped) and writes every later update to both objects, so a program or debugger reading the copy sees the live list and state. The reference's copy holds the values at copy time (`r_state` `RT_ADD`); libniji's is current: a row in `docs/differences-from-glibc.md` (no compat option recommended: the snapshot carries no information a program can use; maintainer ruling asked in DL-23's hand-back). **Version:** `r_version` is 1, `r_next` absent: probe P-DL23-1 reads 1 from the reference without `dlmopen` (spec clause s27_4_c_0's "since 2.35 is 2" describes the namespace case); DL-22's namespaces extend the structure to version 2 with `r_next` when a second namespace exists. Tests: `rendezvous.rs` (PIE and `-no-pie` programs compare `r_map` with `dl_iterate_phdr` at start, after `dlopen` and after `dlclose`, through `DT_DEBUG`, `dlsym` and the copy; gdb stops at a pending breakpoint in a `dlopen`ed library). Clean room: the ABI's `<link.h>` layout, `dl_iterate_phdr(3)`, `dlinfo(3)`, gdb's observable behaviour and black-box probes of the reference.
'''
