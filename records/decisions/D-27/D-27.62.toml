date = "2026-11-19"
tests = ["crates/ld/tests/rendezvous.rs::rendezvous_reference_sized_copy_says_version_1", "crates/ld/tests/rendezvous.rs::rendezvous_pie_matches_dl_iterate_phdr", "crates/ld/tests/rendezvous.rs::rendezvous_lists_ld_so_the_program_does_not_name", "crates/ld/tests/rendezvous.rs::rendezvous_copy_relocation_is_kept_current", "crates/ld/tests/rendezvous.rs::rendezvous_gdb_breaks_in_a_dlopened_library"]
body = '''
**The debugger rendezvous from program start (DL-23, GitHub issue #19; plan M14-9, base namespace).** `ld.so` exports `_r_debug` (OBJECT, 48 bytes: `r_version` 2, `r_map`, `r_brk`, `r_state`, `r_ldbase`, and `r_next` at offset 40, null while there is one namespace; every field an atomic word) and `_dl_debug_state` (a non-inlined function that does nothing; `r_brk` holds its address): `_r_debug` at `GLIBC_2.2.5` as `spec/abi/versions.tsv` lists it, `_dl_debug_state` (`GLIBC_PRIVATE` there) at `NIJI_PRIVATE`, since libniji exports no `GLIBC_PRIVATE` node (R14-12); a debugger finds it by name in `.dynsym` before `DT_DEBUG` is filled, and `dlsym` finds it unversioned. `ld.so`'s own `l_ld` is read from its mapped program headers, not from a parsed view of itself, so the start adds stores, not a mapping. **List:** the start links the public `link_map` prefix (`l_addr`, `l_name`, `l_ld`, `l_next`, `l_prev`) of the nodes the loader already keeps per object (`dlopen`'s node table, a static of `ld.so`), so the start-time list costs pointer writes, no allocation and no second pass; order is `dl_iterate_phdr`'s: the program (`""`), the vDSO (`linux-vdso.so.1`, one static link map that the loader's own walks step over), each `DT_NEEDED` object by the path it was opened by (the path store is kept for that), `ld.so` at its place by the program's `PT_INTERP`; `dlopen`ed objects follow; the `dlopen` handle is the link map. `r_ldbase` is `ld.so`'s base. **States:** the start sets `RT_ADD` and calls `r_brk` before relocation and `RT_CONSISTENT` before the first constructor; `dlopen` calls it with `RT_ADD` before linking and `RT_CONSISTENT` after publication; `dlclose` with `RT_DELETE` before the first unmap and `RT_CONSISTENT` after: the list is never changed while `RT_CONSISTENT` is visible. **`DT_DEBUG`:** the program's entry, when its dynamic array is writable, holds `ld.so`'s `_r_debug` (probe P-DL23-1: the reference points it at `ld.so`'s object for PIE and `-no-pie` programs, not at a program's copy). **Copy relocation:** a program that names `_r_debug` gets an `R_X86_64_COPY` of it (non-PIE, and PIE built `-fPIE`); the loader notes the copy's address at the `COPY` relocation and, once relocation and RELRO are done, keeps it (8-byte aligned and outside the program's RELRO range, else dropped) and writes every later update to both objects, so a program or debugger reading the copy sees the live list and state. The reference's copy holds the values at copy time (`r_state` `RT_ADD`); libniji's is current: a row in `docs/differences-from-glibc.md`, accepted by the coordinator's ruling of 2026-11-19 (correctness), with COMPAT-35 registered to restore a start-time snapshot; registered only, not implemented: no program is known to depend on the copy staying stale. **Version (DL-RDEBUG-VERSION, owner ruling of 2026-11-19 on spec clause s27_4_c_0: follow the spec unless a program relies on the other behaviour):** `ld.so`'s own `_r_debug` is the extended structure, `r_version` 2 with `r_next` (offset 40) null while there is one namespace; DL-22's `dlmopen` links the other namespaces through it. The reference reads 1 from a program without `dlmopen` and exports a 40-byte `_r_debug` (probe P-DL23-1, `readelf` of its `ld.so`), which every program linked against it copies at 40 bytes. A copy of 40 bytes has no room for `r_next`, so a reader that honours version 2 would read the program's next variable as the namespace link: the loader writes version 1 into a copy made at 40 bytes (the structure that copy is) and 2 into a copy made at 48 (a program linked against libniji's symbol, which carries `r_next`). `DT_DEBUG` and `dlsym` give `ld.so`'s own, version 2. Evidence that nothing relies on 1 (a trixie root with libniji swapped in, version 1 against version 2, same outputs): gdb 16.3 stops at a breakpoint in `setlocale` in `/usr/bin/true`, lists `ld.so` and `libc.so.6` with `info sharedlibrary`, and stops at a pending breakpoint in perl's `dlopen`ed `POSIX.so`; Debian's `gnat1` (a 40-byte `COPY` of `_r_debug`) runs and `gcc-14` compiles an Ada unit; the other binaries of the root whose files name `_r_debug` (libgnat, the sanitizer runtimes, `cc1`, `lto1`, libpython, gprofng) were not exercised; valgrind in that root stops on an assertion while reading a debug file, identically under both versions. COMPAT-36 registers the reference's version 1 (registered only: no program is known to need it). Tests: `rendezvous.rs` (PIE and `-no-pie` programs compare `r_map` with `dl_iterate_phdr` at start, after `dlopen` and after `dlclose`, through `DT_DEBUG`, `dlsym` and the copy; gdb stops at a pending breakpoint in a `dlopen`ed library). Clean room: the ABI's `<link.h>` layout, `dl_iterate_phdr(3)`, `dlinfo(3)`, gdb's observable behaviour and black-box probes of the reference.
'''
