tests = ["crates/ld/tests/reloc.rs::reloc_quick_versions_bind_by_index_each_to_its_own", "crates/ld/tests/reloc.rs::reloc_quick_unterminated_string_table_is_the_exact_walks_error"]
body = '''
**A relocation's symbol is bound by a quick walk over tables validated once when the object's view is built, with versions compared by index; every other lookup, and every input the validation does not vouch for, keeps the exact walk (LD-SYMBOL-VALIDATE-ONCE, the structural step D-27.77 named).** Premise: PERF-GAP-STRUCTURE-AUDIT measured 1,510 user instructions per imported symbol against the reference's 643 (eager binding), spent on per-access checks, version-name matching and the scope walk. Designs estimated first: (A, adopted) validate once, then read in place and compare versions by index; (B, rejected) a per-process index of every exported name: about 30 instructions per export (the C library alone exports ~3,000) exceed the whole gap, as D-27.77 found; (C, not taken) a persistent resolution cache keyed by build ids: near zero per symbol but a new on-disk trust boundary, which needs a ruling; (D, not taken) resolving each symbol index once per object: few duplicate references in practice. `Object::build` validates, in one `#[cold]` function: little-endian words, a GNU table whose Bloom word count is a power of two and whose Bloom shift is below 32, a symbol count known and that many 24-byte symbols mapped, as many `versym` entries mapped, a string table ending in a NUL, and every hash chain ending below the symbol count (with a SysV table, the GNU table's own count is checked against it). The answer is one byte in the GNU table's tail padding, so no view grows. For `GLOB_DAT`, `JUMP_SLOT` and `64` the relocation pass then walks the global scope reading the tables in place: per object the Bloom word, the bucket and the chain; per candidate the symbol, its name compared in place and its version index. Entries the validation cannot cover without reading every symbol (a name's offset, a version index above the highest defined) are checked per candidate and send the reference to the exact walk, as do a view that failed validation, a SysV-only object, a canonical PLT entry, a version the pass's table does not cover, and an `STB_GNU_UNIQUE` definition unless the registry is the start's scope order and its version name reads without error; so every answer and error is the exact walk's. Versions: at the pass's first versioned reference one walk of the object's requirements, then its own definitions, gives each index (below 64) its name; a requirement's index learns the defining object and index from the first definition whose name matched, after which a candidate's version is one integer compare. Measured on the Zen 1 host (release products, `LANG=C.UTF-8`, median of 7, the audit's probe 5): per imported function with `-z now`, 1,525 -> 996 user instructions (reference 643); exact single-step count of the 996: the walk 503 (about 430 straight-line instructions, 155 of them moves), the name hash 133, the relocation pass's decode and store 165, and about 196 that grow with the probe's number of distinct versions, not imports (the requirement check `check_versions` 98, each version's first name compare 77, the pass's version table 18). The audit's nine distribution binaries, user instructions before -> after (reference): true 225,888 -> 207,271 (129,073); cat 288,011 -> 258,251 (326,486); ls 820,879 -> 662,068 (563,296); sort 1,195,464 -> 1,039,596 (877,918); date 332,619 -> 294,334 (352,984); wc 314,730 -> 277,966 (339,180); sed 1,213,814 -> 1,002,301 (908,798); grep 650,467 -> 557,371 (586,023); printf 290,521 -> 260,936 (330,649); outputs identical; kernel instructions and faults unchanged but ls (142 -> 135 faults). The brief's 300 per symbol is not reached: what remains is spread across the walk's straight-line steps (bounds checks the validation cannot remove without unchecked reads, which the loader's safe code does not make, and the definition's copies between the walk's layers), the serial name hash (about 15 instructions per byte) and the relocation decode and store; no straight-line block of the walk is a hotspot (per-instruction counts: each of its ~430 instructions runs once or twice per import).
'''
