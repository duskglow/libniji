tests = ["crates/ld/tests/elf_tables.rs::relocation_tags_checked", "crates/ld/tests/elf_tables.rs::verdef_malformed", "crates/ld/tests/elf_tables.rs::verneed_malformed", "crates/ld/tests/elf_tables.rs::gnu_chain_out_of_range", "crates/ld/tests/reloc.rs::reloc_version_check_hashes_never_change_the_answer", "crates/ld/tests/reloc.rs::reloc_version_check_beyond_the_kept_definitions", "crates/ld/tests/reloc.rs::reloc_image_reader_slices_only_unchanging_segments"]
body = '''
**Each loaded object's lookup view reads its dynamic tags in one pass and each hash table once; the version tables are checked in one walk that also gives their index; the version check compares stored hashes before names; the image view reads its table addresses once (LD-OBJECT-ONCE, with LD-VERSIONS-ONCE merged in).** STARTUP-REPROFILE found `Object::new` at a quarter of a dynamic start: each of about a dozen tag requests walked every dynamic entry, the GNU hash table was read six times per view (three address translations each), `GnuHash::symbol_count` read every bucket through its own range checks (about 31k instructions for the C library), and the `versym` checks walked every version definition, requirement and name through iterators that copied the dynamic view into each entry and searched each name for its NUL. Changes, none dropping a check: `Tags` takes the nine tags a view reads in one pass, answering as `Dynamic::once` does (a duplicate is still `DuplicateDynamic`); `Hashes` keeps `sysv_hash` and `gnu_hash` as they answered, errors included, so every later request gets the same answer in the same order; the bucket scan reads the bucket words as one slice with no branch per bucket (highest bucket, lowest non-empty bucket) and only on a bucket below `symoffset` falls back to the checked walk, which names the first such bucket as before; `check_verdefs` and `check_verneeds` make every check of the iterator walks, in the same order with the same errors, from fixed record offsets, and `check_string` skips the search for the NUL when the string table's last byte is a NUL (then every offset inside it starts a terminated string; the range check stays); the same walk gives the `Versions` index the view keeps, so the two tables are found once. The load-time version check (D-27.11) first looks for a definition whose `vd_hash` equals the requirement's `vna_hash` and whose first name equals the required name, validating every definition it passes exactly as the walk does; it answers only "found", and only when the walk by name would find the version with no error first. Otherwise (no definition has the hash, a hash is wrong, or a malformed definition comes first) the walk by name answers as before, so a wrong stored hash never changes an answer. The image view (D-27.18) reads the text-relocation flag and the addresses of the tables read by address once per object instead of once per segment per pass (three passes), keeping 16 addresses and walking the entries again only past that. Measured with the STARTUP-REPROFILE kit on release products, Zen 1 host, median of 101, next fd973fc44 -> this change: empty dynamic main 268,797 -> 196,486 (-72,311, -26.9%; glibc 2.39 96,040); a main calling one function in each of three one-function libraries 378,047 -> 290,575 (-87,472); per extra object 36,417 -> 31,363 (target 25,000 not reached); `/bin/true` 329,173 -> 254,366; 200 GLOB_DAT imports 554,706 -> 486,317; page faults (58 / 70) and system calls (28 / 58) unchanged.
'''
