body = '''
**The scope walk tests each GNU table's Bloom word before it enters an object; the version memo and the relocation path are the next structural steps (LD-LOOKUP-RETHINK).** One lookup was attributed instruction by instruction (ptrace single-step over the release loader, every executed address mapped through the line tables to the innermost inlined function), for a hit in the first library, a hit past three more, a miss, versioned and long names, and the C library's names; the reference loader was split only by black-box counts of the same programs. libniji paid 106 instructions per object walked past against the reference's 43, and about 25 of the 106 were the Bloom test itself: the rest entered the object's lookup (call, closure, `Result<Option<Def>>` plumbing). The walk (`symbols::lookup`) now runs the Bloom test inline (`GnuHash::bloom`) and calls `Object::lookup_in` only when it passes, at the hash chain (`GnuHash::chain_candidates`, one instance); a SysV table, or a Bloom word that cannot be read, takes the whole per-object lookup, so every answer and error is unchanged (`GnuHash::bloom_checked` keeps the old error; a parsed table always maps its Bloom words). Measured (release products, Haswell-EP host, user instructions, ASLR off): empty main 204,525 to 201,801, three libraries 307,109 to 291,992, `/bin/true` 247,585 to 242,991, per lookup 1,449 to 1,400 (the reference 675), per object walked past 106 to about 50, page faults unchanged. A first form instantiated the chain walk twice and gained only 12 per hit (the walk outlined); kept as evidence in the story's handoff. Not adopted, with estimates from the same split: index-addressed version names per object instead of the 64-slot memo hashed by string-table address (the C library's names pay 271 per lookup in versions against 125 for one version, the rest memo misses; the miss rate depends on where the tables are mapped); a flat relocation path over a view validated at load (decode, request, name and store are 520 of the 1,059 per hit, the reference's whole lookup is 553); a per-start name cache (start-up programs repeat few names); lazy binding (the measured programs and `/bin/true` bind now on both loaders). ThinLTO promotes `Object::lookup_in` with a `.llvm.<n>` suffix, a hash of niji_ld's module that the compiled-in installation prefix changes, so the prefixed interpreter's trace check compares names without that suffix, as the hot list keys them (`trace_difference` in xtask/src/so.rs); every other byte of a name still has to match.
'''
