id = "D-27.74"
section = "s26-29"
spec = "§27.1"
ann = "—"
status = "active"
amends = ["D-27.73"]
story = "DL-SLOT-REUSE"
date = "2026-11-21"
tests = ["crates/ld/tests/dlopen_process_objects.rs::dlopen_slot_reuse_fifo_churn_stays_bounded", "crates/ld/tests/dlopen_process_objects.rs::dlopen_slot_reuse_churn_with_concurrent_readers", "crates/ld/tests/dlclose.rs::s27_1_c_4_dlopen_waits_for_readers_only_outside_them"]
body = '''
**A `dlopen` set goes into the first run of freed slots below the top that holds it; load order is kept along the chain (amends D-27.73).** Before, freed slots were reused only at the top of the loader's tables, so a process that closes objects out of order (FIFO plugin churn: open A, B; close A; open C; ...) left a hole per close and the tables, and the cost of `dlopen`/`dlclose` (they scan up to the top), grew with every open. Now `load_set` finds and stages the set at the top as before; when the count of freed slots below the top (`Loader::holes`, kept by `reclaim` and `unwind`) is at least the set's size, a cold `settle` moves it into the first run of slots that are unloaded and past their readers' grace period (`freed`; a slot only unloaded may still be read and is never taken) and that is long enough (first fit). Everything is validated before anything moves; the nodes, object and symbol records, reader entries and dependency lists are renumbered in place, and the top slots it used go back to unused. Whole-table work after it runs to `max(set end, top)`. With no holes `load_set` adds one compare; within 512 objects nothing else changes. Load order (spec/behaviour/dynlink.md P-12) stays the chain's order: once a set has gone below the top (`Loader::reordered`, the readers' `REORDERED`, never cleared), the chain tail is found by walking the chain, exit finalisers step along the chain, and `dl_iterate_phdr` walks the chain (cold) instead of the index order: one flag test per `dl_iterate_phdr` call (+4 user instructions a call measured at 100 and 600 objects; every other row of DL-PROCESS-OBJECTS-2's counts unchanged). First fit was chosen over best fit because sets are mostly one or two objects and the scan runs only when the holes can hold the set; `reclaim` keeps the name arena's top over paths of unloaded objects still in their grace period. Measured (Skylake-SP host, FIFO churn of single-object sets, 100,000 opens): distinct handles stay at K+1 (K = 8, 100, 600) where before they were one per open; user instructions per `dlopen`/`dlclose` stay flat in N (K = 8: 73.5k/7.6k at N = 1k, 10k and 100k, before 0.14M/0.06M rising to 10.8M/11.1M; K = 600: 414k/185k from N = 10k on, before 11.0M/11.2M at N = 100k). Not bounded yet: the path and dependency arenas are still bump-allocated, so the address space still grows by about 100 bytes per open (VmSize +8.9 MB over 90,000 opens; before about 2 KB per open).
'''
