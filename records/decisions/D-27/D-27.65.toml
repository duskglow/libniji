tests = ["crates/ld/tests/tls_static_info.rs::tls_static_info_reports_every_threads_static_block", "crates/ld/tests/tls_static_info.rs::tls_static_info_sanitizer_runtimes_start"]
body = '''
**`_dl_get_tls_static_info` for sanitizer runtimes, and `ld.so` in the global scope of `dlsym` (story LDSO-TLS-STATIC-INFO, GitHub issue #26).** Sanitizer runtimes (the compiler's `libasan`, `liblsan`, `libtsan`) look up `_dl_get_tls_static_info` with `dlsym(RTLD_NEXT, ...)` at start-up and call the result unchecked; without it every such program jumped to address 0 before `main`. **Export:** `ld.so` exports `_dl_get_tls_static_info(size_t *size, size_t *align)` (`GLIBC_PRIVATE` in `spec/abi/versions.tsv`) at `NIJI_PRIVATE`, since libniji exports no `GLIBC_PRIVATE` node (R14-12; as `_dl_debug_state`, D-27.62); `dlsym` finds it unversioned. **Values:** `*size` is the bytes from the lowest initial static TLS block, the static surplus included (R14-4), up to the end of the initial thread block above the thread pointer (`INITIAL_TAIL`); `*align` is the thread pointer's alignment (the largest module alignment and the TCB's). Both are the same in every thread: every libniji thread repeats the initial static layout below its thread pointer (D-27.20) and has at least `INITIAL_TAIL` bytes of thread block above it. Probes P-TLSINFO-1..3 (black box, reference `ld.so` 2.39): the reference exports it at `GLIBC_PRIVATE` and reports the same values in every thread; its size grows by each initially loaded module's block rounded to that block's alignment (a 1000-byte block aligned to 64 adds 1024, a 4096-byte block aligned to 128 adds 4160), moves exactly with the documented surplus tunables (`glibc.rtld.optional_static_tls` 0/512/1024 change it by 512 each), and its smallest value (2816) is larger than the thread descriptor's span above the thread pointer (2368), so it counts the thread block as well; its alignment is 64 without TLS and the largest module alignment otherwise. libniji's size is larger by its 64 KiB surplus, which is reserved address space, and every byte of `[tp - (size - INITIAL_TAIL), tp + INITIAL_TAIL)` is mapped in every thread. A null or misaligned pointer is not written; a process the loader did not start reads 0 for both. The function is cold and off the start path. **Scope:** when no start-time object names `ld.so` (libniji's `libc.so.6` has no `DT_NEEDED` on it, and the sanitizer runtimes `libasan`, `libtsan` and `libubsan` do not name it either), the loader's `dlopen` state, built on the first `dl*` call, now adds `ld.so` to the global scope last, where the C library naming it would put it; before, it joined that state outside the global scope, so `dlsym(RTLD_DEFAULT/RTLD_NEXT, ...)` found none of its exports (`__tls_get_addr` included). Probe P-TLSINFO-2: on the reference, a library that names only `libc.so.6` finds `_dl_debug_state`, `_dl_get_tls_static_info` and `__tls_get_addr` through both handles. The start's own relocation scope is unchanged (start-up code untouched). Tests: `tls_static_info.rs` (values in the main thread and a created thread for programs with no TLS, a program block, a library block and both; the lookups through both handles; `-fsanitize=address` reports the heap overflow and `-fsanitize=leak` the leak). Clean room: black-box probes of the reference and the sanitizer runtimes' observable behaviour.
'''
