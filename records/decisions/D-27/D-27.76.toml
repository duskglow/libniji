story = "LIBC-SELF-BIND"
date = "2026-11-21"
tests = ["conformance/c/x_self_bind.c", "xtask/src/so.rs::libc_self_binding_keeps_only_the_malloc_family_and_data_symbolic", "crates/core/tests/hot_text_products.rs::init_dynamic_empty_main_stays_within_its_instruction_bound"]
body = '''
**libc.so.6 binds its own function references at link time, except the malloc family; its data references stay symbolic (story LIBC-SELF-BIND, ruling #7401, the "keep" variant of STARTUP-STRUCTURE-REVIEW C1).** The library is linked with `--dynamic-list` naming the malloc family (`xtask/src/so.rs` `LIBC_PREEMPTIBLE`, the static archive's `INTERPOSABLE` list of D-X.14: malloc, free, calloc, realloc, reallocarray, aligned_alloc, malloc_usable_size, memalign, posix_memalign, pvalloc, valloc, and the compat cfree) and `--dynamic-list-data`. Every other reference to a function the library defines (GNU ld's `-Bsymbolic-functions` semantics) is resolved at link time, so a start no longer looks up those names through the whole scope. Before, 277 of the 285 names behind libc.so.6's 288 symbolic relocations were its own (206 `JUMP_SLOT` and 34 `GLOB_DAT` to functions, 40 to data). Most were the library's compat and alias entries (`name@GLIBC_2.2.5` jumping to the current version, `_IO_fputs`, `llseek`, `pthread_yield`, `__secure_getenv`, ...), plus the heap's entry-point table, Rust code's `memcmp`/`bcmp`, and the XDR stdio stream's `fwrite`/`ftell`/`fflush`. **Interposition (probe-settled, black box against glibc 2.39, `conformance/c/x_self_bind.c`).** A program defining a function of each family is reached by none of the reference's other entries: pthread (`__pthread_mutex_lock`), aio, sem, mq (the compat versions), clock and timer, C11 threads, dl* (`dlerror@GLIBC_2.2.5`), ns* and dn*, `llseek`, `pthread_yield`, `__secure_getenv`, `_IO_fputs`, `openpty`, the library's internal `memcmp`/`bcmp` users (setlocale, newlocale, getaddrinfo, select), and the XDR stdio stream. The program's malloc family serves the library's own allocations on both (strdup, fopen/fclose, asprintf, getline), so it stays preemptible (GNU C Library manual, "Replacing malloc"). Exported data stays symbolic, so a program's COPY relocation of `stdout`, `optind`, `__fpu_control` (D-27.27) or any other object is the one the library uses. The build checks this (`check_self_binding`): no own function but the malloc family is left to a load-time lookup, and some data reference is left. No difference from the reference, so no compat flag.
'''
