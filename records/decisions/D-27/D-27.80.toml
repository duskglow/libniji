tests = ["crates/ld/tests/ldso_program_options.rs::ldso_program_option_parsing", "crates/ld/tests/ldso_program_options.rs::ldso_program_library_path", "crates/ld/tests/ldso_program_options.rs::ldso_program_preload_and_argv0", "crates/ld/tests/ldso_program_options.rs::ldso_program_verify_audit_and_refusals", "crates/ld/tests/ldso_program_options.rs::ldso_program_files_that_are_not_dynamic_programs"]
body = '''
**`ld.so [OPTION]... PROGRAM` takes ld.so(8)'s options and runs static programs (story LDSO-RUN-PROGRAM; found by RELEASE-SNAPSHOT-1121D).** Program mode accepted only `--help`, `--version` and `--list`, so `--library-path` (the usual way to run a binary against libraries built elsewhere) was refused. Black-box probes of the reference (spec/behaviour/dynlink.md, "Program mode options") settle each option; libniji now has: `--library-path PATH` (replaces `LD_LIBRARY_PATH` for the start's and `dlopen`'s searches; the environment keeps its value; the last copy wins), `--preload LIST` (after `LD_PRELOAD`'s names, before the preload file's, under `LD_PRELOAD`'s secure rule; the environment is not changed; the last copy wins), `--argv0 STRING`, `--inhibit-cache` (no search reads the cache, `dlopen`'s included), `--list`, `--verify` (status only: 0 with `PT_INTERP` and `PT_DYNAMIC`, 2 with `PT_DYNAMIC` alone, 1 otherwise; a name without `/` is not searched and gives 1). An option's value is the next argument; a missing value, an unknown option or no program is status 1 with `<argv[0]>: ...` and a `--help` hint, as probed. The program is still mapped as the kernel would map it and goes through the one start path (`run`); a program with no `PT_INTERP` (static, static PIE) is entered as the kernel enters it, and one with no entry point is refused (127). The program file's open and read failures use the reference's `<file>: error while loading shared libraries: <file>: <reason>` form and reasons. Not implemented and never ignored: `--audit` (libniji has no rtld-audit interface: each named object gets the reference's "cannot be loaded as audit interface" diagnostic and the program runs, as for an auditor that cannot be loaded), and `--inhibit-rpath`, `--glibc-hwcaps-prepend`, `--glibc-hwcaps-mask`, `--list-tunables`, `--list-diagnostics`, which are refused with status 1 (differences-from-glibc.md row; no compat option: the reference's behaviour comes back by implementing them). All new code is in one cold function (`entry.rs::program_mode`) and the program-mode branches; an exec'd program's start only gains the empty `--preload` list and the `--inhibit-cache` test.
'''
