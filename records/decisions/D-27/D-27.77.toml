tests = ["crates/ld/tests/symbols.rs::lookup_fast_paths_answer_as_the_plain_ones", "crates/ld/tests/symbols.rs::version_memo_answers_as_the_walks", "crates/ld/tests/reloc.rs::reloc_version_check_beyond_the_kept_definitions"]
body = '''
**A symbol lookup keeps its per-object walk and gets cheaper steps; a per-start name index over the scope is rejected (LD-LOOKUP-COST).** Two designs were estimated before building. (A, adopted) keep the walk of each object's hash table in scope order and make each step cheaper, with every answer and error unchanged: the Bloom word and the chain words read in one loop (`GnuHash::candidates`); a relocation's name found and GNU-hashed in one pass, eight bytes at a time while no byte is the NUL (`Dynamic::hashed_string`); a candidate's name compared in place when the string table ends in a NUL (`Dynamic::string_is`; otherwise the old scan); the symbol read as one 24-byte chunk; a reference whose version name is one of its own object's definitions matches a definition of that object by index (the request's origin, recorded by the pass memo when the reference walk answers from the definitions, so it costs nothing extra); the pass memo grows from 16 to 64 slots of 16 bytes (1 KiB of stack), its hit inline in the caller and its fill cold; and the version check walks a provider's definitions once per requirement entry, keeping the first 64 names (a walk from the start answers past them). (B, rejected) a hash of every exported definition in the scope, built once per start: about 45,000 instructions to build for the C library's ~3,000 definitions, plus memory and invalidation on `dlopen`; it wins only above ~100 lookups per start, and a program after LIBC-SELF-BIND makes ~30. Measured on the Skylake-SP host (fast products, user instructions from exec to exit, median of 21; host C library in brackets): empty dynamic main 763,388 -> 704,633 [101,856]; `/bin/true` under the loader 841,599 -> 768,496 [128,175]; 200 imported libc functions at their default versions (204 `GLOB_DAT`), marginal per lookup 1,947 -> 1,507 [674]. `hot_text_products`' own count of the empty main: fast 704,934, release 665,711 (release 743,209 before, COMPAT19-LDSO-COST). The first step alone measured 2,159 per lookup: it asked the definition side again for the origin, which walked the program's requirements and evicted memo slots; the origin now comes from the memo. The brief's bound (600 per lookup) is not reached: the remaining marginal is spread across straight-line code per call (Intel PT before the last two steps, per lookup: `reloc::target` ~325 of which the name hash loop ~130 at 11 instructions per byte, `Object::lookup` ~220, its candidate closure ~220, the memo ~140, `symbols::lookup` ~120, the relocation pass ~180), so the next step is structural: a relocation and its symbol decoded once, an object's tables validated once at `Object::new` so the per-lookup reads index inside the validated ranges, and versions by index through a per-object table.
'''
