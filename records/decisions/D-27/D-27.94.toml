body = '''
**`dlopen`ed TLS without `DF_STATIC_TLS`: a block per thread made on first access, not a place in the static surplus (DL-19, story TLS-DYNAMIC-BLOCKS; amends D-27.39's placement rule).** **Which objects:** an object whose `DT_FLAGS` has `DF_STATIC_TLS` (initial-exec accesses) keeps a place in the 64 KiB surplus as D-27.39 says. Any other gets a module ID and no static place (`Placed::tp_offset` is `ltls::NO_STATIC`); its module-table word is `ltls::DYNAMIC | p_align` (a `p_align` that is not a power of two refuses the object as malformed). A `TPOFF` relocation against such a block (initial-exec access from another `dlopen`ed object) fails the open with `cannot allocate memory in static TLS block`. **Making:** a thread's slot holds 0 until its first `__tls_get_addr` for the module (or a TLS descriptor through the dynamic trampoline, or `dlsym` of the module's `STT_TLS` symbol): the slow path maps the block (a private anonymous mapping of `p_memsz` rounded up to pages; over-mapped and trimmed for an alignment above 4 KiB) and copies the image a byte at a time through atomics, because the TLS descriptor trampoline keeps only the x87/SSE state and the C library's copy kernels may use AVX and `vzeroupper`. The `dlopen` walk and a new thread's start fill store 0 in those slots. **Failure:** a block that cannot be mapped ends the process with `cannot allocate memory for thread-local data: ABORT` on standard error and status 127, the reference's observed text and status (black-box probe: 1 GiB of `.tbss` under a 512 MiB `RLIMIT_AS`, from the main thread, a new thread, a TLS descriptor and `dlsym`); §27.3 Failure gives no error channel for the access. **Freeing:** at thread exit (only once a module with on-demand blocks has been published) the thread's slots are taken with an atomic swap to 0 and unmapped; `dlclose`'s release walk does the same for every listed thread, so exactly one of them frees each block. A vector grown while a walk exists moves its slots under the thread-list lock. **TLS descriptors:** a descriptor against such a block points at a three-word record `[resolver, module, offset]` in loader pages with a free list (released when the object is unloaded or its open fails); the resolver is `__tls_get_addr` of the record's last two words. **Surplus tunable (provisional coordinator decision #8009):** `glibc.rtld.optional_static_tls`, read at start-up in a cold step only when `GLIBC_TUNABLES` names it, raises the surplus: surplus = max(64 KiB, value); it never lowers it. **Gain:** 64 objects of 16 KiB global-dynamic TLS open at once (results/tls-surplus `run.sh` table D: 64 of 64 with and without a thread created first, as on the reference; 4 before), the surplus stays for the objects that need a static place, and memory goes only to threads that touch a module. **Cost:** none on the hot paths: `__tls_get_addr`'s fast path, the static descriptor and start-up objects are unchanged; the first access per thread and module is the cold path. Tests: `conformance/c/s27_dlopen_tls_dynamic.c` (s27_3_f_0), `s27_dlopen_tls_surplus.c` (its leak helper is initial-exec now, so its 80 failed opens still prove the place is given back), `s27_dlinfo.c`. Plants: handoff/TLS-DYNAMIC-BLOCKS.md.
'''
