body = '''
**The C-oracle sweeps keep the oracle's decided values across runs, keyed by the oracle and everything it is built from** (ORACLE-VALUE-CACHE, owner ruling 11-20 on #6825: "As long as the code doesn't change, the values shouldn't either"; amends the sweeps of D-10.57). The verdict cache (D-10.57) keys a shard on every libniji byte, so after any libniji change the five sweeps (complex_ld_cr, complex_f128, special_ld, special_f128, complex products) recomputed every oracle value, 86-97 % of a shard (D-10.129, D-10.130). `crates/math/tests/support/oracle_values.rs` now stores, per shard, the oracle's answers under `target/test-oracles/values/<shard>/<key id>`; libniji's and the reference's results are still read from the programs' outputs on every run and compared with the (stored or fresh) oracle value, so a line's checks are unchanged. (1) Key: the bytes of every workspace crate in `niji-mathtools`'s `Cargo.lock` closure, the name, version, source and checksum of every other package in it, the sweep's source (its `part`/`cr` wrappers fix the routine, the precisions and the Ziv cap), the cache's own source, the root `Cargo.toml` (build profiles), `rust-toolchain.toml`, `.cargo/config.toml`, `rustc -vV`, the compile-time and run-time `RUSTFLAGS`/`CARGO_PROFILE_*`/`CARGO_BUILD_*`/`CARGO_TARGET_*` settings, the target and the CPU flags line; an unreadable input stores and reads nothing. A value is found by its exact query (kind, function, rounding mode, part, operand encodings). (2) Canary: each file keeps two entries of each kind apart; on load the current oracle recomputes them and the file is discarded on any difference. (3) Only decided values are stored: a correctly rounded part with its inexact/underflow/overflow flags and the exact-zero bit, never an undecided one (finding #6890: fixed-precision approximations depend on which constants the process computed before). For the same reason the accuracy tally's reference value (the ulp errors of docs/libm-accuracy.tsv, random lines only) is no longer the oracle's approximation at `2 prec + 40` bits but the true value rounded to nearest at `prec + 40` bits, decided by Ziv's test from `prec + 64` bits (`tally_value`); its error is below 2^-40 ulp of the format, far below the table's printed 0.001, and its first evaluation is narrower than before (x87 128 bits instead of 168, binary128 177 instead of 266). Where that test cannot decide below `16 (prec + 40)` bits the last approximation is used, as before, and not stored. (4) A file holds only the values its shard asked for in the run that wrote it, is written to a temporary name and renamed (concurrent writers each leave a complete file, the last rename wins), ends with an entry count (a short file is not read), and saving removes the shard's files of other keys: at most one sweep's values per tree. (5) `NIJI_NO_VERDICT_CACHE=1` (the nightly and release runs) or `NIJI_NO_ORACLE_VALUES=1` computes every value and writes nothing. Like the verdict cache, the gain needs `target/` kept between runs on a role.
'''
