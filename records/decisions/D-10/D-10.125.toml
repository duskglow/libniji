body = '''
**Slice 11 headers (math.h, fenv.h, fpu_control.h, ieee754.h, values.h): `iscanonical`, `iseqsig`, `fenv.h`, and what the slice leaves out** (SL-HEADERS-S11, S11-2, re-ported as data only in S11-7; plan/headers.md slice 11). The headers are the generator's output from the tables and five templates; the slice changes no generator code. (1) `iscanonical` is 1 for float, double and `_Float128` and calls `__iscanonicall` for the x87 types: spec §10.2 (`canonicalize`) names the x87 pseudo-denormals as the non-canonical encodings and an encoding that represents no value (unnormals, pseudo-infinities, pseudo-NaNs) as non-canonical too; a black-box probe of the reference gives 0 for exactly those four encodings and 1 for 1.0, a denormal, infinity and a quiet NaN; GCC's manual lists no builtin. The spec, the probe and libniji agree, so there is no difference row and no compat flag (the library's `__iscanonicall` already tests the bits). (2) `iseqsig` is written on the relational operators, which raise "invalid" for a quiet NaN as the function must; no probe of the reference for that macro was run. (3) `fenv.h` declares `fegetexceptflag`/`fesetexceptflag` with `-Wbuiltin-declaration-mismatch` off around the declarations (the compiler's built-in takes `void *`, the ABI prototype `fexcept_t *`); its pointer-valued macros (`FE_DFL_ENV`, `FE_NOMASK_ENV`, `FE_DFL_MODE`) come from `macros.tsv` through `@@value`. (4) In C++ `math.h` includes `stdlib.h`: the C++ library's `<math.h>` wrapper takes `<cmath>`, which takes `<cstdlib>`, and `visibility.tsv` shows the names `stdlib.h` supplies in `math.h` in the C++ configurations. (5) Left out, for HEADERS-TABLES-COMPLETE (the tables cannot express them yet): `complex.h` and `tgmath.h` (their C++ rows are the C++ library wrappers' pull-ins, among them `pthread_attr_t`, a union typedef the generator spells without a C++ form, and the type-generic macros of `tgmath.h` have no table form); the 70 `_Float32/64/128/32x/64x` literal macros of `math.h` (`M_Ef32` ...: no literal form for those types; `headers/rows-exceptions.tsv` lists them); the Fortran include `math-vector-fortran.h`. The hexadecimal constants of `values.h` (`MAXDOUBLE`, `MAXFLOAT`, `MINDOUBLE`, `MINFLOAT`) are emitted as hex, which C89 and C++98 to C++14 cannot lex: `s11.py` asserts them from C99 and C++17 on; a decimal spelling belongs in the generator.
'''
