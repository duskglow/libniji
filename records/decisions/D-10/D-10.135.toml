body = '''
**Slice 11's complex.h and tgmath.h (amends D-10.125 (5))** (SL-HEADERS-COMPLEX-TGMATH; plan/headers.md slice 11). Both headers are the generator's output from the tables and two templates, with three slice markers (`xtask/src/headers/slices/s11.rs`); no generator code changes. (1) The C++ rows of visibility.tsv for these headers are the C++ library's: its wrappers read the C header in C++98 only and take `<complex>` and `<cmath>` in C++11 and later. The C header's content does not depend on the C++ standard, so `@@emit-c` emits a row in its C configurations plus every C++ configuration when C++98 shows it, and `header_checks/s11.py` asserts P1 the same way. (2) `spec/abi/typegeneric.tsv` (new, `spec/tools/tgmath_probe.py` on the reference system, 23474 rows in eight configurations) records per macro and argument types the functions called, the result type and the form (constant or run-time); `@@if-probe` takes the conditions of `_Complex_I` and the `CMPLX` family from it (the `_FloatN` forms from their functions' visibility rows, checked against the probe). (3) `CMPLX*` are `__builtin_complex` and `_Complex_I` is `1.0iF` (GCC manual), constant expressions as C 7.3.9.3 asks; `imaginary` and `_Imaginary_I` are not defined (no imaginary types). (4) Each tgmath.h macro is GCC's documented `__builtin_tgmath` over the float, double, long double, complex and, where math.h declares them (`_GNU_SOURCE`), `_FloatN` functions; `log10` takes `clog10` there; the narrowing macros list their functions in the order that makes the builtin select the reference's function for every type (the value is the same: each rounds once from an exact widening), and `d*` and `f64x*` call the widest function. In C++ the macros are defined and a use does not compile, as on the reference. (5) Proof: `header_checks/s11.py` P6 compares the tree with typegeneric.tsv in C89, C99, `_GNU_SOURCE` and C++98 (4264 cases, 0 differences; `tgmath_probe.py --check` in all eight: 8502 cases, 0 differences); `niji_cc_headers.rs` builds eleven programs shaped like the packages that include the headers and compares their output with the reference's; two plants (a float argument calling the double function, complex.h's declarations missing in C89) are caught.
'''
