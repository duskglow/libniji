body = '''
**Slice 11 headers: ieee754.h from the tables, bit-field offsets in layouts.tsv, isinf/isnan functions** (SL-HEADERS-S11-3; plan/headers.md slice 11). (1) `ieee754.h` is generated: the three unions (`ieee754_float`, `ieee754_double`, `ieee854_long_double`, each with `ieee` and `ieee_nan` views) come from `layouts.tsv` member rows. The generator writes each bit-field in table order and checks the row's first bit against the allocation of consecutive `unsigned int` bit-fields (no field crosses a 32-bit unit), so a row that the compiler would place elsewhere is a generation error and never a header with other bit positions. The unions are little-endian (x86-64). (2) `layouts.tsv` bit-field rows now say `bits W@K` with K the member's first bit counted from the start of the type; the extractor used to write 0 for every K because the probe is DWARF 4, where `DW_AT_bit_offset` counts from the top of the storage unit. The abi generator reads only W, so the generated layout tables and tests are unchanged for the other types. (3) The field proof is `spec/tools/ieee754_fields.c`: each check builds a value from one field and compares it with the number the field means in IEEE 754-2019 3.4 (binary32, binary64) and the x87 extended format (Intel SDM vol. 1, 8.2.2); a union read is not a constant expression in C, so the unit is compiled with `-O1 -S` and each check calls an `error`-attribute function that survives only if the comparison is not folded to true. (4) `@@if-macro NAME` in a template owns the macro of NAME only: `math.h` declares the functions `int isinf (double)` and `int isnan (double)` (the default, BSD, SVID and GNU configurations, and the XSI ones for `isnan`) beside the type-generic macros; before, `@@if isnan` owned the whole name and the function rows were not emitted (found by P2 and P3 against `visibility.tsv` and `callsites.tsv`). P2 and P3 on the slice's seven headers: the remaining rows differ only in C++ configurations (names the C++ standard library's wrapper headers add, which a probe with `-nostdinc` cannot see) and in reserved names; C configurations agree.
'''
