body = '''
**Slice 11 headers: ieee754.h from the tables, bit-field offsets in layouts.tsv, isinf/isnan functions** (SL-HEADERS-S11-3, re-ported as data only in S11-7; plan/headers.md slice 11). (1) `ieee754.h` is generated: the three unions (`ieee754_float`, `ieee754_double`, `ieee854_long_double`, each with `ieee` and `ieee_nan` views) come from `layouts.tsv` member rows (40 `union ieee754_*`/`ieee854_*` rows, bit-fields as `bits W@P` with P counted from the start of the type). The generator checks each row's first bit against the allocation of consecutive `unsigned int` bit-fields, so a row that the compiler would place elsewhere is a generation error and never a header with other bit positions. The unions are little-endian (x86-64). (2) The field proof is `spec/tools/ieee754_fields.c`, run from `problems()` of `header_checks/s11.py`: each check builds a value from one field and compares it with the number the field means in IEEE 754-2019 3.4 (binary32, binary64) and the x87 extended format (Intel SDM vol. 1, 8.2.2); a union read is not a constant expression in C, so the unit is compiled with `-O1 -S` and each check calls an `error`-attribute function that survives only if the comparison is not folded to true. It runs there and not as a `header_check.py` unit, whose units only parse. (3) `math.h` declares the functions `int isinf (double)` and `int isnan (double)` beside the type-generic macros (`@@owns-macro` owns the macro only; the function rows are still emitted), found by P2 and P3 against `visibility.tsv` and `callsites.tsv`. P2 and P3 on the slice's headers: the remaining rows differ only in C++ configurations (names the C++ standard library's wrapper headers add, which a probe with `-nostdinc` cannot see) and in reserved names; C configurations agree.
'''
