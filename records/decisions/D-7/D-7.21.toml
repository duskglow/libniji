body = '''
**Where a locale name is searched** (LOCALE-PER-DIR-LOAD, 2026-11-23; amends D-7.7's search order). Settled by black-box probes of the reference (setlocale for a table of names, a Zen 1 build host with per-locale directories and no archive; an archive beside directories in a user and mount namespace whose `/usr/lib/locale` was a directory the probe built; LOCPATH trees built from installed locales under made-up names). (1) When `LOCPATH` is unset, the archive is looked up under the name's archive form only (the codeset normalized, every component kept): `en_US.UTF-8@zz` does not find the archive's `en_US.utf8`. A record that holds the category decides it. (2) Then the name's candidates (Appendix D.1 order), each in every `LOCPATH` directory and then in `/usr/lib/locale`, which is searched even when `LOCPATH` is set (the archive is not): `xh_XH@m` in the second `LOCPATH` directory comes before `xh_XH` in the first; `LOCPATH=/nonexistent` still finds `/usr/lib/locale/en_US.utf8`. (3) The first place that holds the category file decides: when its `LC_CTYPE` codeset is not the requested one, the category is not found and no later candidate is tried (`de_DE.UTF-8@euro` with `de_DE@euro` at ISO-8859-15 and `de_DE.utf8` both installed: not found). A directory without the category file is passed over for that category only. Until this record libniji tried every candidate in the archive, searched one `LOCPATH` directory after another, never fell back to `/usr/lib/locale` under `LOCPATH`, and went on past a codeset mismatch. Tests: `locale_data` `search_order_follows_the_reference` (an in-memory layout and an archive the test makes, no host locale data), `locale_products`, `catalogs_products`.
'''
