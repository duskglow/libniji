tests = ["crates/core/tests/iconv_codespace_products.rs", "crates/core/src/iconv/cjk.rs", "crates/core/tests/s06_multibyte_clauses.rs::s6_4_c_1_charmap_aliases", "crates/core/tests/iconv_cmd_names.rs", "crates/core/tests/iconv_listing_products.rs", "crates/core/tests/iconv_products.rs"]
body = '''
**CP949 built in; the listed names that stand for a charmap come from a reproducible probe; `iconv -l` lists them** (issue #6: vim's `enc=cp949`, and `WINDOWS-1252`, `windows-1251`, `KOI8R`, `ISO885915` missing; amends D-6.18 and D-6.17). CP949 (Unified Hangul Code) is a sixth set of D-6.18's generic codec: its table is the Unicode Consortium's `VENDORS/MICSFT/WINDOWS/CP949.TXT` (table version 2.01, 1/7/2000), vendored unchanged; the reference's variant (`spec/encoding/reference/CP949.tsv`) holds no cell or encoding departure from that table, only the leads, the trails, the bytes skipped alone and that a skipping `//IGNORE` call ends with `EILSEQ`. Read-only data by generator output: CP949 108,801 bytes. Names, each probed on the reference to be one converter (whole dump hashed): CP949, UHC, MSCP949, OSF100203B5, any case (`CP-949`, `MS949`, `WINDOWS-949`, `KS_C_5601-1987`, `KSC5601` do not open there and stay out). The pair A2E8, which CP949.TXT does not assign, is an invalid sequence with nothing consumed and is skipped whole with `//IGNORE` (unit test `cp949_cells_and_unassigned_pair`). The table of listed names that stand for a charmap (D-6.17's table, 104 rows on next, by the same-letters-and-digits rule) is now data, `spec/encoding/iconv-aliases.tsv` (654 rows, the 104 earlier rows among them unchanged), and `csys/util/iconv-aliases.h` for the command, both written by `tools/probe/iconv_aliases.py` from a black-box probe of the reference: every name its `iconv -l` lists that is neither a built-in name nor a charmap file name gets a row naming the charmap whose reference conversion has the same fingerprint (`tools/probe/iconv_fingerprint.c`: every one- and two-byte input decoded, every BMP code point and a stride of the rest encoded). A charmap's conversion is taken through its file name and the names its installed file gives, not through the aliases libniji's generated charmaps add (CP9448, which CP1256's generated charmap carries, converts otherwise on the reference and has no row). `WINDOWS-1252` and `windows-1251` failed because only the generated charmaps carried them; they are rows now. The library reads the rows at compile time as byte offsets into the file's bytes (no relocation, no start-up page). 220 listed names have no conversion in libniji (EBCDIC and double-byte IBM sets with no installed charmap, `ISO-2022-*`, `UTF-7`, ...) and no row; names with a `/` are left out. Nineteen listed names that convert as a built-in (`ANSI_X3.4`, `CSWINDOWS31J`, `UNICODE`, ...) became built-in names. `iconv -l` also lists each row whose charmap is an installed file, or opens under another file's name (CP874 in IBM874's header; that charmap name is listed too, each such charmap tried once): on the reference system (Ubuntu 24.04 charmaps) libniji lists 982 of the reference's 1,180 names plus 26 charmap file names the reference does not list.
'''
