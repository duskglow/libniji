body = '''
**BIG5, EUC-KR, CP932, CP936 and GB18030 built in, their reference variants recorded as data** (issue #6: still missing for util-linux, wget, man-db and libpsl after D-6.16). One generic codec (`crates/core/src/iconv/cjk.rs`) reads tables that `cargo xtask encodings-gen` (`xtask/src/encodings_cjk.rs`) generates into `cjk_tables.rs` from public mapping tables vendored unchanged: the Unicode Consortium's `VENDORS/MICSFT/WINDOWS/CP950.TXT` (table version 2.01, 1/7/2000) for BIG5, `CP932.TXT` (2.01, 04/15/98), `CP936.TXT` (2.01, 1/7/2000), `OBSOLETE/EASTASIA/KSC/KSC5601.TXT` (1.1, 2011-10-14; its KS X 1001 part) for EUC-KR, and the WHATWG Encoding Standard's `index-gb18030.txt` (identifier ff1c9a92..., 2024-09-18) and `index-gb18030-ranges.txt` (f963aaa1..., 2024-09-18) for GB18030. Of the published tables for each set, the one with the fewest cells differing from the reference's converter was taken (BIG5: CP950.TXT 0 differing cells, BIG5.TXT 267). Where the reference's converter departs from the public table (bytes read alone, cells added or mapped differently, one-way encodings, four-byte GB18030 pointers off the ranges, `//IGNORE` skip lengths, how a skipping call ends), the departure is **data**, `spec/encoding/reference/<SET>.tsv`, written by `tools/probe/iconv_variant.py` from a black-box probe of the reference's whole code space (`tests/oracle/iconv_codespace.c`); unlike EUC-JP (D-6.15), the codec holds no per-set rules beyond GB18030's four-byte arithmetic. Names, each probed to be the same converter (whole dump hashed): BIG5, BIG-5, BIG-FIVE, BIGFIVE, CN-BIG5, CP950; EUC-KR, EUCKR, CSEUCKR, OSF0004000A; GB18030; CP932, MS932, WINDOWS-31J, SJIS-OPEN, SJIS-WIN; CP936, GBK, MS936, WINDOWS-936, GB13000 (SJIS, IBM-943 and GB2312 are other converters, not added). Layout per set: the bytes 0x80..0xFF (one array), the two-byte cells by lead (row index of offset and trail span into packed cells), skip bitmaps, and the encoder as 64-code-point pages over the BMP with identical pages shared; GB18030's four-byte area is the ranges (binary search) plus a linear map from U+10000. Read-only data in libc, by generator output: BIG5 82,961 bytes, EUC-KR 89,101, CP932 72,982, CP936 95,030, GB18030 107,594. Probed behaviour kept: a lead (and a GB18030 lead and digit, with or without a third byte) at the end of the input is incomplete (`EINVAL`); an invalid GB18030 four-byte sequence is skipped as four bytes when its third byte is a lead, else three; with `//IGNORE`, CP932 reports skipped input as success, the other four end with `EILSEQ`. The code-space comparison (`iconv_codespace_products.rs`) covers all five; GB18030's sequences longer than two bytes are compared as one hash per two-byte prefix (the oracle's `-c`), its full listing being 165 million lines.
'''
