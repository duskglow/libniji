# /etc/gai.conf: configuration of getaddrinfo's address sorting (libc-bin, libniji).
#
# With no "label", "precedence" or "scopev4" line, getaddrinfo sorts destination addresses
# by the default policy table of RFC 6724. The keywords and their syntax are in gai.conf(5);
# a line given here replaces the whole default table of its kind.
