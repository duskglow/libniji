# /etc/nsswitch.conf: name service switch configuration, nsswitch.conf(5).
# Installed by libc-bin (libniji) when the system has none; edit it freely afterwards.
# libniji's built-in services are "files" and, for hosts, "dns".

passwd:         files
group:          files
shadow:         files
gshadow:        files

hosts:          files dns
networks:       files

protocols:      files
services:       files
ethers:         files
rpc:            files
