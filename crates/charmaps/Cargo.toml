# The charmaps of the charsets libniji's iconv converts with its built-in codecs (LOCALE-CHARMAPS-GEN,
# spec §31.8, POSIX.1-2017 XBD 6.4), read off those codecs. A host tool: `cargo xtask so` runs its
# program into target/niji/locale-charmaps, which the `locales` package ships gzipped in
# /usr/share/i18n/charmaps for localedef. Not a product crate (nothing of it is linked into libc).
[package]
name = "niji-charmaps"
description = "Generates POSIX charmaps from libniji's built-in iconv codecs (localedef's input)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "niji_charmaps"

[[bin]]
name = "niji-charmaps"
path = "src/main.rs"
test = false

[dependencies]
# The codecs (`niji::iconv`), the charmap parser the tests read the output with, and the widths.
niji = { workspace = true }

[lints]
workspace = true
