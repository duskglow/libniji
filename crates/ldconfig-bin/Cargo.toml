# Product crate for the shipped ldconfig (UTIL-3, spec §31.2; D-31.2: a freestanding static program
# with no C library, so dpkg can run it while libc6 is replaced). In the product workspace
# (crates/Cargo.toml) like ld-so; built, linked as a static PIE and checked by `cargo xtask so`
# into target/niji/ldconfig.
[package]
name = "niji-ldconfig-bin"
description = "Product crate: links the ldconfig entry (boundary feature `ldconfig`) into a static program"
version = "0.0.0"
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false

[lib]
name = "ldconfig_bin"
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
niji-boundary = { path = "../boundary", features = ["ldconfig"] }

# Profiles: crates/Cargo.toml (the product workspace).
