[package]
name = "niji-boundary"
description = "The only crate allowed unsafe: C interop in both directions (C syscall layer below, C callers above)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
links = "niji_csys"

[lib]
name = "niji_boundary"

[features]
# Emit #[unsafe(no_mangle)] C symbols. Enabled only by the shipped products (crates/libc-so).
export = []
# The process runtime's exports and data objects (`__libc_start_main`, `exit`, `__errno_location`,
# `environ`, ...): only a process libniji started can use them, so only the products enable this.
# Test builds with `export` keep the host C library's runtime (D-4.13).
runtime = ["export"]
# The libm product (`crates/libm-so`): emit the math symbols `libm.so.6` and `libm.a` own (spec §10).
# Independent of `export`: the libm archive carries no libc symbols, and test builds with `export`
# never interpose on the host libm that Rust's own `f64` functions call.
libm = []
# The libresolv product (`crates/libresolv-so`, LIBRESOLV-OWN-CODE): emit the libresolv.so.2 names
# whose code reaches the C library only through its exports (`export! { libc_libresolv ... }`), so
# that code lives in libresolv.so.2 rather than in every process's libc.so.6. With `export` the
# same names are libc.a's (a static `-lresolv` link, D-16.6).
libresolv = []
# Test-only helpers (`selftest`): forked children, a signal round trip. Enabled for this
# crate's own tests through the self dev-dependency below; never by a product.
selftest = ["niji/selftest", "niji-legacy/selftest"]
# Test-only (A-8): run the portable Rust scanners (`strz::portable`) in place of machine/scan.S's
# on x86_64, so the kernel suites test both paths. Never enabled by a product.
portable-scan = []
# The ld.so product (`crates/ld-so`, phase 14 DL-5): its start (`ld`), the self-relocator and the
# loader's arch seam (`arch/`). Never with `runtime`/`export` in a product.
ld = []
# The ldconfig product (`crates/ldconfig-bin`, UTIL-3, D-31.2): a freestanding static program that
# starts as ld.so does (`ld`'s self-relocator and memory symbols), with its own entry and arena.
ldconfig = ["ld"]
# The localedef product (`crates/localedef-bin`, UTIL-12, spec §31.8): freestanding and static as
# ldconfig is (its self-relocator, arena and file layer), over `niji-locale`, with its own entry.
localedef = ["ldconfig", "dep:niji-locale"]

[dependencies]
niji-kernel = { workspace = true }
niji-rt = { workspace = true }
niji-ld = { workspace = true }
niji-abi = { workspace = true }
niji = { workspace = true }
niji-legacy = { workspace = true }
niji-locale = { workspace = true, optional = true }
niji-math = { workspace = true }

[dev-dependencies]
spectest = { workspace = true }
niji-boundary = { path = ".", features = ["selftest"] }

# Not `workspace = true`: this crate must lower `unsafe_code` from forbid to deny so that the
# four permitted categories can be allowed item by item (implementation-plan.md §2.1).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
mem_forget = "deny"
# S8: allowed by default (tests, examples); the crate root denies it outside tests (clippy.toml).
disallowed_methods = "allow"
